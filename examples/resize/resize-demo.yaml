# In-place resize demo (Kubernetes 1.33+, kubectl 1.32+)
#   kubectl apply -f resize-demo.yaml
#   kubectl edit pod resize-demo --subresource resize      # cpu 700m -> 800m in BOTH places (Guaranteed)
#   kubectl get pod resize-demo                            # RESTARTS 0: cpu is NotRequired
#   kubectl edit pod resize-demo --subresource resize      # memory 200Mi -> 300Mi in both places
#   kubectl get pod resize-demo                            # RESTARTS 1: memory is RestartContainer
apiVersion: v1
kind: Pod
metadata:
  name: resize-demo
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "3600"]
    resizePolicy:
    - resourceName: cpu
      restartPolicy: NotRequired
    - resourceName: memory
      restartPolicy: RestartContainer
    resources:
      requests:
        cpu: 700m
        memory: 200Mi
      limits:
        cpu: 700m
        memory: 200Mi
