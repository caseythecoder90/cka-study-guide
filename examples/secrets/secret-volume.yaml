# Secret app-secret with base64 data and plain stringData, consumed by one Pod
# three ways: one key as env, every key via envFrom, and every key as files.
#   kubectl apply -f secret-volume.yaml
#   kubectl exec secret-demo -- env | grep DB_
#   kubectl exec secret-demo -- ls -l /opt/app-secret-volumes
#   kubectl get secret app-secret -o jsonpath='{.data.DB_Password}' | base64 -d
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
type: Opaque
data:
  DB_Host: bXlzcWw=          # echo -n 'mysql' | base64
  DB_User: cm9vdA==          # echo -n 'root'  | base64
stringData:
  DB_Password: paswrd        # encoded into data by the API server
---
apiVersion: v1
kind: Pod
metadata:
  name: secret-demo
spec:
  containers:
  - name: app
    image: busybox
    command: ["sleep", "3600"]
    env:
    - name: PASSWORD
      valueFrom:
        secretKeyRef:
          name: app-secret
          key: DB_Password
    envFrom:
    - secretRef:
        name: app-secret
    volumeMounts:
    - name: app-secret-volume
      mountPath: /opt/app-secret-volumes
      readOnly: true
  volumes:
  - name: app-secret-volume
    secret:
      secretName: app-secret
      defaultMode: 0400
