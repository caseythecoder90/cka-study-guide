# Two PriorityClasses and a Pod that uses one.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: high-priority
value: 1000000000
description: "Mission-critical Pods; may preempt lower-priority Pods"
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: high-priority-nonpreempting
value: 1000000000
preemptionPolicy: Never
description: "Scheduled first, but waits instead of evicting other Pods"
---
apiVersion: v1
kind: Pod
metadata:
  name: nginx
spec:
  priorityClassName: high-priority
  containers:
  - name: nginx
    image: nginx:1.27
