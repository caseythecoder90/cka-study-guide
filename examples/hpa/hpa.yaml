# HPA demo (needs metrics-server; check with: kubectl top pods)
#   kubectl apply -f hpa.yaml
#   kubectl get hpa my-app -w
#   kubectl run load --image=busybox:1.36 -- sh -c "while true; do wget -q -O- http://my-app; done"
#   kubectl delete pod load            # replicas fall after about a minute
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
spec:                                  # no replicas field: the HPA owns it
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - name: my-app
        image: registry.k8s.io/hpa-example
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 250m                  # 50% target = 125m per Pod
          limits:
            cpu: 500m
---
apiVersion: v1
kind: Service
metadata:
  name: my-app
spec:
  selector:
    app: my-app
  ports:
  - port: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: my-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: my-app
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60   # default 300
