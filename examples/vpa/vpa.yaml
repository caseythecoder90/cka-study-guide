# VPA demo (needs metrics-server and the VPA add-on installed)
#   kubectl apply -f vpa.yaml
#   kubectl describe vpa my-app-vpa        # Recommendation appears after a few minutes
#   kubectl get pods -l app=my-app -w      # Recreate: Pods are evicted and come back bigger
#   kubectl get pods -l app=my-app -o jsonpath='{.items[*].spec.containers[0].resources}'
#   kubectl get deploy my-app -o jsonpath='{.spec.template.spec.containers[0].resources}'   # unchanged
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
spec:
  replicas: 2                        # the updater needs 2 live replicas by default
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - name: my-app
        image: busybox:1.36
        command: ["sh", "-c", "while true; do timeout 1 yes >/dev/null; sleep 1; done"]
        resources:
          requests:
            cpu: 100m                # actual use is about 500m
            memory: 50Mi
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: my-app-vpa
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: my-app
  updatePolicy:
    updateMode: "Recreate"           # Off = recommendations only
  resourcePolicy:
    containerPolicies:
    - containerName: my-app
      minAllowed:
        cpu: 100m
      maxAllowed:
        cpu: "1"
      controlledResources: ["cpu"]
