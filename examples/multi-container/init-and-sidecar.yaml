# A sidecar (init container with restartPolicy: Always) and a regular init container.
# The Pod waits in Init until the db Service has a ready endpoint:
#   kubectl apply -f init-and-sidecar.yaml
#   kubectl get pod app                       # Init:1/2, waiting for db
#   kubectl logs app -c wait-for-db
#   kubectl run db --image=postgres:16 --env=POSTGRES_PASSWORD=lab --port=5432 --expose
#   kubectl get pod app -w                    # Running, READY 2/2 (the sidecar counts)
#   kubectl logs app -c log-shipper -f
apiVersion: v1
kind: Pod
metadata:
  name: app
spec:
  volumes:
  - name: logs
    emptyDir: {}
  initContainers:
  - name: log-shipper
    image: busybox:1.36
    command: ["sh", "-c", "tail -n+1 -F /var/log/app/app.log"]
    restartPolicy: Always
    volumeMounts:
    - name: logs
      mountPath: /var/log/app
  - name: wait-for-db
    image: busybox:1.36
    command: ["sh", "-c", "until nc -z db 5432; do echo waiting; sleep 2; done"]
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "while true; do date >> /var/log/app/app.log; sleep 5; done"]
    volumeMounts:
    - name: logs
      mountPath: /var/log/app
