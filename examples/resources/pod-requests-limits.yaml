# Burstable Pod: guaranteed 250m CPU and 64Mi, may burst to 500m and 128Mi.
# Chapter: notes/03-scheduling/07-resource-requirements.md
apiVersion: v1
kind: Pod
metadata:
  name: simple-webapp-color
spec:
  containers:
  - name: simple-webapp-color
    image: nginx
    resources:
      requests:
        cpu: 250m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 128Mi
