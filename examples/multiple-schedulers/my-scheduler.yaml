# Config for a second scheduler. Load it with:
#   kubectl -n kube-system create configmap my-scheduler-config --from-file=my-scheduler-config.yaml
# (save the KubeSchedulerConfiguration document below as my-scheduler-config.yaml first)
#
# apiVersion: kubescheduler.config.k8s.io/v1
# kind: KubeSchedulerConfiguration
# profiles:
# - schedulerName: my-scheduler
# leaderElection:
#   leaderElect: false
---
apiVersion: v1
kind: Pod
metadata:
  name: my-scheduler
  namespace: kube-system
spec:
  serviceAccountName: my-scheduler   # needs ClusterRoleBindings to system:kube-scheduler and system:volume-scheduler
  containers:
  - name: my-scheduler
    image: registry.k8s.io/kube-scheduler:v1.34.0   # use the cluster's version
    command:
    - kube-scheduler
    - --config=/etc/kubernetes/my-scheduler/my-scheduler-config.yaml
    volumeMounts:
    - name: config-volume
      mountPath: /etc/kubernetes/my-scheduler
  volumes:
  - name: config-volume
    configMap:
      name: my-scheduler-config
---
apiVersion: v1
kind: Pod
metadata:
  name: nginx
spec:
  schedulerName: my-scheduler
  containers:
  - name: nginx
    image: nginx
