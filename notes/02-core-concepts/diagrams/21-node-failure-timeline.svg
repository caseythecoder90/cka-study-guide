<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="201px" preserveAspectRatio="none" style="width:1172px;height:201px;background:#FFFFFF;" version="1.1" viewBox="0 0 1172 201" width="1172px" zoomAndPan="magnify"><title>A node stops responding: what the node controller does, and when (current defaults)</title><defs/><g><g class="title" data-source-line="3"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="730.0459" x="217.9771" y="30.8838">A node stops responding: what the node controller does, and when (current defaults)</text></g><!--entity t0--><g class="entity" data-qualified-name="t0" data-source-line="5" id="ent0002"><rect fill="#DCFCE7" height="83.1953" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="157.6152" x="6" y="68.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="26.3745" x="20" y="94.3921">t = 0</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="84.5317" x="20" y="109.3408">last heartbeat</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="129.6152" x="20" y="122.4136">kubelet renews its Lease</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="86.2114" x="20" y="135.0625">about every 10 s</text></g><!--entity t1--><g class="entity" data-qualified-name="t1" data-source-line="6" id="ent0003"><rect fill="#EFF6FF" height="70.5464" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="170.3208" x="200" y="74.1982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="55.6626" x="214" y="100.3921">every 5 s</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="142.3208" x="214" y="115.3408">node controller checks</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="115.4785" x="214" y="128.4136">--node-monitor-period</text></g><!--entity t2--><g class="entity" data-qualified-name="t2" data-source-line="7" id="ent0004"><rect fill="#FEE2E2" height="95.8442" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="196.7114" x="406" y="61.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="44.4463" x="420" y="87.8921">t = 50 s</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="145.9199" x="420" y="102.8408">node marked unhealthy</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="148.4946" x="420" y="115.9136">--node-monitor-grace-period</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="124.3784" x="420" y="128.5625">Ready = Unknown, taint</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="168.7114" x="420" y="141.2114">node.kubernetes.io/unreachable</text></g><!--entity t3--><g class="entity" data-qualified-name="t3" data-source-line="8" id="ent0005"><rect fill="#FEE2E2" height="83.1953" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="229.3892" x="639" y="68.1982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="91.3364" x="653" y="94.3921">t &#8776; 50 s + 300 s</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="80.1963" x="653" y="109.3408">Pods evicted</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="149.1123" x="653" y="122.4136">their default toleration of the</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="201.3892" x="653" y="135.0625">taint (tolerationSeconds=300) runs out</text></g><!--entity t4--><g class="entity" data-qualified-name="t4" data-source-line="9" id="ent0006"><rect fill="#DCFCE7" height="83.1953" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="262.7007" x="904" y="68.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="27.4409" x="918" y="94.3921">then</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="83.8208" x="918" y="109.3408">replacements</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="176.0698" x="918" y="122.4136">ReplicaSet controller creates new</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="234.7007" x="918" y="135.0625">Pods; scheduler puts them on healthy nodes</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" id="lnk7"><polygon fill="#475569" points="199.7969,109.6982,190.7969,105.6982,194.7969,109.6982,190.7969,113.6982,199.7969,109.6982" style="stroke:#475569;stroke-width:1;"/><path d="M164.2548,109.6982 C175.9291,109.6982 182.0062,109.6982 193.7969,109.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" id="lnk8"><polygon fill="#475569" points="405.8615,109.6982,396.8615,105.6982,400.8615,109.6982,396.8615,113.6982,405.8615,109.6982" style="stroke:#475569;stroke-width:1;"/><path d="M370.0912,109.6982 C381.8061,109.6982 387.924,109.6982 399.8615,109.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" id="lnk9"><polygon fill="#475569" points="638.8446,109.6982,629.8446,105.6982,633.8446,109.6982,629.8446,113.6982,638.8446,109.6982" style="stroke:#475569;stroke-width:1;"/><path d="M603.1209,109.6982 C614.8525,109.6982 620.9102,109.6982 632.8446,109.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" data-link-type="dependency" id="lnk10"><polygon fill="#475569" points="903.7737,109.6982,894.7737,105.6982,898.7737,109.6982,894.7737,113.6982,903.7737,109.6982" style="stroke:#475569;stroke-width:1;"/><path d="M868.3867,109.6982 C880.0449,109.6982 885.9536,109.6982 897.7737,109.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="16"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="701.9414" x="232.0293" y="169.8301">The course's "grace period 40 s" and "pod eviction timeout 5 m" are older defaults: the grace period is 50 s today,</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="741.583" x="212.2085" y="185.9287">and --pod-eviction-timeout was removed in favour of taints plus a per-Pod toleration (5 min unless the Pod sets its own).</text></g><?plantuml-src TLFBRjim4BphAxQ-D44ZF-BaaZe2