<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="604px" preserveAspectRatio="none" style="width:784px;height:604px;background:#FFFFFF;" version="1.1" viewBox="0 0 784 604" width="784px" zoomAndPan="magnify"><title>What dockershim did, and why removing it took a hop out</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="495.0264" x="140.7744" y="30.8838">What dockershim did, and why removing it took a hop out</text></g><!--cluster before--><g class="cluster" data-qualified-name="before" data-source-line="4" id="ent0002"><rect fill="#FEF2F2" height="515" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="305" x="122.7876" y="53.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="281.0361" x="134.7695" y="71.8921">Before v1.24 &#8212; Docker Engine as the runtime</text></g><!--cluster after--><g class="cluster" data-qualified-name="after" data-source-line="16" id="ent0012"><rect fill="#F0FDF4" height="435" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="241" x="435.7876" y="53.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="217.4263" x="447.5745" y="71.8921">Today &#8212; containerd as the runtime</text></g><!--entity k1--><g class="entity" data-qualified-name="before.k1" data-source-line="5" id="ent0003"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="87.3076" x="315.2876" y="86.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="45.5127" x="329.2876" y="112.8921">kubelet</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="59.3076" x="329.2876" y="125.9648">speaks CRI</text></g><!--entity shim--><g class="entity" data-qualified-name="before.shim" data-source-line="6" id="ent0004"><rect fill="#FEE2E2" height="68.2466" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="224.1953" x="195.7876" y="203.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="72.9727" x="209.7876" y="229.8921">dockershim</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="196.1953" x="209.7876" y="242.9648">translator compiled INTO the kubelet:</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="189.5137" x="209.7876" y="255.6138">CRI calls &#8594; Docker Engine API calls</text></g><!--entity dockerd--><g class="entity" data-qualified-name="before.dockerd" data-source-line="7" id="ent0005"><rect fill="#F1F5F9" height="68.2466" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="187.0112" x="214.2876" y="332.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="143.7871" x="228.2876" y="358.8921">dockerd (Docker Engine)</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="157.1313" x="228.2876" y="371.9648">CLI, API, build, volumes, auth ...</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="159.0112" x="228.2876" y="384.6138">none of it needed by Kubernetes</text></g><!--entity c1--><g class="entity" data-qualified-name="before.c1" data-source-line="8" id="ent0006"><rect fill="#EFF6FF" height="42.9487" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="94.4536" x="260.7876" y="437.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="66.4536" x="274.7876" y="463.8921">containerd</text></g><!--entity r1--><g class="entity" data-qualified-name="before.r1" data-source-line="9" id="ent0007"><rect fill="#EFF6FF" height="42.9487" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="56.1709" x="279.7876" y="517.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="28.1709" x="293.7876" y="543.8921">runc</text></g><!--entity k2--><g class="entity" data-qualified-name="after.k2" data-source-line="17" id="ent0013"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="87.3076" x="512.2876" y="86.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="45.5127" x="526.2876" y="112.8921">kubelet</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="59.3076" x="526.2876" y="125.9648">speaks CRI</text></g><!--entity c2--><g class="entity" data-qualified-name="after.c2" data-source-line="18" id="ent0014"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="122.6978" x="494.2876" y="209.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="66.4536" x="508.2876" y="235.8921">containerd</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="94.6978" x="508.2876" y="248.9648">built-in CRI plugin</text></g><!--entity r2--><g class="entity" data-qualified-name="after.r2" data-source-line="19" id="ent0015"><rect fill="#EFF6FF" height="42.9487" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="56.1709" x="527.7876" y="345.1982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="28.1709" x="541.7876" y="371.3921">runc</text></g><!--entity gap--><g class="entity" data-qualified-name="after.gap" data-source-line="20" id="ent0016"><rect fill="#FFFFFF" height="42.9487" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="212.2852" x="449.7876" y="437.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="184.2852" x="463.7876" y="463.8921">(no Docker Engine on the node)</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" id="lnk8"><polygon fill="#475569" points="321.7388,203.5982,328.9204,196.8584,323.6808,198.9908,321.5485,193.7512,321.7388,203.5982" style="stroke:#475569;stroke-width:1;"/><path d="M347.3422,142.853 C339.7652,160.8298 332.111,178.9897 324.0692,198.0693" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" id="lnk9"><polygon fill="#475569" points="307.7876,332.3862,311.7876,323.3862,307.7876,327.3862,303.7876,323.3862,307.7876,332.3862" style="stroke:#475569;stroke-width:1;"/><path d="M307.7876,271.7345 C307.7876,290.4022 307.7876,307.6734 307.7876,326.3862" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="60.6855" x="313.7876" y="306.9541">Docker API</text></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" data-link-type="dependency" id="lnk10"><polygon fill="#475569" points="307.7876,437.6447,311.7876,428.6447,307.7876,432.6447,303.7876,428.6447,307.7876,437.6447" style="stroke:#4