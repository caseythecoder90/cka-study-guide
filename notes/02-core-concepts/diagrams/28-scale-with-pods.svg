<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="357px" preserveAspectRatio="none" style="width:726px;height:357px;background:#FFFFFF;" version="1.1" viewBox="0 0 726 357" width="726px" zoomAndPan="magnify"><title>Scale by adding Pods, never by adding the same container to a Pod</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="579.1377" x="69.9189" y="30.8838">Scale by adding Pods, never by adding the same container to a Pod</text></g><!--cluster good--><g class="cluster" data-qualified-name="good" data-source-line="4" id="ent0002"><rect fill="#F0FDF4" height="138" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="541" x="100.4878" y="53.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="366.2026" x="187.8865" y="71.8921">Right: one app container per Pod, more Pods for more load</text></g><!--cluster nb--><g class="cluster" data-qualified-name="good.nb" data-source-line="5" id="ent0003"><rect fill="#F8FAFC" height="97" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="247" x="386.4878" y="86.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="223.1963" x="398.3896" y="104.8921">node02  (added when node01 is full)</text></g><!--cluster na--><g class="cluster" data-qualified-name="good.na" data-source-line="8" id="ent0005"><rect fill="#F8FAFC" height="97" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="244" x="134.4878" y="86.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="45.5127" x="233.7314" y="104.8921">node01</text></g><!--cluster bad--><g class="cluster" data-qualified-name="bad" data-source-line="16" id="ent0010"><rect fill="#FEF2F2" height="122" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="402" x="100.4878" y="199.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="334.4326" x="134.2715" y="217.8921">Wrong: a second copy of the app inside the same Pod</text></g><!--entity p3--><g class="entity" data-qualified-name="good.nb.p3" data-source-line="6" id="ent0004"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="87.877" x="482.4878" y="119.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="24.5527" x="496.4878" y="145.8921">Pod</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="59.877" x="496.4878" y="158.9648">python-app</text></g><!--entity p1--><g class="entity" data-qualified-name="good.na.p1" data-source-line="9" id="ent0006"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="87.877" x="176.4878" y="119.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="24.5527" x="190.4878" y="145.8921">Pod</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="59.877" x="190.4878" y="158.9648">python-app</text></g><!--entity p2--><g class="entity" data-qualified-name="good.na.p2" data-source-line="10" id="ent0007"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="87.877" x="282.4878" y="119.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="24.5527" x="296.4878" y="145.8921">Pod</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="59.877" x="296.4878" y="158.9648">python-app</text></g><!--entity pbad--><g class="entity" data-qualified-name="bad.pbad" data-source-line="17" id="ent0011"><rect fill="#FEE2E2" height="80.8955" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="350.749" x="142.9878" y="232.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="24.5527" x="156.9878" y="258.8921">Pod</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="138.4023" x="156.9878" y="271.9648">python-app  +  python-app</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="322.749" x="156.9878" y="284.6138">both always on the same node, scaled and restarted together,</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="148.5161" x="156.9878" y="297.2627">competing for the same port</text></g><g class="caption" data-source-line="22"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="708.9756" x="5" y="341.8301">Scale up: create Pods. Scale down: delete Pods. In practice a Deployment does both for you by changing replicas.</text></g><?plantuml-src fLF1ZjGm3BttAyoUGCoqTBbLLGzefHKt10SEmC6JUDk8D8wIb551--yuxLAwEt1QQJfgO_lv-VdbXN7AJfgWBAlrbvXjhBJ1Fk0OA_KTZscWaKe_ZRP89bc2Jmhb_pG3QcrS3nzOnmCu-a5XTofb474aKEmI6YV1n80vkoW2gOIk5vYhZwOVKWFi2D3xNRQNHv8FC7AWfGdSSLY_BAE-WhRj0q_-bbbt7M24NjxWLm6mmtUiwSqrm4lXHHhE0pbOpcemWZXP-sf3Mb7SQS5uX2Bjlxescf_Kr7NdvpImEmhVjifdtOAmqV1lfVp-7pJg