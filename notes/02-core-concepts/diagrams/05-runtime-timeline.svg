<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="172px" preserveAspectRatio="none" style="width:1172px;height:172px;background:#FFFFFF;" version="1.1" viewBox="0 0 1172 172" width="1172px" zoomAndPan="magnify"><title>How Kubernetes got from "Docker only" to "any CRI runtime"</title><defs/><g><g class="title" data-source-line="3"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="527.1943" x="319.4028" y="30.8838">How Kubernetes got from "Docker only" to "any CRI runtime"</text></g><!--entity t1--><g class="entity" data-qualified-name="t1" data-source-line="5" id="ent0002"><rect fill="#FEE2E2" height="83.1953" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="200.3691" x="6" y="61.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="62.1689" x="20" y="87.8921">2013-2016</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="74.4136" x="20" y="102.8408">Docker only</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="172.3691" x="20" y="115.9136">kubelet has Docker code built in;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="138.1445" x="20" y="128.5625">Docker is the only runtime</text></g><!--entity t2--><g class="entity" data-qualified-name="t2" data-source-line="6" id="ent0003"><rect fill="#EFF6FF" height="83.1953" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="240.7007" x="242" y="61.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="93.2344" x="256" y="87.8921">Dec 2016 &#183; v1.5</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="93.1646" x="256" y="102.8408">CRI introduced</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="212.7007" x="256" y="115.9136">a plugin API any runtime can implement;</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="181.5698" x="256" y="128.5625">dockershim keeps Docker working</text></g><!--entity t3--><g class="entity" data-qualified-name="t3" data-source-line="7" id="ent0004"><rect fill="#EFF6FF" height="83.1953" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="199.7676" x="519" y="61.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="28.9199" x="533" y="87.8921">2017</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="145.1646" x="533" y="102.8408">containerd to the CNCF</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="171.7676" x="533" y="115.9136">Docker donates its core runtime;</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="155.2354" x="533" y="128.5625">containerd gains a CRI plugin</text></g><!--entity t4--><g class="entity" data-qualified-name="t4" data-source-line="8" id="ent0005"><rect fill="#EFF6FF" height="83.1953" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="173.9453" x="755" y="61.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="100.4644" x="769" y="87.8921">Dec 2020 &#183; v1.20</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="145.9453" x="769" y="102.8408">dockershim deprecated</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="136.9307" x="769" y="115.9136">Docker Engine still works,</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="76.3931" x="769" y="128.5625">with a warning</text></g><!--entity t5--><g class="entity" data-qualified-name="t5" data-source-line="9" id="ent0006"><rect fill="#DCFCE7" height="83.1953" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="201.583" x="965" y="61.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="101.9053" x="979" y="87.8921">May 2022 &#183; v1.24</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="130.7744" x="979" y="102.8408">dockershim removed</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="130.2061" x="979" y="115.9136">kubelet speaks only CRI:</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="173.583" x="979" y="128.5625">containerd, CRI-O, or cri-dockerd</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" id="lnk7"><polygon fill="#475569" points="241.8767,103.1982,232.8767,99.1982,236.8767,103.1982,232.8767,107.1982,241.8767,103.1982" style="stroke:#475569;stroke-width:1;"/><path d="M206.1251,103.1982 C217.8489,103.1982 223.908,103.1982 235.8767,103.1982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" id="lnk8"><polygon fill="#475569" points="518.7268,103.1982,509.7268,99.1982,513.7268,103.1982,509.7268,107.1982,518.7268,103.1982" style="stroke:#475569;stroke-width:1;"/><path d="M483.2977,103.1982 C495.1588,103.1982 501.1065,103.1982 512.7268,103.1982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" id="lnk9"><polygon fill="#475569" points="754.9574,103.1982,745.9574,99.1982,749.9574,103.1982,745.9574,107.1982,754.9574,103.1982" style="stroke:#475569;stroke-width:1;"/><path d="M719.1871,103.1982 C731.1209,103.1982 737.2326,103.1982 748.9574,103.1982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" data-link-type="dependency" id="lnk10"><polygon fill="#475569" points="964.8583,103.1982,955.8583,99.1982,959.8583,103.1982,955.8583,107.1982,964.8583,103.1982" style="stroke:#475569;stroke-width:1;"/><path d="M929.1487,103.1982 C940.8492,103.1982 946.9381,103.1982 958.8583,103.1982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="16"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="633.377" x="266.3115" y="156.8301">Images built with Docker were never affected: they are OCI images, and every CRI runtime runs them.</text></g><?plantuml-src VPF1Zfim48RlFCMKSqWMacsb525LsLQDgdQhddDny8HOc36oXqJfY_NU9wiDOKKsgqe8Hc8yy_qplzyfAdKd4URpnV2mCTejf1AL5OrRbBL8-8WDpjkkqP760mCRiAewCaXbiMHbA6B56k6hESEtRe-MaD51PHWErZGGFvcoHWk6z2KEnsD15zZyseBjY5M3SHI5Ie8gNoNE7j9bub_lTpGvkAFSgT-uJjEYzZqqCXo5Wsj6QRo8VQSqWwAF-IAa5fCZrpJbmAlfwuszhxanvFbUoA80NvJJASyJbX1muEyVEANpnnq5T4LiZUnAb9Cs0bhTLOhWqyyj197N9b0A0jMqsa-I-0q-sVEvesgWH