<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="390px" preserveAspectRatio="none" style="width:1074px;height:390px;background:#FFFFFF;" version="1.1" viewBox="0 0 1074 390" width="1074px" zoomAndPan="magnify"><title>A helper belongs in the app's Pod: Kubernetes does the wiring Docker left to you</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="693.3691" x="182.8154" y="30.8838">A helper belongs in the app's Pod: Kubernetes does the wiring Docker left to you</text></g><!--cluster docker--><g class="cluster" data-qualified-name="docker" data-source-line="4" id="ent0002"><rect fill="#FEF2F2" height="299" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="278" x="14" y="85.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="236.9326" x="34.5337" y="103.8921">Plain Docker: you maintain the pairing</text></g><!--cluster k8s--><g class="cluster" data-qualified-name="k8s" data-source-line="12" id="ent0008"><rect fill="#F0FDF4" height="238" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="768" x="300" y="53.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="200.7764" x="583.6118" y="71.8921">Kubernetes: one Pod holds both</text></g><!--cluster pod--><g class="cluster" data-qualified-name="k8s.pod" data-source-line="13" id="ent0009"><rect fill="#F8FAFC" height="197" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="402" x="334" y="86.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="177.0107" x="446.4946" y="104.8921">Pod  &#183;  one IP, e.g. 10.244.1.7</text></g><!--entity cmds--><g class="entity" data-qualified-name="docker.cmds" data-source-line="5" id="ent0003"><rect fill="#FFFFFF" height="57.8975" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="226.7007" x="56.5" y="118.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="163.3062" x="70.5" y="144.8921">docker run python-app   (x4)</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="198.7007" x="70.5" y="159.8408">docker run helper --link app1   (x4)</text></g><!--entity table--><g class="entity" data-qualified-name="docker.table" data-source-line="6" id="ent0004"><rect fill="#FEE2E2" height="68.2466" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="161.2622" x="89.5" y="213.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="91.73" x="103.5" y="239.8921">your own table</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="121.0376" x="103.5" y="252.9648">app1 &#8596; helper1 &#8596; vol1</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="133.2622" x="103.5" y="265.6138">app2 &#8596; helper2 &#8596; vol2 ...</text></g><!--entity cleanup--><g class="entity" data-qualified-name="docker.cleanup" data-source-line="7" id="ent0005"><rect fill="#FEE2E2" height="57.8975" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="189.8081" x="75" y="318.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="161.8081" x="89" y="344.8921">when app2 dies, you must</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="150.2871" x="89" y="359.8408">remove helper2 yourself</text></g><!--entity cap--><g class="entity" data-qualified-name="k8s.cap" data-source-line="21" id="ent0017"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="210.3159" x="758" y="245.5161">Same network namespace, same volumes,</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="288.041" x="758" y="258.165">scheduled to the same node, created and deleted together.</text></g><!--entity app--><g class="entity" data-qualified-name="k8s.pod.app" data-source-line="14" id="ent0010"><rect fill="#326CE5" height="55.5977" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="113.2363" x="342.5" y="119.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="85.2363" x="356.5" y="145.8921">app container</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="82.5322" x="356.5" y="158.9648">listens on :8080</text></g><!--entity helper--><g class="entity" data-qualified-name="k8s.pod.helper" data-source-line="15" id="ent0011"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="131.9414" x="562" y="119.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="101.1372" x="576" y="145.8921">helper container</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="103.9414" x="576" y="158.9648">calls localhost:8080</text></g><!--entity vol--><g class="entity" data-qualified-name="k8s.pod.vol" data-source-line="16" id="ent0012"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="113.2681" x="401.5" y="219.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="85.2681" x="415.5" y="245.8921">shared volume</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="63.5938" x="415.5" y="258.9648">both mount it</text></g><g class="link" data-entity-1="ent0010" data-entity-2="ent0011" data-link-type="dependency" id="lnk14"><polygon fill="#475569" points="455.6068,147.6982,464.6068,151.6982,460.6068,147.6982,464.6068,143.6982,455.6068,147.6982" style="stroke:#475569;stroke-width:1;"/><path d="M461.6068,147.6982 C493.7917,147.6982 528.2583,147.6982 561.8958,147.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="77.3906" x="470.25" y="136.9541">localhost:8080</text></g><g class="link" data-entity-1="ent0010" data-entity-2="ent0012" data-link-type="dependency" id="lnk15"><polygon fill="#475569" points="441.5701,219.4079,440.355,209.6343,438.9912,215.1243,433.5012,213.7606,441.5701,219.4079" style="stroke:#475569;stroke-width:1;"/><path d="M415.2782,175.7366 C423.4643,189.3338 430.2683,200.6355 438.4754,214.2676" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0011" data-entity-2="ent0012" data-link-type="dependency" id="lnk16"><polygon fill="#475569" points="487.9847,219.513,497.4636,216.8389,491.8308,216.3181,492.3517,210.6852,487.9847,219.513" style="stroke:#475569;stroke-width:1;"/><path d="M561.8498,174.0809 C548.3219,180.184 534.4305,187.1474 522,194.6982 C510.2537,201.8335 502.9323,207.0959 492.6,215.6791" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><?plantuml-src RPFDZjCm4CVlVOgX5q1gqW-jH5LLbK18276fn95oSEtPnAfZHxQpPK5xvGbu5-uy2a_2Z9DcanQfRLBFVtupuvbveQqqZKB8ytdxYSwPC5TQ55