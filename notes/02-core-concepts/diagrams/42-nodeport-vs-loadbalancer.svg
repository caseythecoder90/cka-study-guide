<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="361px" preserveAspectRatio="none" style="width:638px;height:361px;background:#FFFFFF;" version="1.1" viewBox="0 0 638 361" width="638px" zoomAndPan="magnify"><title>What users have to know: every node address, or one</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="461.127" x="80.9365" y="30.8838">What users have to know: every node address, or one</text></g><!--cluster np--><g class="cluster" data-qualified-name="np" data-source-line="4" id="ent0002"><rect fill="#FEF2F2" height="302" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="298" x="14" y="53.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="88.8354" x="118.5823" y="71.8921">NodePort only</text></g><!--cluster lb--><g class="cluster" data-qualified-name="lb" data-source-line="12" id="ent0008"><rect fill="#F0FDF4" height="296" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="312" x="320" y="59.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="260.8125" x="345.5938" y="77.8921">One LoadBalancer Service per application</text></g><!--entity v--><g class="entity" data-qualified-name="np.v" data-source-line="5" id="ent0003"><rect fill="#FEE2E2" height="68.2466" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="246.9688" x="56.5" y="86.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="136.4873" x="70.5" y="112.8921">voting-app, four URLs</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="218.9688" x="70.5" y="125.9648">192.168.56.70:30035 &#183; 192.168.56.71:30035</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="218.9688" x="70.5" y="138.6138">192.168.56.72:30035 &#183; 192.168.56.73:30035</text></g><!--entity r--><g class="entity" data-qualified-name="np.r" data-source-line="6" id="ent0004"><rect fill="#FEE2E2" height="68.2466" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="246.9688" x="50.5" y="190.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="132.8945" x="64.5" y="216.8921">result-app, four URLs</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="218.9688" x="64.5" y="229.9648">192.168.56.70:31061 &#183; 192.168.56.71:31061</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="218.9688" x="64.5" y="242.6138">192.168.56.72:31061 &#183; 192.168.56.73:31061</text></g><!--entity npl--><g class="entity" data-qualified-name="np.npl" data-source-line="7" id="ent0005"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="243.0098" x="46.5" y="319.0161">Unfriendly ports, and if a user's chosen node fails,</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="119.8237" x="46.5" y="331.665">their URL stops working.</text></g><!--entity lv--><g class="entity" data-qualified-name="lb.lv" data-source-line="13" id="ent0009"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="252.501" x="362.5" y="92.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="149.5254" x="376.5" y="118.8921">http://example-vote.com</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="224.501" x="376.5" y="131.9648">DNS &#8594; voting-app's load balancer address</text></g><!--entity lr--><g class="entity" data-qualified-name="lb.lr" data-source-line="14" id="ent0010"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="249.4609" x="357.5" y="196.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="158.1963" x="371.5" y="222.8921">http://example-result.com</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="221.4609" x="371.5" y="235.9648">DNS &#8594; result-app's load balancer address</text></g><!--entity lbl--><g class="entity" data-qualified-name="lb.lbl" data-source-line="15" id="ent0011"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="266.8628" x="342.5" y="319.0161">Each load balancer forwards to the Service's node port</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="209.7466" x="342.5" y="331.665">on healthy nodes. Users never see a node.</text></g><?plantuml-src bLDBZjD04Dtd54KsR18xdcW2H94N8n2RqO0OHIo0HSLTjblfT5dTROU0s7A0kGnxZi99QDkJZySPFf8NLbM_gbVrNZsHEb6b80Y2iFqSixAXa9WPtDWmMUFOvRIXe2WtQk2aKmJlStHGMZ8MSgm87CDQytOEL97PWMPV48KmPEq8s01h6WmC9Gvrvk736__WBHld4setXCKYCrmMLoZY6D22Bk3h0E04KB6JEXjZKOmWvTB0yjsr_QWNLdwXUHJ5qOkB89ez3ovdmRF9V3gPJ2_Xvmyu3KTjU17McFWHxCLvxBI3hGclzbohBb4_SgdSFnED9hFe3D4w_5UYvx3J3hP3r7YY2bUaO7YekDIfaQI5sa7XvV1YeHOWKy16tQSMafmjwLRH5AMoepulRm_P30hMSM5XosRjrGeEB1f9bUzVmVX3BeKW_KdmLe_ZXfNfHUlNtpgEUQC9hXd