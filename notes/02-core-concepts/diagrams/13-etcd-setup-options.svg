<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="462px" preserveAspectRatio="none" style="width:719px;height:462px;background:#FFFFFF;" version="1.1" viewBox="0 0 719 462" width="719px" zoomAndPan="magnify"><title>Two ways etcd ends up on a control plane node</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="409.0518" x="151.4106" y="30.8838">Two ways etcd ends up on a control plane node</text></g><!--cluster scratch--><g class="cluster" data-qualified-name="scratch" data-source-line="4" id="ent0002"><rect fill="#F8FAFC" height="373" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="264" x="27.4365" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="174.0972" x="72.3879" y="71.8921">From scratch (the hard way)</text></g><!--cluster kubeadm--><g class="cluster" data-qualified-name="kubeadm" data-source-line="14" id="ent0010"><rect fill="#F0FDF4" height="373" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="408" x="299.4365" y="53.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="57.0718" x="474.9006" y="71.8921">kubeadm</text></g><!--entity s1--><g class="entity" data-qualified-name="scratch.s1" data-source-line="5" id="ent0003"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="212.9009" x="69.9365" y="86.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="184.9009" x="83.9365" y="112.8921">You download the etcd binary</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="93.5215" x="83.9365" y="125.9648">/usr/local/bin/etcd</text></g><!--entity s2--><g class="entity" data-qualified-name="scratch.s2" data-source-line="6" id="ent0004"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="226.7144" x="53.9365" y="178.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="153.1436" x="67.9365" y="204.8921">You write a systemd unit</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="198.7144" x="67.9365" y="217.9648">etcd.service &#8212; every flag in ExecStart</text></g><!--entity s3--><g class="entity" data-qualified-name="scratch.s3" data-source-line="7" id="ent0005"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="205.728" x="62.4365" y="270.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="177.728" x="76.4365" y="296.8921">You generate the certificates</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="99.6445" x="76.4365" y="309.9648">e.g. /etc/etcd/*.pem</text></g><!--entity s4--><g class="entity" data-qualified-name="scratch.s4" data-source-line="8" id="ent0006"><rect fill="#326CE5" height="55.5977" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="238.2729" x="45.4365" y="362.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="171.9517" x="59.4365" y="388.8921">etcd runs as a host process</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="210.2729" x="59.4365" y="401.9648">systemctl status etcd &#183; journalctl -u etcd</text></g><!--entity k1--><g class="entity" data-qualified-name="kubeadm.k1" data-source-line="15" id="ent0011"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="356.8936" x="341.9365" y="86.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="255.0107" x="355.9365" y="112.8921">kubeadm init writes a static Pod manifest</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="328.8936" x="355.9365" y="125.9648">/etc/kubernetes/manifests/etcd.yaml &#8212; every flag in command:</text></g><!--entity k2--><g class="entity" data-qualified-name="kubeadm.k2" data-source-line="16" id="ent0012"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="245.4771" x="393.9365" y="178.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="217.4771" x="407.9365" y="204.8921">kubeadm generates the certificates</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="128.3799" x="407.9365" y="217.9648">/etc/kubernetes/pki/etcd/</text></g><!--entity k3--><g class="entity" data-qualified-name="kubeadm.k3" data-source-line="17" id="ent0013"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="329.9683" x="345.4365" y="270.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="158.9199" x="359.4365" y="296.8921">the kubelet starts the Pod</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="301.9683" x="359.4365" y="309.9648">image registry.k8s.io/etcd &#183; data in /var/lib/etcd (hostPath)</text></g><!--entity k4--><g class="entity" data-qualified-name="kubeadm.k4" data-source-line="18" id="ent0014"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="384.3936" x="315.4365" y="362.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="223.9453" x="329.4365" y="388.8921">etcd runs as Pod etcd-&lt;node-name&gt;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="356.3936" x="329.4365" y="401.9648">namespace kube-system &#183; kubectl -n kube-system logs etcd-&lt;node&gt;</text></g><g class="caption" data-source-line="26"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="701.873" x="5" y="446.8301">Same etcd, same flags. What changes is where the flags live and how you restart it: systemd unit vs manifest file.</text></g><?plantuml-src VLJ1RjGm4BtlLmmzjOWasfO3ggBSW6kb8Y447ARsR6BYs977sIKW93w2V-7Ef_0bs4vtIPggKWwnP_pcpRndFrD6w44Iv7anVTvQpOLKM3lik10jPhwXZl9-wFJ6Awy9tXqi771a82yaa94CGm_M08AmnZkheTTe28oLjDau4XvD7GwUlN6s0nOElMZWF013Wqv6i8ipAClQsQ6lAa0-9NtV0Cm0FjW1f3qORL52F9yet2c3RlnaIbRVw7gxhOg1NQ6jG5s4M16JoY86gxC4lbsZ7fpo53hWaJrr4WQZ_0mnGkHCRgy4mT-Vlu3sv4ROQQn16NZzbSIjH-SNPIxNPMeo53gZH5wGysgdH5Zpl5PUvn199-B5yxodRe5xjSHDCt23uHX4Q2nxw9qLn7FKgJ7XDR17Fzohz-StVB63CwXZ91jWCQkoH278-7jDNeQwl8NiOwEa9FCvAf5LKvzykTwFFFbglVzoysDXYtQu8vJToG9lhPLJoVl8GniSjrKGQL8kDXxxKW9kh8GEZTeHpnLC0uq7dQ6GNnnJE4qv7x7JZmWhR1SIvVLy_ktsSJP7RVafSH_Iw5iroRoeyC0v4I-UqUHZbyvF9KAdCsJLOKtXLAtOkp5lNt6kR75KMQB7s52nnt0rrDqKE8zckK7VN2pAFsMmEDwuaPNnUcS6EwfcBEAQUnGJuMnoNIGGbybZPX7HjkOPNZNpNltV1j5vxTfvQKxjsdcfWNRjl3Ovx_YsdA9ErOsFuKd8pKPWxrLuq4fLtOP-4hyNmF4t6eDpUD-W1z