<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="150px" preserveAspectRatio="none" style="width:1303px;height:150px;background:#FFFFFF;" version="1.1" viewBox="0 0 1303 150" width="1303px" zoomAndPan="magnify"><title>etcd releases: the v3 API arrived in 2016, and it is the only one Kubernetes uses today</title><defs/><g><g class="title" data-source-line="3"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="735.2666" x="280.8667" y="30.8838">etcd releases: the v3 API arrived in 2016, and it is the only one Kubernetes uses today</text></g><!--entity a--><g class="entity" data-qualified-name="a" data-source-line="5" id="ent0002"><rect fill="#F1F5F9" height="70.5464" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="119.7114" x="6" y="67.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="55.6626" x="20" y="93.8921">Aug 2013</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="24.5718" x="20" y="108.8408">v0.1</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="91.7114" x="20" y="121.9136">created at CoreOS</text></g><!--entity b--><g class="entity" data-qualified-name="b" data-source-line="6" id="ent0003"><rect fill="#F1F5F9" height="70.5464" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="128.8584" x="162" y="67.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="53.4917" x="176" y="93.8921">Jan 2015</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="24.5718" x="176" y="108.8408">v2.0</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="100.8584" x="176" y="121.9136">v2 API: set &#183; get &#183; rm</text></g><!--entity c--><g class="entity" data-qualified-name="c" data-source-line="7" id="ent0004"><rect fill="#326CE5" height="83.1953" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="166.7246" x="327" y="61.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="55.6436" x="341" y="87.8921">Jun 2016</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="25.3018" x="341" y="102.8408">v3.0</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="138.7246" x="341" y="115.9136">v3 API: put &#183; get &#183; del &#183; txn,</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="119.8022" x="341" y="128.5625">gRPC, MVCC revisions</text></g><!--entity d--><g class="entity" data-qualified-name="d" data-source-line="8" id="ent0005"><rect fill="#EFF6FF" height="70.5464" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="165.543" x="530" y="67.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="69.3926" x="544" y="93.8921">2017 - 2019</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="135.8652" x="544" y="108.8408">v3.1 &#183; v3.2 &#183; v3.3 &#183; v3.4</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="137.543" x="544" y="121.9136">v3.4: etcdctl defaults to v3</text></g><!--entity e--><g class="entity" data-qualified-name="e" data-source-line="9" id="ent0006"><rect fill="#FFFFFF" height="70.5464" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="94.4536" x="732" y="67.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="55.6499" x="746" y="93.8921">Dec 2018</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="66.4536" x="746" y="108.8408">joins CNCF</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="50.1499" x="746" y="121.9136">incubating</text></g><!--entity f--><g class="entity" data-qualified-name="f" data-source-line="10" id="ent0007"><rect fill="#DCFCE7" height="57.8975" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="130.5591" x="862" y="74.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="57.0908" x="876" y="100.3921">Nov 2020</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="102.5591" x="876" y="115.3408">CNCF graduated</text></g><!--entity g--><g class="entity" data-qualified-name="g" data-source-line="11" id="ent0008"><rect fill="#EFF6FF" height="57.8975" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="83.6436" x="1029" y="74.1982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="55.6436" x="1043" y="100.3921">Jun 2021</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="25.3018" x="1043" y="115.3408">v3.5</text></g><!--entity h--><g class="entity" data-qualified-name="h" data-source-line="12" id="ent0009"><rect fill="#DCFCE7" height="83.1953" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="148.688" x="1149" y="61.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="120.688" x="1163" y="87.8921">May 2025 &#183; Jul 2026</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="62.1563" x="1163" y="102.8408">v3.6 &#183; v3.7</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="117.3745" x="1163" y="115.9136">v3.6: snapshot restore</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="87.4038" x="1163" y="128.5625">moves to etcdutl</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" id="lnk10"><polygon fill="#475569" points="161.9132,103.1982,152.9132,99.1982,156.9132,103.1982,152.9132,107.1982,161.9132,103.1982" style="stroke:#475569;stroke-width:1;"/><path d="M126.0195,103.1982 C137.7256,103.1982 144.0627,103.1982 155.9132,103.1982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" id="lnk11"><polygon fill="#475569" points="326.6881,103.1982,317.6881,99.1982,321.6881,103.1982,317.6881,107.1982,326.6881,103.1982" style="stroke:#475569;stroke-width:1;"/><path d="M291.1548,103.1982 C302.6355,103.1982 308.7565,103.1982 320.6881,103.1982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" id="lnk12"><polygon fill="#475569" points="529.8049,103.1982,520.8049,99.1982,524.8049,103.1982,520.8049,107.1982,529.8049,103.1982" style="stroke:#475569;stroke-width:1;"/><path d="M494.2086,103.1982 C505.9665,103.1982 512.0568,103.1982 523.8049,103.1982" fi