<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="755px" preserveAspectRatio="none" style="width:964px;height:755px;background:#FFFFFF;" version="1.1" viewBox="0 0 964 755" width="964px" zoomAndPan="magnify"><title>A ReplicaSet manifest wraps a Pod manifest; labels appear in three places</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="636.2227" x="160.0278" y="30.8838">A ReplicaSet manifest wraps a Pod manifest; labels appear in three places</text></g><!--cluster rs--><g class="cluster" data-qualified-name="rs" data-source-line="4" id="ent0002"><rect fill="#F8FAFC" height="666" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="361" x="309.1392" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="66.4727" x="456.4028" y="71.8921">ReplicaSet</text></g><!--cluster template--><g class="cluster" data-qualified-name="rs.template" data-source-line="9" id="ent0007"><rect fill="#F0FDF4" height="214" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="345" x="317.1392" y="497.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="321.0898" x="329.0942" y="515.8921">spec.template  =  a Pod without apiVersion and kind</text></g><!--entity head--><g class="entity" data-qualified-name="rs.head" data-source-line="5" id="ent0003"><rect fill="#FFFFFF" height="42.9487" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="247.6733" x="365.1392" y="86.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="219.6733" x="379.1392" y="112.8921">apiVersion: apps/v1 &#183; kind: ReplicaSet</text></g><!--entity rslabels--><g class="entity" data-qualified-name="rs.rslabels" data-source-line="6" id="ent0004"><rect fill="#F1F5F9" height="68.2466" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="281.7681" x="348.1392" y="166.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="91.7808" x="362.1392" y="192.8921">metadata.labels</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="70.9307" x="362.1392" y="205.9648">type: front-end</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="253.7681" x="362.1392" y="218.6138">labels on the ReplicaSet itself; not used to find Pods</text></g><!--entity replicas--><g class="entity" data-qualified-name="rs.replicas" data-source-line="7" id="ent0005"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="197.2915" x="390.6392" y="271.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="97.5571" x="404.6392" y="297.8921">spec.replicas: 3</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="169.2915" x="404.6392" y="310.9648">how many Pods to keep running</text></g><!--entity selector--><g class="entity" data-qualified-name="rs.selector" data-source-line="8" id="ent0006"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="263.9253" x="357.1392" y="364.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="166.188" x="371.1392" y="390.8921">spec.selector.matchLabels</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="77.6016" x="371.1392" y="403.9648">type: front-end</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="235.9253" x="371.1392" y="416.6138">which Pods this ReplicaSet counts and owns</text></g><!--entity podlabels--><g class="entity" data-qualified-name="rs.template.podlabels" data-source-line="10" id="ent0008"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="186.3721" x="396.1392" y="530.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="154.6162" x="410.1392" y="556.8921">template.metadata.labels</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="77.6016" x="410.1392" y="569.9648">type: front-end</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="158.3721" x="410.1392" y="582.6138">labels every new Pod receives</text></g><!--entity containers--><g class="entity" data-qualified-name="rs.template.containers" data-source-line="11" id="ent0009"><rect fill="#FFFFFF" height="68.2466" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="172.5234" x="402.6392" y="635.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="144.5234" x="416.6392" y="661.8921">template.spec.containers</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="115.5591" x="416.6392" y="674.9648">- name: nginx-container</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="62.3691" x="425.8076" y="687.6138">image: nginx</text></g><g class="link" data-entity-1="ent0006" data-entity-2="ent0008" data-link-type="dependency" id="lnk14"><polygon fill="#475569" points="489.1392,530.5598,493.1392,521.5598,489.1392,525.5598,485.1392,521.5598,489.1392,530.5598" style="stroke:#475569;stroke-width:1;"/><path d="M489.1392,432.8861 C489.1392,461.3394 489.1392,496.1208 489.1392,524.5598" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="122.0449" x="495.1392" y="467.9541">must match, or the API</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="116.7246" x="497.7993" y="481.7529">rejects the ReplicaSet</text></g><g class="caption" data-source-line="20"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="946.2783" x="5" y="739.8301">The match that matters is selector to template labels. Pods get generated names such as myapp-replicaset-9ddl9, so a name in the template is not used.</text></g><?plantuml-src fLHDZzCm4BtdLmnxtgIgE6ssHDeJGkAm0iI5vM3iQMAQs9OzQIbeVnTtVXdZV8UM0q9gfSWpVlFUp1k_q4RMhKB8iat_8slhi55Qb5uqOICF8gKA6ynSszG9QQeH7k0TkbfByHu96c7q7WF1oGiNGC2ZLTFXFTJY2zPyx1mA3ze0LHuHN2qaXYJnA4cOaa5lPimRsErARrjN5202-00_4e15gd3w8_gWhSaZSjWSj_3h9noqKJciSRYGDZrEXKAjSHeaeGI9h6VvP7P1VyTykotex327lRU6KZHgjuc1Of4mwB9H42xxeIbWlRy7OmdQW0h8mfw9nRw40ISIQrf2DGhiqTRaWaEP-HuuvF1oKRoofzZYSuSP2nmG7VZM66tAgKP47gvVGMQMV69zrWYIrTj_Ri2fqh8Q25GwB5iWRMk8PywYxSaiHGifqL2lUYHmXHjXmtCZ17W5WwDEcYhR4ioZx_3Zo2UxlBPswEW448spmXyZsV_F7e_eps3mr17a6gYFk5HRJdoSLTE8hzFfT4ikoNPbVOjgAHZHC25JQlCjdL8kQJ6oRaGvfYw8B9PWBj5HcOX1-gdIIg7vh7XcQR5EVEP_N9-BhALrmr-GLYRiFozo5cOOFo4TOZF779esn2U77NiBd19tx-7npPFn-9KlXJ-MCNbE4YaSHRViTF61WzrTJXCT3B4yqBCNuovDtkcBPht7I_PrYTmEZgXk8dohPIWMqvpv4Kf7RKZfdLBrtIq4o-QDgVsxXpCqbnpVXsotqSLl?></g></svg>