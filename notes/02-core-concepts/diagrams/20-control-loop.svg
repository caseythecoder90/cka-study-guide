<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="245px" preserveAspectRatio="none" style="width:921px;height:245px;background:#FFFFFF;" version="1.1" viewBox="0 0 921 245" width="921px" zoomAndPan="magnify"><title>A controller is a loop: watch, compare, act &#8212; forever</title><defs/><g><g class="title" data-source-line="3"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="451.1162" x="231.4419" y="30.8838">A controller is a loop: watch, compare, act &#8212; forever</text></g><!--cluster loop--><g class="cluster" data-qualified-name="loop" data-source-line="8" id="ent0004"><rect fill="#F0FDF4" height="109" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="464" x="145" y="61.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="93.1582" x="330.4209" y="79.8921">Controller loop</text></g><!--entity desired--><g class="entity" data-qualified-name="desired" data-source-line="5" id="ent0002"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="109.6499" x="6" y="94.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="81.6499" x="20" y="120.8921">Desired state</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="78.853" x="20" y="133.9648">spec in the API</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="76.4253" x="20" y="146.6138">e.g. replicas: 3</text></g><!--entity actual--><g class="entity" data-qualified-name="actual" data-source-line="6" id="ent0003"><rect fill="#FFFFFF" height="68.2466" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="123.4014" x="792" y="133.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="67.9263" x="806" y="159.8921">Actual state</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="77.6445" x="806" y="172.9648">what exists now</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="95.4014" x="806" y="185.6138">e.g. 2 Pods running</text></g><!--entity watch--><g class="entity" data-qualified-name="loop.watch" data-source-line="9" id="ent0005"><rect fill="#EFF6FF" height="68.2466" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="109.9092" x="153" y="94.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="49.8418" x="167" y="120.8921">1 Watch</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="81.9092" x="167" y="133.9648">events from the</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="78.2622" x="167" y="146.6138">kube-apiserver</text></g><!--entity diff--><g class="entity" data-qualified-name="loop.diff" data-source-line="10" id="ent0006"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="117.2676" x="300" y="100.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="67.1899" x="314" y="126.8921">2 Compare</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="89.2676" x="314" y="139.9648">desired vs actual</text></g><!--entity act--><g class="entity" data-qualified-name="loop.act" data-source-line="11" id="ent0007"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="146.5991" x="454" y="94.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="31.7891" x="468" y="120.8921">3 Act</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="118.5991" x="468" y="133.9648">create / delete / update</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="82.4893" x="468" y="146.6138">through the API</text></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" data-link-type="dependency" id="lnk8"><polygon fill="#475569" points="299.7539,128.6982,290.7539,124.6982,294.7539,128.6982,290.7539,132.6982,299.7539,128.6982" style="stroke:#475569;stroke-width:1;"/><path d="M263.032,128.6982 C274.9738,128.6982 281.6709,128.6982 293.7539,128.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0006" data-entity-2="ent0007" data-link-type="dependency" id="lnk9"><polygon fill="#475569" points="453.9506,128.6982,444.9506,124.6982,448.9506,128.6982,444.9506,132.6982,453.9506,128.6982" style="stroke:#475569;stroke-width:1;"/><path d="M417.4398,128.6982 C429.2156,128.6982 435.742,128.6982 447.9506,128.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" data-link-type="dependency" id="lnk10"><polygon fill="#475569" points="152.7721,128.6982,143.7721,124.6982,147.7721,128.6982,143.7721,132.6982,152.7721,128.6982" style="stroke:#475569;stroke-width:1;"/><path d="M116.4052,128.6982 C128.2985,128.6982 134.8858,128.6982 146.7721,128.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="dependency" id="lnk11"><polygon fill="#475569" points="263.3652,154.3619,270.319,161.3364,268.0292,156.1637,273.202,153.874,263.3652,154.3619" style="stroke:#475569;stroke-width:1;"/><path d="M791.9368,175.5877 C689.322,187.1639 475.3349,203.5389 300,165.6982 C287.8303,163.0718 280.7985,161.0968 268.962,156.5241" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0007" data-entity-2="ent0003" data-link-type="dependency" id="lnk12"><polygon fill="#475569" points="791.9797,160.4134,783.5222,155.3665,787.0155,159.8159,782.5661,163.3092,791.9797,160.4134" style="stroke:#475569;stroke-width:1;"/><path d="M601.2119,137.4506 C658.6768,144.3677 731.9827,153.1915 786.0227,159.6963" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="143.4258" x="625" y="132.9541">1 Pod created &#8594; 3 running</text></g><g class="caption" data-source-line="20"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="652.9072" x="130.5464" y="213.8301">In the harbor: the office watches its records, notices a container fell overboard, and orders a replacement.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="555.4541" x="179.2729" y="229.9287">The loop never finishes; it keeps the two states equal, which is what "self-healing" means.</text></g><?plantuml-src TLF1Yjim4BtxArvpJcookQN64BPGzhQ7GY-zADBO5f4bLPAJqbBegHzG-eNx9HtPcwtJfM2mhT6yz-RDp1jjfHaLeIoh-KdEcLWfBReWXbZ9azYadWOg_JYOmb2Ra1o2xle4fGF9f9qjaaw6S81qDWLd30Ne207ZdD_Z8fBirnmSl0YqXf09Jpz-etM1pXIA8iC8sp74wXr5HbM8IIJwPEkelz9-kssY9mbjmM9mU7oegnne5XUex4e4yaPB4VVOFTzOeQw5b6HJqq14g1b_INcGQHJc5UEb5mdqHSSKOTtbFuntU7Gg8epMQjijIB