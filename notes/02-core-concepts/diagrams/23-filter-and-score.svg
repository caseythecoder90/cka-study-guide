<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="523px" preserveAspectRatio="none" style="width:793px;height:523px;background:#FFFFFF;" version="1.1" viewBox="0 0 793 523" width="793px" zoomAndPan="magnify"><title>Placing a Pod that requests 10 CPU on four nodes</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="429.0732" x="178.1704" y="30.8838">Placing a Pod that requests 10 CPU on four nodes</text></g><!--cluster filter--><g class="cluster" data-qualified-name="filter" data-source-line="6" id="ent0003"><rect fill="#F8FAFC" height="97" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="452" x="271.207" y="131.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="223.9199" x="385.2471" y="149.8921">1  Filter &#8212; can the node run it at all?</text></g><!--cluster score--><g class="cluster" data-qualified-name="score" data-source-line="16" id="ent0011"><rect fill="#F8FAFC" height="109" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="358" x="271.207" y="285.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="260.7808" x="319.8167" y="303.8921">2  Score &#8212; which remaining node is best?</text></g><!--entity pod--><g class="entity" data-qualified-name="pod" data-source-line="4" id="ent0002"><rect fill="#326CE5" height="42.9487" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="174.6436" x="199.707" y="61.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="146.6436" x="213.707" y="87.8921">Pod  &#183;  requests cpu: 10</text></g><!--entity bind--><g class="entity" data-qualified-name="bind" data-source-line="22" id="ent0015"><rect fill="#326CE5" height="55.5977" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="436.3374" x="69.207" y="423.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="116.2954" x="83.207" y="449.8921">3  Bind  &#8594;  node04</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="408.3374" x="83.207" y="462.9648">scheduler writes spec.nodeName; the kubelet on node04 starts the containers</text></g><!--entity n1--><g class="entity" data-qualified-name="filter.n1" data-source-line="7" id="ent0004"><rect fill="#FEE2E2" height="55.5977" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="83.6338" x="313.207" y="164.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="45.5127" x="327.207" y="190.8921">node01</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="55.6338" x="327.207" y="203.9648">4 CPU free</text></g><!--entity n2--><g class="entity" data-qualified-name="filter.n2" data-source-line="8" id="ent0005"><rect fill="#FEE2E2" height="55.5977" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="83.6338" x="415.207" y="164.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="45.5127" x="429.207" y="190.8921">node02</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="55.6338" x="429.207" y="203.9648">4 CPU free</text></g><!--entity n3--><g class="entity" data-qualified-name="filter.n3" data-source-line="9" id="ent0006"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="89.7515" x="517.207" y="164.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="45.5127" x="531.207" y="190.8921">node03</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="61.7515" x="531.207" y="203.9648">12 CPU free</text></g><!--entity n4--><g class="entity" data-qualified-name="filter.n4" data-source-line="10" id="ent0007"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="89.7515" x="625.207" y="164.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="45.5127" x="639.207" y="190.8921">node04</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="61.7515" x="639.207" y="203.9648">16 CPU free</text></g><!--entity s3--><g class="entity" data-qualified-name="score.s3" data-source-line="17" id="ent0012"><rect fill="#FFFFFF" height="68.2466" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="141.1099" x="313.707" y="318.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="43.3799" x="327.707" y="344.8921">node03</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="113.1099" x="327.707" y="357.9648">2 CPU left after placing</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="56.2407" x="327.707" y="370.6138">lower score</text></g><!--entity s4--><g class="entity" data-qualified-name="score.s4" data-source-line="18" id="ent0013"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="148.4146" x="473.207" y="318.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="45.5127" x="487.207" y="344.8921">node04</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="120.4146" x="487.207" y="357.9648">6 CPU left after placing</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="66.0215" x="487.207" y="370.6138">higher score</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" id="lnk16"><polygon fill="#475569" points="287.207,131.4795,291.207,122.4795,287.207,126.4795,283.207,122.4795,287.207,131.4795" style="stroke:#475569;stroke-width:1;"/><path d="M287.207,104.9253 C287.207,110.569 287.207,117.0056 287.207,123.7645 C287.207,125.4543 287.207,127.1641 287.207,128.8868 C287.207,129.7481 287.207,124.6127 287.207,125.4795" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0011" data-link-type="dependency" id="lnk17"><polygon fill="#475569" points="287.207,285.5725,291.207,276.5725,287.207,280.5725,283.207,276.5725,287.207,285.5725" style="stroke:#475569;stroke-width:1;"/><path d="M287.207,229.2221 C287.207,229.3991 287.207,229.5766 287.207,229.7545 C287.207,231.1776 287.207,232.6275 287.207,234.1011 C287.207,245.8901 287.207,259.1994 287.207,272.5156 C287.207,275.8447 287.207,279.1742 287.207,282.4804 C287.207,283.307 287.207,284.1321 287.207,284.9554 C287.207,285.1612 287.207,279.3669 287.207,279.5725" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="146.1211" x="293.207" y="255.9541">node01, node02 filtered out</tex