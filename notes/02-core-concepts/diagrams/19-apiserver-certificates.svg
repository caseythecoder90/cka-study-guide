<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="535px" preserveAspectRatio="none" style="width:1107px;height:535px;background:#FFFFFF;" version="1.1" viewBox="0 0 1107 535" width="1107px" zoomAndPan="magnify"><title>The kube-apiserver is a TLS server AND a client: one certificate pair per connection (kubeadm paths)</title><defs/><g><g class="title" data-source-line="3"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="863.2529" x="118.3735" y="30.8838">The kube-apiserver is a TLS server AND a client: one certificate pair per connection (kubeadm paths)</text></g><!--cluster srv--><g class="cluster" data-qualified-name="srv" data-source-line="9" id="ent0004"><rect fill="#F0FDF4" height="213" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="630.5" x="451" y="53.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="119.2407" x="706.6296" y="71.8921">As a server  (:6443)</text></g><!--cluster cli--><g class="cluster" data-qualified-name="cli" data-source-line="15" id="ent0008"><rect fill="#F8FAFC" height="225" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="690" x="411" y="274.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="65.0254" x="723.4873" y="292.8921">As a client</text></g><!--entity clients--><g class="entity" data-qualified-name="clients" data-source-line="5" id="ent0002"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="220.5967" x="6" y="335.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="39.7363" x="20" y="361.8921">Clients</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="192.5967" x="20" y="374.9648">kubectl, scheduler, controllers, kubelets</text></g><!--entity api--><g class="entity" data-qualified-name="api" data-source-line="7" id="ent0003"><rect fill="#326CE5" height="42.9487" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="120.4917" x="263" y="342.1982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="92.4917" x="277" y="368.3921">kube-apiserver</text></g><!--entity tls--><g class="entity" data-qualified-name="srv.tls" data-source-line="10" id="ent0005"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="256.0513" x="459" y="160.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="205.8735" x="473" y="186.8921">--tls-cert-file / --tls-private-key-file</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="228.0513" x="473" y="199.9648">pki/apiserver.crt / .key &#8212; what clients verify</text></g><!--entity cca--><g class="entity" data-qualified-name="srv.cca" data-source-line="11" id="ent0006"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="224.8721" x="474.5" y="86.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="84.5127" x="488.5" y="112.8921">--client-ca-file</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="196.8721" x="488.5" y="125.9648">pki/ca.crt &#8212; verifies client certificates</text></g><!--entity sa--><g class="entity" data-qualified-name="srv.sa" data-source-line="12" id="ent0007"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="262.749" x="810.5" y="160.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="156.7808" x="824.5" y="186.8921">--service-account-key-file</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="234.749" x="824.5" y="199.9648">pki/sa.pub &#8212; verifies ServiceAccount tokens</text></g><!--entity toetcd--><g class="entity" data-qualified-name="cli.toetcd" data-source-line="16" id="ent0009"><rect fill="#EFF6FF" height="68.2466" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="271.9229" x="451" y="381.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="43.3418" x="465" y="407.8921">&#8594; etcd</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="138.7676" x="465" y="420.9648">--etcd-cafile pki/etcd/ca.crt</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="243.9229" x="465" y="433.6138">--etcd-certfile/keyfile pki/apiserver-etcd-client.*</text></g><!--entity tokubelet--><g class="entity" data-qualified-name="cli.tokubelet" data-source-line="17" id="ent0010"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="336.1074" x="419" y="307.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="232.5972" x="433" y="333.8921">&#8594; kubelets  (logs, exec, port-forward)</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="308.1074" x="433" y="346.9648">--kubelet-client-certificate/key pki/apiserver-kubelet-client.*</text></g><!--entity toagg--><g class="entity" data-qualified-name="cli.toagg" data-source-line="18" id="ent0011"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="302.436" x="791" y="387.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="250.7007" x="805" y="413.8921">&#8594; aggregated APIs  (e.g. metrics-server)</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="274.436" x="805" y="426.9648">--proxy-client-cert-file/key-file pki/front-proxy-client.*</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" id="lnk12"><polygon fill="#475569" points="262.7681,363.6982,253.7681,359.6982,257.7681,363.6982,253.7681,367.6982,262.7681,363.6982" style="stroke:#475569;stroke-width:1;"/><path d="M227.2331,363.6982 C239.456,363.6982 245.5356,363.6982 256.7681,363.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" id="lnk13"><polygon fill="#475569" points="450.8128,255.6714,441.0848,254.1331,445.9827,256.9635,443.1523,261.8614,450.8128,255.6714" style="stroke:#475569;stroke-width:1;"/><path d="M337.7088,341.9477 C352.7997,320.0283 379.1892,287.1586 411,270.6982 C418.3538,266.8931 426.103,263.6236 434.0824,260.8191 C438.0721,259.4169 442.1194,258.1309 446.2036,256.9524 C447.2247,256.6577 448.248,256.3698 449.2734,256.0885 C449.786,255.9478 444.503,257.3594 445.0166,257.2219" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0008" data-link-type="dependency" id="lnk14"><polygon fill="#475569" points="410.6203,458.5023,404.471,450.809,406