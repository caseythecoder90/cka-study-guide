<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="235px" preserveAspectRatio="none" style="width:979px;height:235px;background:#FFFFFF;" version="1.1" viewBox="0 0 979 235" width="979px" zoomAndPan="magnify"><title>etcd is a server; etcdctl and the kube-apiserver are both just clients</title><defs/><g><g class="title" data-source-line="3"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="577.2041" x="197.8979" y="30.8838">etcd is a server; etcdctl and the kube-apiserver are both just clients</text></g><!--cluster srv--><g class="cluster" data-qualified-name="srv" data-source-line="8" id="ent0004"><rect fill="#F8FAFC" height="119" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="618" x="184" y="77.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="69.3799" x="458.3101" y="95.3921">etcd server</text></g><!--entity cli--><g class="entity" data-qualified-name="cli" data-source-line="5" id="ent0002"><rect fill="#EFF6FF" height="80.8955" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="109.9307" x="26" y="61.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="41.9009" x="40" y="87.8921">etcdctl</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="81.9307" x="40" y="100.9648">put key1 value1</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="44.0269" x="40" y="113.6138">get key1</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="58.7007" x="40" y="126.2627">watch key1</text></g><!--entity api--><g class="entity" data-qualified-name="api" data-source-line="6" id="ent0003"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="149.6499" x="6" y="161.1982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="92.4917" x="20" y="187.3921">kube-apiserver</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="99.6284" x="20" y="200.4648">the only etcd client</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="121.6499" x="20" y="213.1138">in a Kubernetes cluster</text></g><!--entity members--><g class="entity" data-qualified-name="members" data-source-line="16" id="ent0010"><rect fill="#FFFFFF" height="42.9487" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="143.6035" x="830" y="127.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="115.6035" x="844" y="153.8921">other etcd members</text></g><!--entity client--><g class="entity" data-qualified-name="srv.client" data-source-line="9" id="ent0005"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="217.4707" x="192" y="121.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="147.3672" x="206" y="147.3921">:2379  client API (gRPC)</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="189.4707" x="206" y="160.4648">get &#183; put &#183; delete &#183; txn &#183; watch &#183; lease</text></g><!--entity store--><g class="entity" data-qualified-name="srv.store" data-source-line="10" id="ent0006"><path d="M445,120.6982 C445,110.6982 514.3303,110.6982 514.3303,110.6982 C514.3303,110.6982 583.6606,110.6982 583.6606,120.6982 L583.6606,177.9448 C583.6606,187.9448 514.3303,187.9448 514.3303,187.9448 C514.3303,187.9448 445,187.9448 445,177.9448 L445,120.6982" fill="#F1F5F9" style="stroke:#64748B;stroke-width:1.5;"/><path d="M445,120.6982 C445,130.6982 514.3303,130.6982 514.3303,130.6982 C514.3303,130.6982 583.6606,130.6982 583.6606,120.6982" fill="none" style="stroke:#64748B;stroke-width:1.5;"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="88.1499" x="459" y="150.8921">key-value store</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="110.6606" x="459" y="163.9648">every write bumps one</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="99.6445" x="459" y="176.6138">cluster-wide revision</text></g><!--entity peer--><g class="entity" data-qualified-name="srv.peer" data-source-line="11" id="ent0007"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="174.0991" x="620" y="121.1982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="107.6626" x="634" y="147.3921">:2380  peer traffic</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="146.0991" x="634" y="160.4648">Raft between etcd members</text></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" data-link-type="dependency" id="lnk8"><polygon fill="#475569" points="444.915,149.1982,435.915,145.1982,439.915,149.1982,435.915,153.1982,444.915,149.1982" style="stroke:#475569;stroke-width:1;"/><path d="M409.0527,149.1982 C421.2496,149.1982 427.4191,1