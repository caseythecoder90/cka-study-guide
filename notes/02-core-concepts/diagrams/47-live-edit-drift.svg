<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="209px" preserveAspectRatio="none" style="width:877px;height:209px;background:#FFFFFF;" version="1.1" viewBox="0 0 877 209" width="877px" zoomAndPan="magnify"><title>kubectl edit changes the live object, not your file</title><defs/><g><g class="title" data-source-line="3"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="416.083" x="227.4585" y="30.8838">kubectl edit changes the live object, not your file</text></g><!--entity file--><g class="entity" data-qualified-name="file" data-source-line="5" id="ent0002"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="145.0571" x="6" y="119.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="117.0571" x="20" y="145.8921">Local file nginx.yaml</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="62.3691" x="20" y="158.9648">image: nginx</text></g><!--entity live--><g class="entity" data-qualified-name="live" data-source-line="6" id="ent0003"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="180.4263" x="300.5" y="61.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="152.4263" x="314.5" y="87.8921">Live object in the cluster</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="92.9146" x="314.5" y="100.9648">image: nginx:1.18</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="88.0215" x="314.5" y="113.6138">after kubectl edit</text></g><!--entity lost--><g class="entity" data-qualified-name="lost" data-source-line="7" id="ent0004"><rect fill="#FEE2E2" height="55.5977" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="254.7783" x="617" y="67.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="206.5972" x="631" y="93.8921">Later: kubectl apply -f nginx.yaml</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="226.7783" x="631" y="106.9648">the file sets image, so it goes back to nginx</text></g><!--entity better--><g class="entity" data-qualified-name="better" data-source-line="8" id="ent0005"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="249.2568" x="266" y="147.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="186.3545" x="280" y="173.8921">Better: edit the file, then apply</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="221.2568" x="280" y="186.9648">the file stays the record of what is running</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" id="lnk6"><polygon fill="#475569" points="300.3229,110.657,290.7852,108.201,295.3918,111.4841,292.1086,116.0907,300.3229,110.657" style="stroke:#475569;stroke-width:1;"/><path d="M151.0095,135.7031 C195.4437,128.2496 247.0084,119.6001 294.4056,111.6496" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="67.3594" x="175" y="111.9541">created from</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" id="lnk7"><polygon fill="#475569" points="616.775,95.6982,607.775,91.6982,611.775,95.6982,607.775,99.6982,616.775,95.6982" style="stroke:#475569;stroke-width:1;"/><path d="M480.7795,95.6982 C522.0245,95.6982 565.7405,95.6982 610.775,95.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="54.7031" x="539" y="87.9541">next apply</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" data-link-type="dependency" id="lnk8"><polygon fill="#475569" points="265.7813,164.5237,257.1776,159.7303,260.8016,164.0739,256.458,167.6978,265.7813,164.5237" style="stroke:#475569;stroke-width:1;"/><path d="M151.0095,154.1572 C185.0727,157.2338 220.8282,160.4634 259.8057,163.9839" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><?plantuml-src TL7DReCm3Bxp55xF1SHjGXM7dVS8kvXW86k8KMAsigTVIBgLJfsKGsBd-_7d9ssLMJg2eYZJ4MRZoqxZu73ofJfZBYDDLCpBP393lO0mE3sC0frsf4IppKIB8JWlRNWRe4uBg17jG1u26ep-8E3sFNIFO5bWvSL1hmrbsKOHVWRuuPKLcbW6EsXxALQSp9izUVr5TLKrUiA1wjGxbLkrES3fD1lKjca0VQBSCzw4GTle9SphXTm_j7LLLCzNxjqNx0FaRhwTFYf5LfA1RT8x0nY0zIyIvzciaFUFvzlinUazYOTewmYU8QGvS8YoHNNUqlyRG8lTLPszxDLVIA9yNCWF-t6xsMJbeRZWcjOMcDXrm3ryZXW2zE0MQxKTTje3yrMyZM9P5adol4bRhq4v2Y5qq3kUibYBpM0rD2rT95cvuHBHDm00?></g></svg>