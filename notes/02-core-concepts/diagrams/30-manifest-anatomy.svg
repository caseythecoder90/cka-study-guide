<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="447px" preserveAspectRatio="none" style="width:874px;height:447px;background:#FFFFFF;" version="1.1" viewBox="0 0 874 447" width="874px" zoomAndPan="magnify"><title>A Pod manifest: four top-level fields, three YAML shapes</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="485.0771" x="186.9614" y="30.8838">A Pod manifest: four top-level fields, three YAML shapes</text></g><!--cluster top--><g class="cluster" data-qualified-name="top" data-source-line="4" id="ent0002"><rect fill="#F8FAFC" height="388" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="288" x="14" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="117.7363" x="99.1318" y="71.8921">Top level of the file</text></g><!--cluster inmeta--><g class="cluster" data-qualified-name="inmeta" data-source-line="14" id="ent0010"><rect fill="#F8FAFC" height="202.5" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="284" x="310" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="98.2554" x="402.8723" y="71.8921">Inside metadata</text></g><!--cluster inspec--><g class="cluster" data-qualified-name="inspec" data-source-line="20" id="ent0014"><rect fill="#F0FDF4" height="204" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="266" x="602" y="53.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="70.8081" x="699.5959" y="71.8921">Inside spec</text></g><!--entity api--><g class="entity" data-qualified-name="top.api" data-source-line="5" id="ent0003"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="204.6982" x="72.5" y="86.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="82.3799" x="86.5" y="112.8921">apiVersion: v1</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="176.6982" x="86.5" y="125.9648">string &#183; which API group and version</text></g><!--entity kind--><g class="entity" data-qualified-name="top.kind" data-source-line="6" id="ent0004"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="161.2837" x="89.5" y="186.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="54.2026" x="103.5" y="212.3921">kind: Pod</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="133.2837" x="103.5" y="225.4648">string &#183; which type of object</text></g><!--entity meta--><g class="entity" data-qualified-name="top.meta" data-source-line="7" id="ent0005"><rect fill="#326CE5" height="55.5977" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="200.96" x="61.5" y="285.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="61.4072" x="75.5" y="311.8921">metadata:</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="172.96" x="75.5" y="324.9648">dictionary &#183; data about the object</text></g><!--entity spec--><g class="entity" data-qualified-name="top.spec" data-source-line="8" id="ent0006"><rect fill="#326CE5" height="55.5977" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="272.4814" x="22" y="377.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="33.96" x="36" y="403.8921">spec:</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="244.4814" x="36" y="416.9648">dictionary &#183; the state you want; differs per kind</text></g><!--entity name--><g class="entity" data-qualified-name="inmeta.name" data-source-line="15" id="ent0011"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="132.7808" x="385.5" y="86.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="104.7808" x="399.5" y="112.8921">name: myapp-pod</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="26.8984" x="399.5" y="125.9648">string</text></g><!--entity labels--><g class="entity" data-qualified-name="inmeta.labels" data-source-line="16" id="ent0012"><rect fill="#EFF6FF" height="68.2466" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="267.0029" x="318.5" y="180.1982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="41.1836" x="332.5" y="206.3921">labels:</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="239.0029" x="332.5" y="219.4648">dictionary of your own string keys and values</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="149.1069" x="332.5" y="232.1138">app: myapp &#183; type: front-end</text></g><!--entity containers--><g class="entity" data-qualified-name="inspec.containers" data-source-line="21" id="ent0015"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="216.2998" x="644" y="86.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="70.0718" x="658" y="112.8921">containers:</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="188.2998" x="658" y="125.9648">list, because a Pod can hold several</text></g><!--entity item--><g class="entity" data-qualified-name="inspec.item" data-source-line="22" id="ent0016"><rect fill="#DCFCE7" height="70.5464" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="188.7622" x="657.5" y="178.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="147.3481" x="671.5" y="204.8921">- name: nginx-container</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="80.1772" x="682.3354" y="219.8408">image: nginx</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="160.7622" x="671.5" y="232.9136">one list item, itself a dictionary</text></g><g class="link" data-entity-1="ent0015" data-entity-2="ent0016" data-link-type="dependency" id="lnk17"><polygon fill="#475569" points="752,178.5102,756,169.5102,752,173.5102,748,169.5102,752,178.5102" style="stroke:#475569;stroke-width:1;"/><path d="M752,142.8574 C752,153.9014 752,160.7979 752,172.5102" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><?plantuml-src VPJ1Zjem48RlUOhfdWc8QugGE5KhjT8UgafLjuSXdYGkZctP3ZIj-bozzyawJW8a45P2oM4yt__xdmdlfCvL8mYMorN_2yOeln8IIuUrN-K7J4D5DIrjKwiaoA08Tl1Y1DIePK4-P52Ona4mDbLq90M592Ny0aBbYE3hxjD7y1LQyadYA0-eIsOyVJOM-lEcuAF4ROgUOBCfdMdiTWle8nD-9m2ZDhJo2palZSxWk7xL6oz_KRPURtrmKfVmxo-SAfbNi7jvXWu5g0KS-vxDAXxVHXchKEfUXfbJaOFK8ekNV8CVMalHkjd_uCPvSEHCoJK551Wm6v65p0DxGzT6Ugm2xaqJkbJky9Zdf4