<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="354px" preserveAspectRatio="none" style="width:1251px;height:354px;background:#FFFFFF;" version="1.1" viewBox="0 0 1251 354" width="1251px" zoomAndPan="magnify"><title>One process, dozens of controllers</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="301.0693" x="467.4653" y="30.8838">One process, dozens of controllers</text></g><!--cluster kcm--><g class="cluster" data-qualified-name="kcm" data-source-line="4" id="ent0002"><rect fill="#F8FAFC" height="265" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="843" x="14" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="282.4644" x="294.2678" y="71.8921">kube-controller-manager  (one binary, :10257)</text></g><!--entity api--><g class="entity" data-qualified-name="api" data-source-line="18" id="ent0014"><rect fill="#326CE5" height="42.9487" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="120.4917" x="867" y="255.1982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="92.4917" x="881" y="281.3921">kube-apiserver</text></g><!--entity le--><g class="entity" data-qualified-name="le" data-source-line="19" id="ent0015"><rect fill="#FFFFFF" height="68.2466" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="240.1528" x="1005" y="242.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="106.5771" x="1019" y="268.8921">--leader-elect=true</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="210.332" x="1019" y="281.9648">with several control plane nodes, only ONE</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="212.1528" x="1019" y="294.6138">controller manager is active; the others wait</text></g><!--entity w--><g class="entity" data-qualified-name="kcm.w" data-source-line="5" id="ent0003"><rect fill="#EFF6FF" height="80.8955" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="226.6069" x="69.5" y="86.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="66.4536" x="83.5" y="112.8921">Workloads</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="187.6606" x="83.5" y="125.9648">deployment &#183; replicaset &#183; statefulset</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="134.4492" x="83.5" y="138.6138">daemonset &#183; job &#183; cronjob</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="198.6069" x="83.5" y="151.2627">horizontal-pod-autoscaler &#183; disruption</text></g><!--entity n--><g class="entity" data-qualified-name="kcm.n" data-source-line="6" id="ent0004"><rect fill="#326CE5" height="80.8955" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="211.3584" x="328.5" y="86.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="39.73" x="342.5" y="112.8921">Nodes</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="183.3584" x="342.5" y="125.9648">node-lifecycle (the node controller)</text><text fill="#FFFFFF" font-family="Arial, H