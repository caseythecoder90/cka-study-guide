er</text></g><!--entity acc--><g class="entity" data-qualified-name="kcm.acc" data-source-line="9" id="ent0007"><rect fill="#EFF6FF" height="68.2466" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="300.6743" x="283.5" y="242.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="219.667" x="297.5" y="268.8921">Namespaces, accounts, certificates</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="272.6743" x="297.5" y="281.9648">namespace &#183; serviceaccount &#183; serviceaccount-token</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="221.2407" x="297.5" y="294.6138">csr signing / approving &#183; root-ca-publisher</text></g><!--entity gc--><g class="entity" data-qualified-name="kcm.gc" data-source-line="10" id="ent0008"><rect fill="#EFF6FF" height="68.2466" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="246.2007" x="603" y="242.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="55.6118" x="617" y="268.8921">Clean-up</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="218.2007" x="617" y="281.9648">garbage-collector &#183; pod-garbage-collector</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="169.9038" x="617" y="294.6138">ttl-after-finished &#183; resourcequota</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0014" data-link-type="dependency" id="lnk16"><polygon fill="#475569" points="914.9253,254.9887,913.8476,245.199,912.4068,250.6693,906.9366,249.2285,914.9253,254.9887" style="stroke:#475569;strok