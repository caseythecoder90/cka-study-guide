<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="290px" preserveAspectRatio="none" style="width:950px;height:290px;background:#FFFFFF;" version="1.1" viewBox="0 0 950 290" width="950px" zoomAndPan="magnify"><title>A selector is a filter: the ReplicaSet counts only the Pods that match</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="584.1299" x="179.3032" y="30.8838">A selector is a filter: the ReplicaSet counts only the Pods that match</text></g><!--cluster pods--><g class="cluster" data-qualified-name="pods" data-source-line="6" id="ent0003"><rect fill="#F8FAFC" height="109" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="617" x="174.3682" y="129.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="181.3525" x="392.1919" y="147.8921">Pods in the same namespace</text></g><!--entity rs--><g class="entity" data-qualified-name="rs" data-source-line="4" id="ent0002"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="148.7153" x="275.8682" y="53.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="66.4727" x="289.8682" y="79.8921">ReplicaSet</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="54.4199" x="289.8682" y="92.9648">replicas: 3</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="120.7153" x="289.8682" y="105.6138">selector: tier=front-end</text></g><!--entity a--><g class="entity" data-qualified-name="pods.a" data-source-line="7" id="ent0004"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="99.8062" x="182.3682" y="168.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="36.8418" x="196.3682" y="194.8921">web-a</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="71.8062" x="196.3682" y="207.9648">tier=front-end</text></g><!--entity b--><g class="entity" data-qualified-name="pods.b" data-source-line="8" id="ent0005"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="99.8062" x="300.3682" y="168.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="37.5527" x="314.3682" y="194.8921">web-b</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="71.8062" x="314.3682" y="207.9648">tier=front-end</text></g><!--entity c--><g class="entity" data-qualified-name="pods.c" data-source-line="9" id="ent0006"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="148.4414" x="418.3682" y="162.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="55.6118" x="432.3682" y="188.8921">bare-pod</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="71.8062" x="432.3682" y="201.9648">tier=front-end</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="120.4414" x="432.3682" y="214.6138">created by hand earlier</text></g><!--entity d--><g class="entity" data-qualified-name="pods.d" data-source-line="10" id="ent0007"><rect fill="#F1F5F9" height="55.5977" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="94.9561" x="584.8682" y="168.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="14.46" x="598.8682" y="194.8921">db</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="66.9561" x="598.8682" y="207.9648">tier=back-end</text></g><!--entity e--><g class="entity" data-qualified-name="pods.e" data-source-line="11" id="ent0008"><rect fill="#F1F5F9" height="55.5977" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="84.8691" x="697.8682" y="168.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="34.6899" x="711.8682" y="194.8921">cache</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="56.8691" x="711.8682" y="207.9648">no tier label</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" id="lnk13"><polygon fill="#475569" points="254.0244,168.6705,262.9011,164.4039,257.2627,164.8609,256.8057,159.2225,254.0244,168.6705" style="stroke:#475569;stroke-width:1;"/><path d="M300.7697,121.8616 C297.5215,124.4291 294.3576,127.0534 291.3682,129.6982 C278.0157,141.5118 268.5359,151.599 257.9104,164.099" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" data-link-type="dependency" id="lnk14"><polygon fill="#475569" points="350.3682,168.5463,354.3682,159.5463,350.3682,163.5463,346.3682,159.5463,350.3682,168.5463" style="stroke:#475569;stroke-width:1;"/><path d="M350.3682,121.9672 C350.3682,136.9361 350.3682,148.3829 350.3682,162.5463" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0006" data-link-type="dependency" id="lnk15"><polygon fill="#475569" points="451.8261,162.6052,447.2918,153.8622,447.9199,159.484,442.298,160.1121,451.8261,162.6052" style="stroke:#475569;stroke-width:1;"/><path d="M398.5296,121.7832 C402.2174,124.4331 405.8653,127.0926 409.3682,129.6982 C423.4012,140.1367 433.7616,148.1714 447.1386,158.8598" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="22"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="932.7363" x="5" y="258.8301">3 matching Pods = desired state, so nothing is created. The hand-made Pod is acquired, and the template is used only when a replacement is needed.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="798.082" x="72.3271" y="274.9287">Add a fourth matching Pod and the ReplicaSet deletes one. Change a Pod's label and it stops counting, so a new Pod is created.</text></g><?plantuml-src bLDDRzGm4BtdLmozS6aILRsjqaWLVm01D-0miQU9LNy4Uw9LGVntnauN4b9K8QsYzSoyDy_ZUM-CLtRH14tJhZyEmQPM6nmZkjIgHwnv8aVDl3XRiM5BS0-9B2aE4Km2X0TZcU89f10-q6oDme_4eCBYEK7mzgcatWUTv0yoE6GrLLKK3lIZC5xzWNtnNJBVwNHpqySrc4vmsxKvs6-I5mdIrb2yUuZ1SqrUFrTUGTUXKkIvxm4JnBJhLxGONtGbT0HUFcb6HHaunh3CAsxEXJygW0tuJ4ED6od_5326e5SQF38C_ySmx1a6Z5IBkDT8DdaL2Paq34ymeTT06Ar0NkoczjtqGUo0wl4lhMuHzXMkzt25Qg8DWm_bqS3YGFPb1X86XFhpPBGc_pMQSUAwBrCOZk4iLnt3MOO-XgdwASkGeDRXxEMCsyEmFQYgKZYp2Huwqz-kYslykExo7MXA9if84yjaho45y85BWHZZUTuDV98bonEl7UfYWs8RzMt9s6l8Rv7taCdDLX0vkoHXBSuvJ-Hb4jaBifrE5ZhdFP4Mwgur-OLDVwzrDc9O8ayxbR_PDyRKOXscx4ngu9qe6qd0KlmshKzIG8RbMc5Egu-5hjmFfVNvSeVB3RECNm00?></g></svg>