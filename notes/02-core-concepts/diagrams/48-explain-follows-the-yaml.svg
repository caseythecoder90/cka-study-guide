<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="399px" preserveAspectRatio="none" style="width:797px;height:399px;background:#FFFFFF;" version="1.1" viewBox="0 0 797 399" width="797px" zoomAndPan="magnify"><title>The explain path is the YAML path, joined with dots</title><defs/><g><g class="title" data-source-line="3"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="440.0156" x="174.8867" y="30.8838">The explain path is the YAML path, joined with dots</text></g><!--cluster yaml--><g class="cluster" data-qualified-name="yaml" data-source-line="5" id="ent0002"><rect fill="#F8FAFC" height="187" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="151" x="115.8945" y="176.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="80.1836" x="151.3027" y="194.8921">The manifest</text></g><!--cluster cmd--><g class="cluster" data-qualified-name="cmd" data-source-line="9" id="ent0004"><rect fill="#F0FDF4" height="310" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="410" x="286.8945" y="53.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="260.8125" x="361.4883" y="71.8921">The command, one level deeper each time</text></g><!--entity y--><g class="entity" data-qualified-name="yaml.y" data-source-line="6" id="ent0003"><rect fill="#FFFFFF" height="102.7437" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="134.939" x="123.8945" y="210.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="31.0718" x="137.8945" y="236.3921">spec:</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="63.5908" x="145.1182" y="251.3408">containers:</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="71.5317" x="152.3418" y="266.2896">- name: web</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="85.2681" x="159.5654" y="281.2383">livenessProbe:</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="46.249" x="166.7891" y="296.187">httpGet:</text></g><!--entity c4--><g class="entity" data-qualified-name="cmd.c4" data-source-line="10" id="ent0005"><rect fill="#DCFCE7" height="42.9487" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="393.5425" x="294.8945" y="270.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="365.5425" x="308.8945" y="296.3921">kubectl explain pod.spec.containers.livenessProbe.httpGet</text></g><!--entity c3--><g class="entity" data-qualified-name="cmd.c3" data-source-line="11" id="ent0006"><rect fill="#EFF6FF" height="42.9487" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="343.7197" x="319.8945" y="209.1982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="315.7197" x="333.8945" y="235.3921">kubectl explain pod.spec.containers.livenessProbe</text></g><!--entity c2--><g class="entity" data-qualified-name="cmd.c2" data-source-line="12" id="ent0007"><rect fill="#EFF6FF" height="42.9487" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="251.9517" x="365.8945" y="148.1982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="223.9517" x="379.8945" y="174.3921">kubectl explain pod.spec.containers</text></g><!--entity c1--><g class="entity" data-qualified-name="cmd.c1" data-source-line="13" id="ent0008"><rect fill="#EFF6FF" height="42.9487" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="182.5972" x="400.3945" y="87.1982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="154.5972" x="414.3945" y="113.3921">kubectl explain pod.spec</text></g><g class="caption" data-source-line="21"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="779.7891" x="5" y="383.8301">Lists need no index or dash: containers is a list, but the path just continues through it. Each step shows the next level of fields.</text></g><?plantuml-src fP8xRzim58Lt_OfJpxQCF2R14D0Xo9807Re4QGUQl9PkmeSWNiKEYlxtafGRfqc65WMuy3xEFUJzFh7NTZA4kbxFHqAmSMrOTQDoSQqVrKfwSbGFaxELfPr00aRkUe7XaRHmy9MmMCBNda27mIhs69Jqu8ZKZBlFjpSbiCH3O4y6UqvP4oHMLPPGlaljYzplbESTHLbWi-d6C0rj2nNnh9p5ZmfuLHu7qiqt3-ZW9SsaCPOhi89NZXhiQJi70CjFv2d6BsFOKlCx2lGYmpL9a-SLvyTvrSztrdHmoPrP8dY2fIUoC4G3ZI2bUmWxUd5z7OAPbRGpRuq_JjjqiQU_2gREZwbF3wd_y5iVNHRva_BbVyekYih5FwlCVUT_rpSNdwLYVOdLVS_6aFzU05grytHzyK4Yo-lp3n9dUJM5XvUS2NkVKyvKbLP3HX8RRcyuIeId19mFO6_eW332gDWthw39cAe4I9GbjfCKP0k-3rEKKiT-eenoscoNg9OQLtdZKMX0xCD-njpJGOvSX1rsJDR4UhFczXS0?></g></svg>