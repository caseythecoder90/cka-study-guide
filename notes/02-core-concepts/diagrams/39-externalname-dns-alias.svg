<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="278px" preserveAspectRatio="none" style="width:940px;height:278px;background:#FFFFFF;" version="1.1" viewBox="0 0 940 278" width="940px" zoomAndPan="magnify"><title>ExternalName is a DNS alias: traffic never passes through the Service</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="597.2432" x="168.3784" y="30.8838">ExternalName is a DNS alias: traffic never passes through the Service</text></g><!--entity pod--><g class="entity" data-qualified-name="pod" data-source-line="4" id="ent0002"><rect fill="#326CE5" height="42.9487" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="52.5527" x="77.5" y="68.1982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="24.5527" x="91.5" y="94.3921">Pod</text></g><!--entity dns--><g class="entity" data-qualified-name="dns" data-source-line="5" id="ent0003"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="90.353" x="394" y="61.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="57.0654" x="408" y="87.8921">CoreDNS</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="62.353" x="408" y="100.9648">cluster DNS</text></g><!--entity pub--><g class="entity" data-qualified-name="pub" data-source-line="6" id="ent0004"><rect fill="#FFFFFF" height="42.9487" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="165.998" x="769" y="68.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="137.998" x="783" y="94.3921">Public or company DNS</text></g><!--entity db--><g class="entity" data-qualified-name="db" data-source-line="7" id="ent0005"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="196.1367" x="6" y="178.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="164.7471" x="20" y="204.8921">my.database.example.com</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="168.1367" x="20" y="217.9648">203.0.113.10, outside the cluster</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" id="lnk6"><polygon fill="#475569" points="393.9118,89.6982,384.9118,85.6982,388.9118,89.6982,384.9118,93.6982,393.9118,89.6982" style="stroke:#475569;stroke-width:1;"/><path d="M130.5669,89.6982 C187.7489,89.6982 317.0353,89.6982 387.9118,89.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="234.0762" x="145.25" y="78.9541">1  what is my-service.prod.svc.cluster.local?</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" id="lnk7"><polygon fill="#475569" points="768.7475,89.6982,759.7475,85.6982,763.7475,89.6982,759.7475,93.6982,768.7475,89.6982" style="stroke:#475569;stroke-width:1;"/><path d="M484.3796,89.6982 C552.6907,89.6982 677.0492,89.6982 762.7475,89.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="255.4277" x="499" y="64.9541">2  it is a CNAME for my.database.example.com;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="95.3965" x="579.0156" y="78.7529">look that name up</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" data-link-type="dependency" id="lnk8"><polygon fill="#475569" points="104,178.397,108,169.397,104,173.397,100,169.397,104,178.397" style="stroke:#475569;stroke-width:1;"/><path d="M104,111.2579 C104,129.9936 104,151.8032 104,172.397" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="185.4316" x="110" y="152.9541">3  connects directly to that address</text></g><g class="caption" data-source-line="13"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="690.252" x="121.874" y="246.8301">No ClusterIP, no selector, no EndpointSlice, no kube-proxy rules, no port mapping. Only the name is translated.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="520.6797" x="206.6602" y="262.9287">Move the database, change spec.externalName, and no application config changes.</text></g><?plantuml-src TP91Zzem48Nl-HLJpc38SgDHgefow67fIbptCjX3Ok5uBDjXeR--OqAtsyDAaQ9OUVE-zyPVhDTkD0HABQSdCxkqD1QxY4DQwZCkSay3gJ0EhiesEuBTDLFqwFOu4DW423_s1q1dCMqWHpoTh0PF5ueGC2LAaFl8OzVBc-10yM8rLLKadT5tCd3smcO6JODQayzj2vWWiFdunvOZYSkhRvBzJPkwRWKy2KVnRfRbi9qLdV7flydZqGaDHz0y1FItyd_n2WwjVrYDnu-IuQOCPZnY8aLN788Z9U8Fra-hjLgfkbwhUZK77dEoqc49zu1w1sgQZjbCDkPOLP8A5j5sVLwq1HKsK0EyzPXBaSDjaQPsL8XiLBfezPYe76jqtwgYUHyWu3BW2S3cQG_R_VVd7PmaxISXlhvwntmMLd7qPNzZcA0Cl_d2L2QkGThoNYeHQbkgSJV8FAdGc4WfLPN6a2rxQ6oxPzXEd3zVvk0P4ZbHSRn_xBm9R7q-o2ReVd8UZxIGYDSRnD5HkXy6ZXa63C7wJi4lNpobKl-uPNAnV7AOoQXcQLjPXssV-JBr_ZVh77GlQoH8WRG4_tTHvu3U51in40wyeqlAa-qUcdIV-mS0?></g></svg>