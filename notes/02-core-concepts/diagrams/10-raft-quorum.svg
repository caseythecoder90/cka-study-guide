<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="SEQUENCE" height="556px" preserveAspectRatio="none" style="width:781px;height:556px;background:#FFFFFF;" version="1.1" viewBox="0 0 781 556" width="781px" zoomAndPan="magnify"><title>"Distributed and reliable": a write in a 3-member etcd cluster (Raft)</title><defs/><g><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="570.1992" x="101.5952" y="35.8838">"Distributed and reliable": a write in a 3-member etcd cluster (Raft)</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="561.0459" x="106.1719" y="524.6133">A write succeeds once a majority stores it, so any one member can fail without losing data.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="763.3896" x="5" y="540.7119">If the leader fails, the followers elect a new one. Lose the majority, and etcd refuses writes rather than risk diverging copies.</text><g class="participant-lifeline" data-entity-uid="part1" data-qualified-name="c" id="part1-lifeline"><g><title>client</title><rect fill="#000000" fill-opacity="0.00000" height="345.9883" width="8" x="193.3557" y="107.5957"/><line style="stroke:#94A3B8;stroke-width:0.5;stroke-dasharray:5,5;" x1="196.7808" x2="196.7808" y1="107.5957" y2="453.584"/></g></g><g class="participant-lifeline" data-entity-uid="part2" data-qualified-name="l" id="part2-lifeline"><g><title>etcd-1</title><rect fill="#000000" fill-opacity="0.00000" height="345.9883" width="8" x="382.1116" y="107.5957"/><line style="stroke:#94A3B8;stroke-width:0.5;stroke-dasharray:5,5;" x1="385.3879" x2="385.3879" y1="107.5957" y2="453.584"/></g></g><g class="participant-lifeline" data-entity-uid="part3" da