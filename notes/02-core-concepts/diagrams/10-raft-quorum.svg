pods/default/web</text></g><path d="M287.7808,163.3945 L287.7808,198.3945 A5,5 0 0 0 292.7808,203.3945 L477.7808,203.3945 A5,5 0 0 0 482.7808,198.3945 L482.7808,168.3945 L472.7808,158.3945 L292.7808,158.3945 A5,5 0 0 0 287.7808,163.3945" fill="#FEFCE8" style="stroke:#CA8A04;stroke-width:1;"/><path d="M472.7808,158.3945 L472.7808,165.8945 A2.5,2.5 0 0 0 475.2808,168.3945 L482.7808,168.3945 L472.7808,158.3945" fill="#FEFCE8" style="stroke:#CA8A04;stroke-width:1;"/><text fill="#422006" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="161.4141" x="297.7808" y="178.6504">only the leader accepts writes;</text><text fill="#422006" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="166.0781" x="297.7808" y="192.4492">a follower would forward it here</text><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg2"><polygon fill="#475569" points="508.8557,232.791,518.8557,236.791,508.8557,240.791,512.8557,236.791" style="stroke:#475569;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1.6;" x1="386.1116" x2="514.8557" y1="236.791" y2="236.791"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="102.7441" x="397.1116" y="228.248">append entry to log</text></g><g class="message" data-entity-1="part2" data-entity-2="part4" id="msg3"><polygon fill="#475569" points="590.6912,268.5898,600.6912,272.5898,590.6912,276.5898,594.6912,272.5898" style="stroke:#475569;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1.6;" x1="386.1116" x2="596.6912" y1="272.5898" y2="272.5898"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="102.7441" x="397.1116" y="264.0469">append entry to log</text></g><g class="message" data-entity-1="part3" data-entity-2="part2" id="msg4"><polygon fill="#475569" points="397.1116,304.3887,387.1116,308.3887,397.1116,312.3887,