<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="524px" preserveAspectRatio="none" style="width:1122px;height:524px;background:#FFFFFF;" version="1.1" viewBox="0 0 1122 524" width="1122px" zoomAndPan="magnify"><title>The same people, stored three ways</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="309.1113" x="398.9443" y="30.8838">The same people, stored three ways</text></g><!--cluster rel--><g class="cluster" data-qualified-name="rel" data-source-line="4" id="ent0002"><rect fill="#F8FAFC" height="279.5" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="390" x="14" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="234.0444" x="91.9778" y="71.8921">Relational &#8212; one table, fixed columns</text></g><!--cluster doc--><g class="cluster" data-qualified-name="doc" data-source-line="16" id="ent0006"><rect fill="#F8FAFC" height="420.5" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="330" x="412" y="98.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="255.7534" x="449.1233" y="116.3921">Document &#8212; each record describes itself</text></g><!--cluster kv--><g class="cluster" data-qualified-name="kv" data-source-line="26" id="ent0014"><rect fill="#F0FDF4" height="413" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="366" x="750" y="105.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="197.2471" x="834.3765" y="123.8921">Key-value &#8212; one key, one value</text></g><!--entity table--><g class="entity" data-qualified-name="rel.table" data-source-line="5" id="ent0003"><rect fill="#FFFFFF" height="146.7437" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="340.4097" x="56" y="86.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="35.4072" x="77.6118" y="118.8921">Name</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="24.5591" x="168.6963" y="118.8921">Age</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="54.1646" x="208.479" y="118.8921">Location</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="39.0317" x="282.9707" y="118.8921">Salary</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="37.5718" x="337.2261" y="118.8921">Grade</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="55.6499" x="77.6118" y="141.8408">John Doe</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="14.46" x="168.6963" y="141.8408">45</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="56.3481" x="208.479" y="141.8408">New York</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="28.9199" x="282.9707" y="141.8408">5000</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="333.6143" y="141.8408">&#160;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="67.1899" x="77.6118" y="164.7896">Dave Smith</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="14.46" x="168.6963" y="164.7896">34</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="56.3481" x="208.479" y="164.7896">New York</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="28.9199" x="282.9707" y="164.7896">4000</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="333.6143" y="164.7896">&#160;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="75.8608" x="77.6118" y="187.7383">Aryan Kumar</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="14.46" x="168.6963" y="187.7383">10</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="56.3481" x="208.479" y="187.7383">New York</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="279.3589" y="187.7383">&#160;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="8.6709" x="337.2261" y="187.7383">A</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="67.939" x="77.6118" y="210.687">Lauren Rob</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="14.46" x="168.6963" y="210.687">13</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="59.2681" x="208.479" y="210.687">Bangalore</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="279.3589" y="210.687">&#160;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="9.3882" x="337.2261" y="210.687">C</text><line style="stroke:#334155;stroke-width:1;" x1="70" x2="382.4097" y1="102.6982" y2="102.6982"/><line style="stroke:#334155;stroke-width:1;" x1="70" x2="382.4097" y1="125.647" y2="125.647"/><line style="stroke:#334155;stroke-width:1;" x1="70" x2="382.4097" y1="148.5957" y2="148.5957"/><line style="stroke:#334155;stroke-width:1;" x1="70" x2="382.4097" y1="171.5444" y2="171.5444"/><line style="stroke:#334155;stroke-width:1;" x1="70" x2="382.4097" y1="194.4932" y2="194.4932"/><line style="stroke:#334155;stroke-width:1;" x1="70" x2="382.4097" y1="217.4419" y2="217.4419"/><line style="stroke:#334155;stroke-width:1;" x1="70" x2="70" y1="102.6982" y2="217.4419"/><line style="stroke:#334155;stroke-width:1;" x1="161.0845" x2="161.0845" y1="102.6982" y2="217.4419"/><line style="stroke:#334155;stroke-width:1;" x1="200.8672" x2="200.8672" y1="102.6982" y2="217.4419"/><line style="stroke:#334155;stroke-width:1;" x1="275.3589" x2="275.3589" y1="102.6982" y2="217.4419"/><line style="stroke:#334155;stroke-width:1;" x1="329.6143" x2="329.6143" y1="102.6982" y2="217.4419"/><line style="stroke:#334155;stroke-width:1;" x1="382.4097" x2="382.4097" y1="102.6982" y2="217.4419"/></g><!--entity relcap--><g class="entity" data-qualified-name="rel.relcap" data-source-line="12" id="ent0004"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="276.8853" x="87.5" y="296.5161">Every row has every column. Adding 'Grade' for students</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="265.3535" x="87.5" y="309.165">changes the table for everyone; most cells stay empty.</text></g><!--entity d1--><g class="entity" data-qualified-name="doc.d1" data-source-line="17" id="ent0007"><rect fill="#FFFFFF" height="57.8975" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="229.6016" x="462" y="131.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="157.5552" x="476" y="157.3921">{ name: John Doe, age: 45,</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="194.3779" x="483.2236" y="172.3408">location: New York, salary: 5000 }</text></g><!--entity d2--><g class="entity" data-qualified-name="doc.d2" data-source-line="18" id="ent0008"><rect fill="#FFFFFF" height="57.8975" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="312.6987" x="420.5" y="269.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="284.6987" x="434.5" y="295.8921">{ name: Dave Smith, age: 34, location: New York,</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="201.6079" x="441.7236" y="310.8408">salary: 4000, organization: ACME }</text></g><!--entity d3--><g class="entity" data-qualified-name="doc.d3" data-source-line="19" id="ent0009"><rect fill="#FFFFFF" height="57.8975" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="207.9243" x="473" y="363.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="177.7661" x="487" y="389.8921">{ name: Aryan Kumar, age: 10,</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="172.7007" x="494.2236" y="404.8408">location: New York, grade: A }</text></g><!--entity doccap--><g class="entity" data-qualified-name="doc.doccap" data-source-line="20" id="ent0010"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="163.2544" x="495.5" y="482.0161">Records can have different fields.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="154.0913" x="495.5" y="494.665">Queryable by field, but no joins.</text></g><!--entity k1--><g class="entity" data-qualified-name="kv.k1" data-source-line="27" id="ent0015"><rect fill="#FFFFFF" height="42.9487" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="315.5425" x="792" y="138.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="287.5425" x="806" y="164.8921">user/john_doe  &#8594;  '{name: John Doe, age: 45, ...}'</text></g><!--entity k2--><g class="entity" data-qualified-name="kv.k2" data-source-line="28" id="ent0016"><rect fill="#FFFFFF" height="42.9487" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="289.4663" x="803.5" y="277.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="261.4663" x="817.5" y="303.3921">user/dave_smith  &#8594;  '{name: Dave Smith, ...}'</text></g><!--entity k3--><g class="entity" data-qualified-name="kv.k3" data-source-line="29" id="ent0017"><rect fill="#DCFCE7" height="42.9487" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="321.2744" x="786.5" y="371.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="293.2744" x="800.5" y="397.3921">/registry/pods/default/web  &#8594;  &lt;the Pod object&gt;</text></g><!--entity kvcap--><g class="entity" data-qualified-name="kv.kvcap" data-source-line="30" id="ent0018"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="239.0781" x="827.5" y="482.0161">The store never looks inside the value: you get it,</text><text fill="#0F172A" font-famil