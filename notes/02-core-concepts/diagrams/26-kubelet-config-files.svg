<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="511px" preserveAspectRatio="none" style="width:950px;height:511px;background:#FFFFFF;" version="1.1" viewBox="0 0 950 511" width="950px" zoomAndPan="magnify"><title>Where a kubeadm node's kubelet gets its settings</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="426.3838" x="258.3081" y="30.8838">Where a kubeadm node's kubelet gets its settings</text></g><!--cluster files--><g class="cluster" data-qualified-name="files" data-source-line="8" id="ent0004"><rect fill="#F8FAFC" height="226" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="830" x="114" y="233.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="51.2827" x="503.3586" y="251.8921">Settings</text></g><!--entity unit--><g class="entity" data-qualified-name="unit" data-source-line="4" id="ent0002"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="235.2168" x="12.5" y="53.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="93.9453" x="26.5" y="79.8921">kubelet.service</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="207.2168" x="26.5" y="92.9648">systemd unit from the kubelet package:</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="138.4668" x="26.5" y="105.6138">ExecStart=/usr/bin/kubelet</text></g><!--entity dropin--><g class="entity" data-qualified-name="dropin" data-source-line="6" id="ent0003"><rect fill="#EFF6FF" height="68.2466" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="248.1021" x="6" y="157.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="106.9136" x="20" y="183.8921">10-kubeadm.conf</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="220.1021" x="20" y="196.9648">/usr/lib/systemd/system/kubelet.service.d/</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="172.3369" x="20" y="209.6138">drop-in that adds the flags below</text></g><!--entity cfg--><g class="entity" data-qualified-name="files.cfg" data-source-line="9" id="ent0005"><rect fill="#DCFCE7" height="80.8955" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="262.6685" x="156.5" y="266.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="166.8799" x="170.5" y="292.8921">/var/lib/kubelet/config.yaml</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="159.4731" x="170.5" y="305.9648">--config: KubeletConfiguration</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="216.9976" x="170.5" y="318.6138">staticPodPath, cgroupDriver, clusterDNS,</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="234.6685" x="170.5" y="331.2627">containerRuntimeEndpoint, authentication ...</text></g><!--entity kc--><g class="entity" data-qualified-name="files.kc" data-source-line="10" id="ent0006"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="211.9976" x="438" y="273.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="175.5508" x="452" y="299.3921">/etc/kubernetes/kubelet.conf</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="149.1284" x="452" y="312.4648">--kubeconfig: how it reaches</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="183.9976" x="452" y="325.1138">and authenticates to the API server</text></g><!--entity bkc--><g class="entity" data-qualified-name="files.bkc" data-source-line="11" id="ent0007"><rect fill="#EFF6FF" height="68.2466" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="267.8208" x="668" y="273.1982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="239.8208" x="682" y="299.3921">/etc/kubernetes/bootstrap-kubelet.conf</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="223.0562" x="682" y="312.4648">--bootstrap-kubeconfig: used once, at join,</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="203.1079" x="682" y="325.1138">to request the kubelet's own certificate</text></g><!--entity env--><g class="entity" data-qualified-name="files.env" data-source-line="12" id="ent0008"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="240.3989" x="168" y="389.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="212.3989" x="182" y="415.8921">/var/lib/kubelet/kubeadm-flags.env</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="181.5322" x="182" y="428.9648">flags kubeadm works out per node</text></g><!--entity user--><g class="entity" data-qualified-name="files.user" data-source-line="13" id="ent0009"><rect fill="#FFFFFF" height="68.2466" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="188.1982" x="426" y="383.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="109.1289" x="440" y="409.8921">/etc/default/kubelet</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="160.1821" x="440" y="422.9648">(/etc/sysconfig/kubelet on RHEL)</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="160.1982" x="440" y="435.6138">your own extra flags; applied last</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" id="lnk14"><polygon fill="#475569" points="130,157.3989,134,148.3989,130,152.3989,126,148.3989,130,157.3989" style="stroke:#475569;stroke-width:1;"/><path d="M130,121.8147 C130,133.2162 130,139.9829 130,151.3989" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" id="lnk15"><polygon fill="#475569" points="130,233.4378,134,224.4378,130,228.4378,126,224.4378,130,233.4378" style="stroke:#475569;stroke-width:1;"/><path d="M130,225.8323 C130,227.2963 130,228.7858 130,230.2959 C130,231.0509 130,231.8111 130,232.5757 C130,232.7669 130,232.9583 130,233.15 C130,233.2459 130,227.3418 130,227.4378" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="23"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="662.2178" x="140.3911" y="479.8301">After editing any of these: systemctl daemon-reload (unit or drop-in changed) and systemctl restart kubelet.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="521.9717" x="210.5142" y="495.9287">A wrong path in config.yaml or kubelet.conf is a classic "node NotReady" exam task.</text></g><?plantuml-src VLHDRzD04BtdLmovq4grJQybHAfe9H2egje31-0msHtRI-nTipjE6X3_dV7QIPsu8EL3zixilFTcthmoLbMj9aZJhF-mSrN8jC72OnqojSQ4IwefRTgwch7XYk1BIPu0OTsk27KDrcbw7U9ZHGm5SG0Ztq3CnXPXDlEa66qXkVCXAWtaDqRHDxi8vXTTNLukmoumrHfQQnXoxsgGoeTR6nGi1LqjiYv-ESgxVIBroEZvNTO6dwsCpOQa8NOEYmKgHPQNIy0G2nnXkdoJ35nIvMm-kZlUM9bLDe0R_hCJ5gdEfhYqTqrYhB101jGwH3vvXKK0oNRR0pp1r0KRUuJgSP2lWrzurpOz-jnK5E3t360Kcssmnpa0opeUfaXtM5SZI4dIlx-2JttS-_ZOUcJZx9H2O3bGzqxV8vSNe2AC6sysvEMfQaKBVtFtU37Db3gCnf9_Q2sRccwjRfonV07OYWpoJiMQCddfg4s5SxgdgVBYX2AnYlIy9QPmQC59nvBOoZtDqcrb5EKQL2M5AKoqUWn8X6KNstHz_n6wvf9_4TrQ_H_SoZaExB59_WdpE6GFk0samLb58XJ33v7i1N45ewUVBGKUMqGiwBOM57asUMGp7h3L1FBfo0mMIEA4fcGteuhzrEuDltL-BSLQSINvQFzn9SbyGHnDEROLxwkDxZwBvsAiNeDzXAW03nzkFvzF-UzSwoDNUX81Uqkz1MoQoeXw5OQnyvjAvd0mldHKeCbeGVArD5gJ_UvDKNAox3kwLjE3NhYZ72srvQGdAh_Jf5ZfpsmMTraon0yUx_yERwEVPpE5JVJ3mYolSx4La3QT_G7j3bpUDJhG5VJxHt456gbsDl6oIL33MQpaFEotZYf5VTBdq8tuSvQNeP5LkPyPyPxfb9MYiFLEoZNYTEZodnT8T-ruZC44sVvAT0v6mRphFzmvVf3PsCsb9oYR6yCwtlqN?></g></svg>