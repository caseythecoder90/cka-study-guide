<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="176px" preserveAspectRatio="none" style="width:1023px;height:176px;background:#FFFFFF;" version="1.1" viewBox="0 0 1023 176" width="1023px" zoomAndPan="magnify"><title>What happens to the annotation at each step</title><defs/><g><g class="title" data-source-line="3"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="383.0273" x="316.4863" y="30.8838">What happens to the annotation at each step</text></g><!--entity s1--><g class="entity" data-qualified-name="s1" data-source-line="5" id="ent0002"><rect fill="#326CE5" height="95.8442" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="263.9844" x="6" y="67.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="171.939" x="20" y="93.8921">1. kubectl apply -f web.yaml</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="124.0991" x="20" y="106.9648">creates the Deployment</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="20" y="121.4897">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="235.9844" x="20" y="134.5625">live: image 1.18, label tier, replicas 1 (default)</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="170.543" x="20" y="147.2114">annotation: image 1.18, label tier</text></g><!--entity s2--><g class="entity" data-qualified-name="s2" data-source-line="6" id="ent0003"><rect fill="#EFF6FF" height="95.8442" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="200.3452" x="306" y="67.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="172.3452" x="320" y="93.8921">2. kubectl scale --replicas=3</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="112.4868" x="320" y="106.9648">an imperative change</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="320" y="121.4897">&#160;</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="75.8237" x="320" y="134.5625">live: replicas 3</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="121.6016" x="320" y="147.2114">annotation: unchanged</text></g><!--entity s3--><g class="entity" data-qualified-name="s3" data-source-line="7" id="ent0004"><rect fill="#FFFFFF" height="83.1953" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="191.8828" x="542" y="74.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="95.3735" x="556" y="100.3921">3. Edit web.yaml</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="135.1421" x="556" y="113.4648">image 1.19, delete label tier</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="556" y="127.9897">&#160;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="163.8828" x="556" y="141.0625">nothing in the cluster changes yet</text></g><!--entity s4--><g class="entity" data-qualified-name="s4" data-source-line="8" id="ent0005"><rect fill="#DCFCE7" height="108.4932" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="247.4146" x="770" y="61.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="171.939" x="784" y="87.8921">4. kubectl apply -f web.yaml</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="88.6499" x="784" y="100.9648">image set to 1.19</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="219.4146" x="784" y="113.6138">label tier deleted (it was in the annotation)</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="167.5029" x="784" y="126.2627">replicas 3 kept (never in the file)</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="784" y="140.7876">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="185.7808" x="784" y="153.8604">annotation: rewritten to the new file</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" id="lnk6"><polygon fill="#475569" points="305.913,115.6982,296.913,111.6982,300.913,115.6982,296.913,119.6982,305.913,115.6982" style="stroke:#475569;stroke-width:1;"/><path d="M270.0518,115.6982 C282.1166,115.6982 288.2027,115.6982 299.913,115.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" id="lnk7"><polygon fill="#475569" points="541.7581,115.6982,532.7581,111.6982,536.7581,115.6982,532.7581,119.6982,541.7581,115.698