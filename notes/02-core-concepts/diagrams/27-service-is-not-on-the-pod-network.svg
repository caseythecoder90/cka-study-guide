<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="453px" preserveAspectRatio="none" style="width:926px;height:453px;background:#FFFFFF;" version="1.1" viewBox="0 0 926 453" width="926px" zoomAndPan="magnify"><title>Pods are on the Pod network; a Service is only a rule on every node</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="580.1748" x="165.4126" y="30.8838">Pods are on the Pod network; a Service is only a rule on every node</text></g><!--cluster podnet--><g class="cluster" data-qualified-name="podnet" data-source-line="4" id="ent0002"><rect fill="#F8FAFC" height="347.5" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="504" x="14" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="450.0679" x="40.9661" y="71.8921">Pod network  (CNI plugin: every Pod can reach every Pod, across nodes)</text></g><!--cluster n2--><g class="cluster" data-qualified-name="podnet.n2" data-source-line="5" id="ent0003"><rect fill="#F8FAFC" height="306.5" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="240" x="270" y="86.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="45.5127" x="367.2437" y="104.8921">node02</text></g><!--cluster n1--><g class="cluster" data-qualified-name="podnet.n1" data-source-line="12" id="ent0009"><rect fill="#F8FAFC" height="306.5" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="240" x="22" y="86.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="45.5127" x="119.2437" y="104.8921">node01</text></g><!--entity svc--><g class="entity" data-qualified-name="svc" data-source-line="22" id="ent0016"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="394.126" x="526" y="329.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="145.9771" x="540" y="355.8921">Service db  &#183;  10.96.0.12</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="323.9307" x="540" y="368.9648">an API object only: no Pod, no interface, no process listening.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="366.126" x="540" y="381.6138">Its IP comes from --service-cluster-ip-range, not from the Pod network</text></g><!--entity db--><g class="entity" data-qualified-name="podnet.n2.db" data-source-line="6" id="ent0004"><rect fill="#FEE2E2" height="55.5977" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="79.9922" x="392" y="119.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="44.0464" x="406" y="145.8921">db Pod</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="51.9922" x="406" y="158.9648">10.32.0.15</text></g><!--entity kp2--><g class="entity" data-qualified-name="podnet.n2.kp2" data-source-line="7" id="ent0005"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="112.3477" x="376" y="212.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="70.0718" x="390" y="238.8921">kube-proxy</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="84.3477" x="390" y="251.9648">DaemonSet Pod</text></g><!--entity r2--><g class="entity" data-qualified-name="podnet.n2.r2" data-source-line="8" id="ent0006"><rect fill="#FFFFFF" height="42.9487" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="223.146" x="278.5" y="342.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="195.146" x="292.5" y="368.3921">iptables: 10.96.0.12 &#8594; 10.32.0.15</text></g><!--entity web--><g class="entity" data-qualified-name="podnet.n1.web" data-source-line="13" id="ent0010"><rect fill="#326CE5" height="55.5977" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="81.4473" x="168.5" y="119.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="53.4473" x="182.5" y="145.8921">web Pod</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="51.9922" x="182.5" y="158.9648">10.32.0.14</text></g><!--entity kp1--><g class="entity" data-qualified-name="podnet.n1.kp1" data-source-line="14" id="ent0011"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="112.3477" x="142" y="212.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="70.0718" x="156" y="238.8921">kube-proxy</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="84.3477" x="156" y="251.9648">DaemonSet Pod</text></g><!--entity r1--><g class="entity" data-qualified-name="podnet.n1.r1" data-source-line="15" id="ent0012"><rect fill="#FFFFFF" height="42.9487" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="223.146" x="30.5" y="342.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="195.146" x="44.5" y="368.3921">iptables: 10.96.0.12 &#8594; 10.32.0.15</text></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" data-link-type="dependency" id="lnk8"><polygon fill="#475569" points="397.1735,342.0319,403.9035,334.8412,398.813,337.3083,396.3459,332.2178,397.1735,342.0319" style="stroke:#475569;stroke-width:1;"/><path d="M422.5744,268.853 C414.8834,291.0104 406.1477,316.1774 399.1409,336.3636" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="31.3359" x="422" y="303.9541">writes</text></g><g class="link" data-entity-1="ent0011" data-entity-2="ent0012" data-link-type="dependency" id="lnk14"><polygon fill="#475569" points="151.5646,342.0319,158.9748,335.5442,153.6646,337.4943,151.7146,332.1842,151.5646,342.0319" style="stroke:#475569;stroke-width:1;"/><path d="M185.4325,268.853 C175.1778,291.0104 163.427,316.4005 154.0847,336.5867" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="31.3359" x="183" y="303.9541">writes</text></g><g class="link" data-entity-1="ent0011" data-entity-2="ent0016" data-link-type="dependency" id="lnk18"><polygon fill="#475569" points="254.3553,265.5686,261.7994,272.0173,259.1384,267.0254,264.1303,264.3643,254.3553,265.5686" style="stroke:#475569;stroke-width:1;"/><path d="M260.095,267.3167 C263.9957,268.5048 262.1618,267.8189 266,268.6982 C373.7214,293.3769 405.9708,263.4036 514,286.6982 C545.4765,293.4856 551.7487,300.6665 582,311.6982 C597.8963,317.4952 614.8103,323.6362 631.2004,329.573" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="60.7031" x="588" y="303.9541">watch