<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="319px" preserveAspectRatio="none" style="width:911px;height:319px;background:#FFFFFF;" version="1.1" viewBox="0 0 911 319" width="911px" zoomAndPan="magnify"><title>Inside the house a first name is enough; from next door, add the house</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="608.0713" x="147.5972" y="30.8838">Inside the house a first name is enough; from next door, add the house</text></g><!--cluster def--><g class="cluster" data-qualified-name="def" data-source-line="4" id="ent0002"><rect fill="#F8FAFC" height="207.5" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="166" x="256.6328" y="60.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="117.0444" x="281.1106" y="78.3921">namespace default</text></g><!--cluster dev--><g class="cluster" data-qualified-name="dev" data-source-line="10" id="ent0006"><rect fill="#F8FAFC" height="97" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="190" x="479.6328" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="96.8335" x="526.2161" y="71.8921">namespace dev</text></g><!--entity web--><g class="entity" data-qualified-name="def.web" data-source-line="5" id="ent0003"><rect fill="#326CE5" height="42.9487" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="81.4473" x="299.1328" y="93.1982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="53.4473" x="313.1328" y="119.3921">web Pod</text></g><!--entity dbd--><g class="entity" data-qualified-name="def.dbd" data-source-line="6" id="ent0004"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="148.5864" x="265.1328" y="203.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="118.5171" x="279.1328" y="229.8921">Service  db-service</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="120.5864" x="279.1328" y="242.9648">default's own database</text></g><!--entity dbv--><g class="entity" data-qualified-name="dev.dbv" data-source-line="11" id="ent0007"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="173.4868" x="488.1328" y="86.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="118.5171" x="502.1328" y="112.8921">Service  db-service</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="145.4868" x="502.1328" y="125.9648">same name, different object</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" id="lnk5"><polygon fill="#475569" points="339.6328,203.397,343.6328,194.397,339.6328,198.397,335.6328,194.397,339.6328,203.397" style="stroke:#475569;stroke-width:1;"/><path d="M339.6328,136.2579 C339.6328,154.9936 339.6328,176.8032 339.6328,197.397" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="55.3535" x="345.6328" y="177.9541">db-service</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0007" data-link-type="dependency" id="lnk8"><polygon fill="#475569" points="487.7645,114.6982,478.7645,110.6982,482.7645,114.6982,478.7645,118.6982,487.7645,114.6982" style="stroke:#475569;stroke-width:1;"/><path d="M380.2984,114.6982 C409.856,114.6982 444.965,114.6982 481.7645,114.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="78.0352" x="395.1328" y="103.9541">db-service.dev</text></g><g class="caption" data-source-line="16"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="749.6973" x="76.7842" y="287.8301">The same short name means different things in different namespaces: it always looks in the caller's own namespace first.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="893.2656" x="5" y="303.9287">The names resolve across namespaces because cluster DNS is cluster-wide; by default the traffic is allowed too. Only a NetworkPolicy blocks it.</text></g><?plantuml-src VPAnRjmm38PtFmMRfKlEHjQBuQbBbpH0CdQX9TfMJnOFecpdMlJTIzbkSscH0XvaYkJ_aVe_k63yP0dAijg-nEobiWxxYADKveI7DD18vNaQVP5SyWIVWpYjqJWCF0a1GkUY90Wu4ZW12ZprmprqaKS8z9B0CiTRG6jVgueYaaaOUkruaolbZ8R0KeUJJpTGrttawTmqW9AZyAC0k2fPg8L7jZaHZQ6GjamDlyrxeZWxRGosFSXs_XfgST_fU7VNx78V1NW9O35XYq9rbU-R5OBPxWojrSvPzc0r-T3a21ol-XO_tnrg_cUW-U-1_WygURUvuorOrtKKTMBWzflMlqCxPvmLDxf-I2ll_8QtL8gYC7XEZWFKhddMnrc5PE2ul-T86EHACmqkz08kNCN-J2f7S0dGBtWHyCodDJ6_kK7lAUvxVjtCQfoohboZisu0wwKkHjZFwYqJMUHA0Leoc5sdpfL44JuzF6NJxR-7HRrv3-tbjvDMzHInwvp9USh12waHcKlu4ln5xVj0QU5uUcJlp0LQpoQ3Rro_0000?></g></svg>