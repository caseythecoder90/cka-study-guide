<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="565px" preserveAspectRatio="none" style="width:773px;height:565px;background:#FFFFFF;" version="1.1" viewBox="0 0 773 565" width="773px" zoomAndPan="magnify"><title>The harbor: control ships run the fleet, cargo ships carry the containers</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="614.127" x="71.9365" y="30.8838">The harbor: control ships run the fleet, cargo ships carry the containers</text></g><!--cluster ctrl--><g class="cluster" data-qualified-name="ctrl" data-source-line="4" id="ent0002"><rect fill="#F8FAFC" height="453.5" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="274" x="14" y="60.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="214.8682" x="43.5659" y="78.3921">Control ship  =  control plane node</text></g><!--cluster ship1--><g class="cluster" data-qualified-name="ship1" data-source-line="14" id="ent0010"><rect fill="#F8FAFC" height="447.5" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="272" x="296" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="167.229" x="348.3855" y="71.8921">Cargo ship  =  worker node</text></g><!--cluster ship2--><g class="cluster" data-qualified-name="ship2" data-source-line="24" id="ent0018"><rect fill="#F8FAFC" height="428.5" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="191" x="576" y="66.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="167.229" x="587.8855" y="84.3921">Cargo ship  =  worker node</text></g><!--entity bridge--><g class="entity" data-qualified-name="ctrl.bridge" data-source-line="5" id="ent0003"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="220.5967" x="57.5" y="93.1982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="148.7891" x="71.5" y="119.3921">Communications bridge</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="192.5967" x="71.5" y="132.4648">every message in or out passes here</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="87.7422" x="71.5" y="145.1138">= kube-apiserver</text></g><!--entity ledger--><g class="entity" data-qualified-name="ctrl.ledger" data-source-line="6" id="ent0004"><rect fill="#EFF6FF" height="68.2466" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="257.1899" x="22.5" y="203.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="81.1104" x="36.5" y="229.8921">Ship's ledger</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="229.1899" x="36.5" y="242.9648">which container is on which ship, and when</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="32.0977" x="36.5" y="255.6138">= etcd</text></g><!--entity crane--><g class="entity" data-qualified-name="ctrl.crane" data-source-line="7" id="ent0005"><rect fill="#EFF6FF" height="80.8955" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="236.3877" x="33" y="307.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="87.4136" x="47" y="333.8921">Crane planner</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="193.7837" x="47" y="346.9648">picks the right ship by size, capacity,</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="208.3877" x="47" y="359.6138">destination &#183; does not lift anything itself</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="90.7822" x="47" y="372.2627">= kube-scheduler</text></g><!--entity offices--><g class="entity" data-qualified-name="ctrl.offices" data-source-line="8" id="ent0006"><rect fill="#EFF6FF" height="80.8955" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="249.896" x="26" y="424.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="44.0718" x="40" y="450.8921">Offices</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="221.896" x="40" y="463.9648">ops, cargo, damage control: each watches</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="181.5054" x="40" y="476.6138">one thing and fixes it when it drifts</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="211.7983" x="40" y="489.2627">= controllers in kube-controller-manager</text></g><!--entity cap1--><g class="entity" data-qualified-name="ship1.cap1" data-source-line="15" id="ent0011"><rect fill="#DCFCE7" height="80.8955" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="221.7729" x="338" y="86.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="47.6709" x="352" y="112.8921">Captain</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="193.7729" x="352" y="125.9648">takes orders from the bridge, has the</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="166.2729" x="352" y="138.6138">containers loaded, reports back</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="47.9907" x="352" y="151.2627">= kubelet</text></g><!--entity crew1--><g class="entity" data-qualified-name="ship1.crew1" data-source-line="16" id="ent0012"><rect fill="#EFF6FF" height="68.2466" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="196.9961" x="344.5" y="203.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="83.7891" x="358.5" y="229.8921">Loading crew</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="152.8184" x="358.5" y="242.9648">physically loads and unloads</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="168.9961" x="358.5" y="255.6138">= container runtime (containerd)</text></g><!--entity radio1--><g class="entity" data-qualified-name="ship1.radio1" data-source-line="17" id="ent0013"><rect fill="#EFF6FF" height="68.2466" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="245.0083" x="314.5" y="314.1982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="153.8418" x="328.5" y="340.3921">Radio and routing charts</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="217.0083" x="328.5" y="353.4648">so cargo on any ship can reach any other</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="68.7715" x="328.5" y="366.1138">= kube-proxy</text></g><!--entity cargo1--><g class="entity" data-qualified-name="ship1.cargo1" data-source-line="18" id="ent0014"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="120.0283" x="377" y="437.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="62.8672" x="391" y="463.3921">Containers</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="92.0283" x="391" y="476.4648">= your applications</text></g><!--entity cap2--><g class="entity" data-qualified-name="ship2.cap2" data-source-line="25" id="ent0019"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="75.9907" x="641" y="99.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="47.6709" x="655" y="125.3921">Captain</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="47.9907" x="655" y="138.4648">= kubelet</text></g><!--entity crew2--><g class="entity" data-qualified-name="ship2.crew2" data-source-line="26" id="ent0020"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="111.7891" x="623" y="209.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="83.7891" x="637" y="235.8921">Loading crew</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="65.71" x="637" y="248.9648">= containerd</text></g><!--entity radio2--><g class="entity" data-qualified-name="ship2.radio2" data-source-line="27" id="ent0021"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="96.7715" x="630.5" y="320.1982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="36.1118" x="644.5" y="346.3921">Radio</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="68.7715" x="644.5" y="359.4648">= kube-proxy</text></g><!--entity cargo2--><g class="entity" data-qualified-name="ship2.cargo2" data-source-line="28" id="ent0022"><rect fill="#FFFFFF" height="42.9487" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="90.8672" x="633.5" y="443.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="62.8672" x="647.5" y="469.8921">Containers</text></g><g class="caption" data-source-line="36"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="568.0732" x="94.9634" y="533.8301">Orders go out from the bridge to each captain, and status reports come back the same way.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="690.3203" x="33.8398" y="549.9287">Nobody on the control ship talks to a captain except through the bridge, and only the bridge writes in the ledger.</text></g><?plantuml-src fLR1ZjCm4BttAuQz05AxLNDSTNlXYbW9k047rvucLXrFP3jq0-AxkFDbZEscJTfKYuHKAQd7cNb-xyqahxILfbK8z_VB_0j4nY-L5gKJjL_AlLY42ckyRzhQp88E1k5pXL09joNt099iS6J0Lxhnu5eBl1rs1Z7CGGfNqZ74zwvBmVY8q1QTdyqSoY1i