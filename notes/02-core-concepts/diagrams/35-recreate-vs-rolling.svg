<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="378px" preserveAspectRatio="none" style="width:714px;height:378px;background:#FFFFFF;" version="1.1" viewBox="0 0 714 378" width="714px" zoomAndPan="magnify"><title>Two update strategies</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="190.0371" x="254.4814" y="30.8838">Two update strategies</text></g><!--cluster rec--><g class="cluster" data-qualified-name="rec" data-source-line="4" id="ent0002"><rect fill="#FEF2F2" height="319" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="280" x="14" y="53.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="54.9263" x="126.5369" y="71.8921">Recreate</text></g><!--cluster roll--><g class="cluster" data-qualified-name="roll" data-source-line="14" id="ent0010"><rect fill="#F0FDF4" height="319" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="406" x="302" y="53.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="146.5991" x="431.7004" y="71.8921">RollingUpdate  (default)</text></g><!--entity r1--><g class="entity" data-qualified-name="rec.r1" data-source-line="5" id="ent0003"><rect fill="#FEE2E2" height="42.9487" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="210.7681" x="65.5" y="86.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="182.7681" x="79.5" y="112.8921">1  All old Pods are terminated</text></g><!--entity r2--><g class="entity" data-qualified-name="rec.r2" data-source-line="6" id="ent0004"><rect fill="#FEE2E2" height="42.9487" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="165.23" x="83.5" y="165.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="137.23" x="97.5" y="191.8921">2  Application is down</text></g><!--entity r3--><g class="entity" data-qualified-name="rec.r3" data-source-line="7" id="ent0005"><rect fill="#EFF6FF" height="42.9487" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="196.3462" x="60" y="244.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="168.3462" x="74" y="270.8921">3  All new Pods are created</text></g><!--entity rl--><g class="entity" data-qualified-name="rec.rl" data-source-line="8" id="ent0006"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="236.0005" x="36" y="348.0161">Use when two versions must never run together.</text></g><!--entity o1--><g class="entity" data-qualified-name="roll.o1" data-source-line="15" id="ent0011"><rect fill="#DCFCE7" height="42.9487" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="273.6543" x="368" y="86.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="245.6543" x="382" y="112.8921">1  New ReplicaSet scales up a few Pods</text></g><!--entity o2--><g class="entity" data-qualified-name="roll.o2" data-source-line="16" id="ent0012"><rect fill="#DCFCE7" height="42.9487" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="388.5278" x="310.5" y="165.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="360.5278" x="324.5" y="191.8921">2  Old ReplicaSet scales down as new Pods become ready</text></g><!--entity o3--><g class="entity" data-qualified-name="roll.o3" data-source-line="17" id="ent0013"><rect fill="#DCFCE7" height="42.9487" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="229.5635" x="390" y="244.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="201.5635" x="404" y="270.8921">3  Repeats until all Pods are new</text></g><!--entity ol--><g class="entity" data-qualified-name="roll.ol" data-source-line="18" id="ent0014"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="316.1211" x="347" y="348.0161">Old and new versions run together briefly. No planned downtime.</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" id="lnk7"><polygon fill="#475569" points="167.3436,165.5067,171.9184,156.7848,167.6676,160.5172,163.9352,156.2664,167.3436,165.5067" style="stroke:#475569;stroke-width:1;"/><path d="M169.6601,129.8328 C168.9427,140.8806 168.4503,148.4629 167.7324,159.5193" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" id="lnk8"><polygon fill="#475569" points="160.1498,244.5067,165.0584,235.9682,160.6665,239.5335,157.1012,235.1415,160.1498,244.5067" style="stroke:#475569;stroke-width:1;"/><path d="M163.8561,208.8328 C162.7083,219.8806 161.9185,227.4824 160.7698,238.5388" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0011" data-entity-2="ent0012" data-link-type="dependency" id="lnk15"><polygon fill="#475569" points="505,165.5067,509,156.5067,505,160.5067,501,156.5067,505,165.5067" style="stroke:#475569;stroke-width:1;"/><path d="M505,129.8328 C505,140.8806 505,148.4503 505,159.5067" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0012" data-entity-2="ent0013" data-link-type="dependency" id="lnk16"><polygon fill="#475569" poi