<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="569px" preserveAspectRatio="none" style="width:1022px;height:569px;background:#FFFFFF;" version="1.1" viewBox="0 0 1022 569" width="1022px" zoomAndPan="magnify"><title>The kubelet: the captain, and the ship's only contact with the control plane</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="638.3496" x="188.1846" y="30.8838">The kubelet: the captain, and the ship's only contact with the control plane</text></g><!--cluster node--><g class="cluster" data-qualified-name="node" data-source-line="6" id="ent0003"><rect fill="#F8FAFC" height="386" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="795" x="121.3594" y="147.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="79.4536" x="479.1326" y="165.8921">Worker node</text></g><!--entity api--><g class="entity" data-qualified-name="api" data-source-line="4" id="ent0002"><rect fill="#326CE5" height="42.9487" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="120.4917" x="445.3594" y="53.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="92.4917" x="459.3594" y="79.8921">kube-apiserver</text></g><!--entity kubelet--><g class="entity" data-qualified-name="node.kubelet" data-source-line="7" id="ent0004"><rect fill="#DCFCE7" height="42.9487" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="238.2788" x="386.3594" y="180.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="210.2788" x="400.3594" y="206.8921">kubelet  (systemd service, :10250)</text></g><!--entity reg--><g class="entity" data-qualified-name="node.reg" data-source-line="8" id="ent0005"><rect fill="#EFF6FF" height="68.2466" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="222.9868" x="129.8594" y="260.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="120.6372" x="143.8594" y="286.8921">1 Register the node</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="194.9868" x="143.8594" y="299.9648">creates the Node object on first start;</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="141.8613" x="143.8594" y="312.6138">labels, capacity, addresses</text></g><!--entity create--><g class="entity" data-qualified-name="node.create" data-source-line="9" id="ent0006"><rect fill="#EFF6FF" height="68.2466" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="269.1567" x="370.8594" y="260.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="86.7026" x="384.8594" y="286.8921">2 Create Pods</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="175.3931" x="384.8594" y="299.9648">watches Pods bound to this node</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="241.1567" x="384.8594" y="312.6138">(+ static Pods from /etc/kubernetes/manifests)</text></g><!--entity mon--><g class="entity" data-qualified-name="node.mon" data-source-line="10" id="ent0007"><rect fill="#EFF6FF" height="68.2466" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="249.8638" x="658.3594" y="260.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="126.3882" x="672.3594" y="286.8921">3 Monitor and report</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="221.8638" x="672.3594" y="299.9648">container states, probes, node conditions;</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="173.0298" x="672.3594" y="312.6138">heartbeat Lease about every 10 s</text></g><!--entity ctrd--><g class="entity" data-qualified-name="node.ctrd" data-source-line="11" id="ent0008"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="164.9146" x="422.8594" y="389.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="66.4536" x="436.8594" y="415.8921">containerd</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="136.9146" x="436.8594" y="428.9648">pull image, run containers</text></g><!--entity pods--><g class="entity" data-qualified-name="node.pods" data-source-line="12" id="ent0009"><rect fill="#FFFFFF" height="42.9487" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="57.6309" x="476.3594" y="482.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="29.6309" x="490.3594" y="508.8921">Pods</text></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" id="lnk10"><polygon fill="#475569" points="337.7871,260.6425,347.5979,261.5079,342.517,259.0211,345.0037,253.9402,337.7871,260.6425" style="stroke:#475569;stroke-width:1;"/><path d="M445.4537,223.7341 C413.6583,234.6336 379.4885,246.3472 343.4629,258.6968" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" data-link-type="dependency" id="lnk11"><polygon fill="#475569" points="505.3594,260.4652,509.3594,251.4652,505.3594,255.4652,501.3594,251.4652,505.3594,260.4652" style="stroke:#475569;stroke-width:1;"/><path d="M505.3594,223.7341 C505.3594,234.5815 505.3594,242.1622 505.3594,254.4652" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0007" data-link-type="dependency" id="lnk12"><polygon fill="#475569" points="681.818,260.6425,674.4983,254.053,677.0636,259.0948,672.0219,261.6601,681.818,260.6425" style="stroke:#475569;stroke-width:1;"/><path d="M568.4419,223.7341 C601.9234,234.6336 638.1767,246.4355 676.1127,258.7852" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0006" data-entity-2="ent0008" data-link-type="dependency" id="lnk13"><polygon fill="#475569" points="505.3594,389.3926,509.3594,380.3926,505.3594,384.3926,501.3594,380.3926,505.3594,389.3926" style="stroke:#475569;stroke-width:1;"/><path d="M505.3594,328.762 C505.3594,347.7945 505.3594,365.4229 505.3594,383.3926" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="20.666" x="511.3594" y="363.9541">CRI</text></g><g class="link" data-entity-1="ent0008" data-entity-2="ent0009" data-link-type="dependency" id="lnk14"><polygon fill="#475569" points="505.3594,482.4816,509.3594,473.4816,505.3594,477.4816,501.3594,473.4816,505.3594,482.4816" style="stroke:#475569;stroke-width:1;"/><path d="M505.3594,445.8997 C505.3594,457.7683 505.3594,465.4593 505.3594,476.4816" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" id="lnk16"><polygon fill="#475569" points="445.0984,96.8262,435.4114,98.604