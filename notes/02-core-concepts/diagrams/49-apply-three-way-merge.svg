<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="295px" preserveAspectRatio="none" style="width:841px;height:295px;background:#FFFFFF;" version="1.1" viewBox="0 0 841 295" width="841px" zoomAndPan="magnify"><title>kubectl apply compares three versions of the object</title><defs/><g><g class="title" data-source-line="3"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="445.1309" x="194.9346" y="30.8838">kubectl apply compares three versions of the object</text></g><!--entity file--><g class="entity" data-qualified-name="file" data-source-line="5" id="ent0002"><rect fill="#326CE5" height="55.5977" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="128.8315" x="63" y="147.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="56.3481" x="77" y="173.8921">Local file</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="100.8315" x="77" y="186.9648">what you want now</text></g><!--entity last--><g class="entity" data-qualified-name="last" data-source-line="6" id="ent0003"><rect fill="#EFF6FF" height="68.2466" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="242.5376" x="6" y="221.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="159.6118" x="20" y="247.8921">last-applied-configuration</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="149.1177" x="20" y="260.9648">annotation on the live object</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="214.5376" x="20" y="273.6138">a copy of the file from the previous apply</text></g><!--entity live--><g class="entity" data-qualified-name="live" data-source-line="7" id="ent0004"><rect fill="#EFF6FF" height="68.2466" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="160.6338" x="47" y="61.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="67.9072" x="61" y="87.8921">Live object</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="132.6338" x="61" y="100.9648">your fields, plus defaults,</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="124.6953" x="61" y="113.6138">other writers and status</text></g><!--entity set--><g class="entity" data-qualified-name="set" data-source-line="9" id="ent0005"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="197.9092" x="403.5" y="150.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="20.23" x="417.5" y="176.8921">Set</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="169.9092" x="417.5" y="189.9648">in the file, and different from live</text></g><!--entity del--><g class="entity" data-qualified-name="del" data-source-line="10" id="ent0006"><rect fill="#FEE2E2" height="55.5977" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="220.5054" x="392" y="225.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="39.019" x="406" y="251.8921">Delete</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="192.5054" x="406" y="264.9648">in last-applied, but gone from the file</text></g><!--entity keep--><g class="entity" data-qualified-name="keep" data-source-line="11" id="ent0007"><rect fill="#F1F5F9" height="68.2466" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="196.7544" x="404" y="61.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="30.3608" x="418" y="87.8921">Keep</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="168.7544" x="418" y="100.9648">only in live: defaults, kubectl scale,</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="126.5698" x="418" y="113.6138">an autoscaler, a controller</text></g><!--entity patch--><g class="entity" data-qualified-name="patch" data-source-line="13" id="ent0008"><rect fill="#FFFFFF" height="68.2466" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="185.5425" x="650" y="176.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="157.5425" x="664" y="202.8921">One patch to the live object</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="147.3721" x="664" y="215.9648">and the annotation is rewritten</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="124.1367" x="664" y="228.6138">to the file you just applied</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" data-link-type="dependency" id="lnk9"><polygon fill="#475569" points="403.342,177.9088,394.3744,173.8365,398.3421,177.8686,394.3101,181.8363,403.342,177.9088" style="stroke:#475569;stroke-width:1;"/><path d="M192.1972,176.2106 C250.1454,176.6766 330.568,177.3235 397.3422,177.8605" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="52.0137" x="294.5" y="169.9541">file vs live</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0006" data-link-type="dependency" id="lnk10"><polygon fill="#475569" points="391.7412,254.2868,382.7199,250.3351,386.7413,254.3136,382.7628,258.335,391.7412,254.2868" style="stroke:#475569;stroke-width:1;"/><path d="M249.0873,255.0517 C294.9557,254.8057 340.9286,254.5592 385.7413,254.3189" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="95.3789" x="273" y="245.9541">last-applied vs file</text></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0007" data-link-type="dependency" id="lnk11"><polygon fill="#475569" points="403.8151,95.6982,394.8151,91.6982,398.8151,95.6982,394.8151,99.6982,403.8151,95.6982" style="stroke:#475569;stroke-width:1;"/><path d="M208.0604,95.6982 C265.2939,95.6982 336.8217,95.6982 397.8151,95.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="49.3652" x="296" y="87.9541">in neither</text></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0008" data-link-type="dependency" id="lnk12"><polygon fill="#475569" points="649.7124,198.3158,641.3242,193.1545,644.7568,197.6509,640.2604,201.0835,649.7124,198.3158" style="stroke:#475569;stroke-width:1;"/><path d="M601.5396,191.8524 C617.471,193.99 627.9777,195.3996 643.7656,197.518" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0006" data-entity-2="ent0008" data-link-type="dependency" id="lnk13"><polygon fill="#475569" points="649.883,227.3063,640.3161,224.9667,644.9623,228.1935,641.7355,232.8398,649.883,