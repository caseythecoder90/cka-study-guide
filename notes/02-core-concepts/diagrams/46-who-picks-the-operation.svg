<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="524px" preserveAspectRatio="none" style="width:729px;height:524px;background:#FFFFFF;" version="1.1" viewBox="0 0 729 524" width="729px" zoomAndPan="magnify"><title>The same result, but who has to work out the next step?</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="481.0605" x="120.0854" y="30.8838">The same result, but who has to work out the next step?</text></g><!--cluster imp--><g class="cluster" data-qualified-name="imp" data-source-line="4" id="ent0002"><rect fill="#FEF2F2" height="429" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="370" x="33.1157" y="59.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="211.6563" x="112.2876" y="77.8921">Imperative: you pick the operation</text></g><!--cluster dec--><g class="cluster" data-qualified-name="dec" data-source-line="14" id="ent0010"><rect fill="#F0FDF4" height="331" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="300" x="411.1157" y="53.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="196.5171" x="462.8572" y="71.8921">Declarative: you state the result</text></g><!--entity i0--><g class="entity" data-qualified-name="imp.i0" data-source-line="5" id="ent0003"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="197.7871" x="195.1157" y="92.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="169.7871" x="209.1157" y="118.8921">Does it exist? What is it now?</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="168.1528" x="209.1157" y="131.9648">you have to know the current state</text></g><!--entity i1--><g class="entity" data-qualified-name="imp.i1" data-source-line="6" id="ent0004"><rect fill="#FEE2E2" height="55.5977" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="312.9907" x="79.6157" y="191.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="284.9907" x="93.6157" y="217.8921">kubectl create deployment web --image=nginx</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="138.7622" x="93.6157" y="230.9648">run it again: AlreadyExists</text></g><!--entity i2--><g class="entity" data-qualified-name="imp.i2" data-source-line="7" id="ent0005"><rect fill="#FEE2E2" height="42.9487" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="291.3516" x="75.6157" y="321.1982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="263.3516" x="89.6157" y="347.3921">kubectl scale deployment web --replicas=5</text></g><!--entity i3--><g class="entity" data-qualified-name="imp.i3" data-source-line="8" id="ent0006"><rect fill="#FEE2E2" height="42.9487" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="352.7207" x="41.6157" y="437.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="324.7207" x="55.6157" y="463.8921">kubectl set image deployment web nginx=nginx:1.18</text></g><!--entity d0--><g class="entity" data-qualified-name="dec.d0" data-source-line="15" id="ent0011"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="219.3291" x="453.6157" y="86.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="58.5254" x="467.6157" y="112.8921">web.yaml</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="157.1099" x="467.6157" y="125.9648">replicas: 5 &#183; image: nginx:1.18</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="191.3291" x="467.6157" y="138.6138">the whole desired state, in one place</text></g><!--entity d1--><g class="entity" data-qualified-name="dec.d1" data-source-line="16" id="ent0012"><rect fill="#326CE5" height="42.9487" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="185.4854" x="468.6157" y="198.1982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="157.4854" x="482.6157" y="224.3921">kubectl apply -f web.yaml</text></g><!--entity d2--><g class="entity" data-qualified-name="dec.d2" data-source-line="17" id="ent0013"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="283.4761" x="419.6157" y="308.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="215.2935" x="433.6157" y="334.8921">apply compares file and live object</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="255.4761" x="433.6157" y="347.9648">missing: create &#183; different: patch &#183; same: nothing</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="124.6685" x="433.6157" y="360.6138">run it again: unchanged</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" id="lnk7"><polygon fill="#475569" points="252.3865,191.4868,260.4383,185.8151,254.9524,187.1955,253.5721,181.7096,252.3865,191.4868" style="stroke:#475569;stroke-width:1;"/><path d="M277.9595,148.7182 C269.982,162.0599 263.4586,172.9696 255.4656,186.3372" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" id="lnk8"><polygon fill="#475569" points="223.6777,321.0319,228.7545,312.5923,224.2928,316.0698,220.8153,311.6081,223.6777,321.0319" style="stroke:#475569;stroke-width:1;"/><path d="M232.7494,247.853 C230.0026,270.0104 226.9182,294.8912 224.4158,315.0774" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="80.0449" x="237.1157" y="282.9541">a different verb</text></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" data-link-type="dependency" id="lnk9"><polygon fill="#475569" points="218.655,437.6174,222.8893,428.7253,218.7859,432.6191,214.8921,428.5157,218.655,437.6174" style="stroke:#475569;stroke-width:1;"/><path d="M220.5724,364.4333 C220.0287,385.1846 219.3544,410.9229 218.8121,431.6195" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="89.3848" x="226.1157" y="411.9541">for every change</text></g><g class="link" data-entity-1="ent0011" data-entity-2="ent0012" data-link-type="dependency" id="lnk14"><polygon fill="#475569" points="561.5392,198.1613,565.7238,189.2457,561.6422,193.1624,557.7255,189.0808,561.5392,198.1613" style="stroke:#475569;stroke-width:1;"/><path d="M562.433,154.8088 C562.1365,169.1882 561.9222,179.5823 561.6628,192.1626" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0012" data-entity-2="ent0013" data-link-type="dependency" id="lnk15"><polygon fill="#475569" points="561.1157,308.254,565.1157,299.254,561.1157,303.254,557.1157,299.254,561.1157,308.254" style="stroke:#475569;stroke-width:1;"/><path d="M561.1157,241.2242 C561.1157,259.564 561.1157,280.7742 561.1157,302.254" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="55.3477" x="567.1157" y="282.9541">every time</text></g><g class="caption" data-source-line="24"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="711.2314" x="5" y="508.8301">Either way the API server stores desired state and controllers reconcile it. The difference is on your side of the API.</text></g><?plantuml-src TLJBRjim4BphAxOvHtBi840XE0fI92Xoww503sqFDBcMjgP8WgJig4M_g_T-MPUI7tAQ0BvujJipEplIEp9ITmgXA6RZBrghmqoHgBremqnkH1uRRB5mNQkpI54ZV6uGWcWHF8PEnqjOTH5sZOL618WMTjPlm7AD9y7WSuGGqTrbcKSPXQaPukAfTUX5f2sMqDiE7CdDq6_7kZKNi5pMtdRkWr1L1GnDhODV6S04vi4YroFWCuLu1ryQ4O66Yh6xkszc6UWdblDvbJWQiSMaRyFF1YxPUOycoHCHbxFKMoLQfmMPFUVLEU6cM_4V3T8Zpu12fstV9f0ThY3FgHKrtfgQpFE4tNScQH8ruvPmhtbOzOz9SvZGhewBpbyd3LBeLpWz5qYAS7jpZh9u0mNPeoJp9TAWUjHUpelv-tEqQqQZAyYLtPcy6ZNI_FH_0IK8KBHUus3g5lqgjInEBTVSihOUa9_r81iMXjdlirmyeDHY6epXDiErnhGTO_7HshqqXV9bBdYTeXUjdjvWxr89D_3tp-X02QTjzuUOJ2HIZlLWUI2FQXHp2MJ06WIEYPp6fZufUYCrmZdTGxw6Wxuq9gHal_Q3Bou_3aZREi7hmvguA8m2pVw0NVtWpedWba8WKvU7TFAQntkKu4IKJQgbTvStjx7Xvl_NFWzhPyOxgTSNJHbJfrGC-jKf5IgbOZntf7OuTdgBywyDAONckwUwYQaFPPP9uTAB3qkg7edDzx0J_N3w-qzF75lFE7m2cvmukyXWYRGcUgir-f0Sj4OcioWMm_Vgu8F4z7rW4iuMWn5_--pwm54iPrJz0m00?></g></svg>