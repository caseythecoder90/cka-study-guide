<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="671px" preserveAspectRatio="none" style="width:933px;height:671px;background:#FFFFFF;" version="1.1" viewBox="0 0 933 671" width="933px" zoomAndPan="magnify"><title>A Kubernetes cluster: every component talks to the API server, and only the API server talks to etcd</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="855.2725" x="32.603" y="30.8838">A Kubernetes cluster: every component talks to the API server, and only the API server talks to etcd</text></g><!--cluster cp--><g class="cluster" data-qualified-name="cp" data-source-line="6" id="ent0003"><rect fill="#F8FAFC" height="278" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="542" x="50.7393" y="136.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="118.4409" x="262.5188" y="154.8921">Control plane node</text></g><!--cluster w1--><g class="cluster" data-qualified-name="w1" data-source-line="14" id="ent0009"><rect fill="#F8FAFC" height="324" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="292" x="600.7393" y="311.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="79.4536" x="707.0125" y="329.8921">Worker node</text></g><!--entity users--><g class="entity" data-qualified-name="users" data-source-line="4" id="ent0002"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="184.7681" x="381.2393" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="156.7681" x="395.2393" y="79.8921">kubectl &#183; client libraries &#183; CI</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="111.2622" x="395.2393" y="92.9648">HTTPS REST to :6443</text></g><!--entity api--><g class="entity" data-qualified-name="cp.api" data-source-line="7" id="ent0004"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="221.73" x="362.7393" y="174.1982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="132.9644" x="376.7393" y="200.3921">kube-apiserver  :6443</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="193.73" x="376.7393" y="213.4648">authn &#183; authz &#183; admission &#183; validation</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="150.9814" x="376.7393" y="226.1138">the only reader/writer of etcd</text></g><!--entity etcd--><g class="entity" data-qualified-name="cp.etcd" data-source-line="8" id="ent0005"><path d="M231.2393,179.6982 C231.2393,169.6982 287.8643,169.6982 287.8643,169.6982 C287.8643,169.6982 344.4893,169.6982 344.4893,179.6982 L344.4893,236.9448 C344.4893,246.9448 287.8643,246.9448 287.8643,246.9448 C287.8643,246.9448 231.2393,246.9448 231.2393,236.9448 L231.2393,179.6982" fill="#F1F5F9" style="stroke:#64748B;stroke-width:1.5;"/><path d="M231.2393,179.6982 C231.2393,189.6982 287.8643,189.6982 287.8643,189.6982 C287.8643,189.6982 344.4893,189.6982 344.4893,179.6982" fill="none" style="stroke:#64748B;stroke-width:1.5;"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="64.3271" x="245.2393" y="209.8921">etcd  :2379</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="77.6445" x="245.2393" y="222.9648">key-value store,</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="85.25" x="245.2393" y="235.6138">the cluster's state</text></g><!--entity sched--><g class="entity" data-qualified-name="cp.sched" data-source-line="9" id="ent0006"><rect fill="#EFF6FF" height="68.2466" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="175.2915" x="186.2393" y="338.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="96.0845" x="200.2393" y="364.8921">kube-scheduler</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="147.2915" x="200.2393" y="377.9648">watches Pods with no node,</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="118.583" x="200.2393" y="390.6138">writes the node choice</text></g><!--entity cm--><g class="entity" data-qualified-name="cp.cm" data-source-line="10" id="ent0007"><rect fill="#EFF6FF" height="68.2466" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="199.1338" x="379.2393" y="338.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="153.1436" x="393.2393" y="364.8921">kube-controller-manager</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="161.9814" x="393.2393" y="377.9648">Node, ReplicaSet, Deployment,</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="171.1338" x="393.2393" y="390.6138">Job, EndpointSlice ... controllers</text></g><!--entity cpk--><g class="entity" data-qualified-name="cp.cpk" data-source-line="11" id="ent0008"><rect fill="#F1F5F9" height="68.2466" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="153.9629" x="58.7393" y="174.1982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="117.4443" x="72.7393" y="200.3921">kubelet + containerd</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="125.9629" x="72.7393" y="213.4648">run the control plane itself</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="124.1099" x="72.7393" y="226.1138">as static Pods (kubeadm)</text></g><!--entity kubelet--><g class="entity" data-qualified-name="w1.kubelet" data-source-line="15" id="ent0010"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="169.8345" x="608.7393" y="344.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="93.2153" x="622.7393" y="370.8921">kubelet  :10250</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="141.8345" x="622.7393" y="383.9648">systemd service, not a Pod</text></g><!--entity ctrd--><g class="entity" data-qualified-name="w1.ctrd" data-source-line="16" id="ent0011"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="145.9868" x="608.7393" y="467.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="66.4536" x="622.7393" y="493.8921">containerd</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="117.9868" x="622.7393" y="506.9648">CRI over a unix socket</text></g><!--entity kp--><g class="entity" data-qualified-name="w1.kp" data-source-line="17" id="ent0012"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="112.3477" x="772.7393" y="467.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="70.0718" x="786.7393" y="493.8921">kube-proxy</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="84.3477" x="786.7393" y="506.9648">DaemonSet Pod</text></g><!--entity pods--><g class="entity" data-qualified-name="w1.pods" data-source-line="18" id="ent0013"><rect fill="#FFFFFF" height="42.9487" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="57.6309" x="710.7393" y="584.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="29.6309" x="724.7393" y="610.8921">Pods</text></g><g class="link" data-entity-1="ent0010" data-entity-2="ent0011" data-link-type="dependency" id="lnk14"><polygon fill="#475569" points="684.4233,467.6341,689.292,459.0728,684.9168,462.6585,681.331,458.2833,684.4233,467.6341" style="stroke:#475569;stroke-width:1;"/><path d="M691.0462,400.853 C689.0699,420.7807 686.9896,441.757 685.0154,461.6634" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="64.002" x="694.7393" y="441.9541">CRI (gRPC)</text></g><g class="link" data-entity-1="ent0011" data-entity-2="ent0013" data-link-type="dependency" id="lnk15"><polygon fill="#475569" points="728.7137,584.5728,727.9984,574.75,726.3565,580.1633,720.9432,578.5214,728.7137,584.5728" style="stroke:#475569;stroke-width:1;"/><path d="M696.2255,523.7975 C706.2914,542.6277 716.672,562.0466 725.8851,579.2814" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="66.0293" x="722.7393" y="558.9541">runc creates</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" id="lnk17"><polygon fill="#475569" points="473.7393,174.0287,477.7393,165.0287,473.7393,169.0287,469.7393,165.0287,473.7393,174.0287" style="stroke:#475569;stroke-width:1;"/><path d="M473.7393,109.7129 C473.7393,128.5932 473.7393,147.9216 473.7393,168.0287" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0004" data-link-type="dependency" id="lnk19"><polygon fill="#475569" points="344.4111,208.1982,353.4111,212.1982,349.4111,208.1982,353.4111,204.1982,344.4111,208.1982" style="stroke:#475569;stroke-width:1;"/><path d="M350.4111,208.1982 C356.4734,208.1982 356.5356,208.1982 362.5979,208.1982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" data-link-type="dependency" id="lnk21"><polygon fill="#475569" points="419.7172,242.4796,410.0122,244.1565,415.5606,245.2586,414.4585,250.807,419.7172,242.4796" style="stroke:#475569;stroke-width:1;"/><path d="M414.7293,245.8144 C404.2258,252.8368 398.4556,257.0963 388.7393,264.6982 C359.5289,287.552 328.8985,316.3219 306.6008,338.2721" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="64.0371" x="394.7393" y="288.9541">watch / bind</text></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0007" data-link-type="dependency" id="lnk23"><polygon fill="#475569" points="470.2639,242.3282,465.5051,250.951,469.8341,247.3097,473.4755,251.6387,470.2639,242.3282" style="stroke:#475569;stroke-width:1;"/><path d="M469.7482,248.306 C469.1134,255.6626 469.0651,257.4497 468.7393,264.6982 C467.9608,282.0141 467.4749,286.4111 468.7393,303.6982 C469.5748,315.123 471.19,327.5416 472.882