<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="966px" preserveAspectRatio="none" style="width:761px;height:966px;background:#FFFFFF;" version="1.1" viewBox="0 0 761 966" width="761px" zoomAndPan="magnify"><title>From a kubelet request to a running process</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="381.0762" x="186.4565" y="30.8838">From a kubelet request to a running process</text></g><!--cluster ctrd--><g class="cluster" data-qualified-name="ctrd" data-source-line="6" id="ent0003"><rect fill="#F8FAFC" height="283" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="290" x="240.9946" y="169.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="251.3608" x="260.3142" y="187.8921">containerd  (daemon, high-level runtime)</text></g><!--entity kubelet--><g class="entity" data-qualified-name="kubelet" data-source-line="4" id="ent0002"><rect fill="#326CE5" height="42.9487" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="73.5127" x="348.9946" y="61.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="45.5127" x="362.9946" y="87.8921">kubelet</text></g><!--entity shim--><g class="entity" data-qualified-name="shim" data-source-line="14" id="ent0009"><rect fill="#DCFCE7" height="80.8955" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="221.1284" x="275.4946" y="505.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="152.4136" x="289.4946" y="531.8921">containerd-shim-runc-v2</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="145.46" x="289.4946" y="544.9648">one per Pod, stays running:</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="193.1284" x="289.4946" y="557.6138">parent of the containers, holds stdio,</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="94.7568" x="289.4946" y="570.2627">reports exit codes</text></g><!--entity runc--><g class="entity" data-qualified-name="runc" data-source-line="15" id="ent0010"><rect fill="#EFF6FF" height="80.8955" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="295.4912" x="238.4946" y="647.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="176.9663" x="252.4946" y="673.8921">runc  (low-level OCI runtime)</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="226.4292" x="252.4946" y="686.9648">reads the OCI bundle (config.json + rootfs),</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="267.4912" x="252.4946" y="699.6138">creates namespaces + cgroups, starts the process,</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="168.6846" x="252.4946" y="712.2627">then EXITS &#8212; it is not a daemon</text></g><!--entity proc--><g class="entity" data-qualified-name="proc" data-source-line="16" id="ent0011"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="200.4229" x="285.9946" y="789.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="105.498" x="299.9946" y="815.8921">Container process</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="172.4229" x="299.9946" y="828.9648">e.g. nginx, PID 1 in its namespaces</text></g><!--entity kernel--><g class="entity" data-qualified-name="kernel" data-source-line="17" id="ent0012"><rect fill="#F1F5F9" height="55.5977" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="257.2651" x="257.4946" y="882.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="70.0972" x="271.4946" y="908.8921">Linux kernel</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="229.2651" x="271.4946" y="921.9648">namespaces &#183; cgroups &#183; seccomp &#183; capabilities</text></g><!--entity cri--><g class="entity" data-qualified-name="ctrd.cri" data-source-line="7" id="ent0004"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="237.666" x="266.9946" y="202.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="64.9873" x="280.9946" y="228.8921">CRI plugin</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="209.666" x="280.9946" y="241.9648">Pod sandboxes, containers, image pulls</text></g><!--entity img--><g class="entity" data-qualified-name="ctrd.img" data-source-line="8" id="ent0005"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="274.3613" x="248.9946" y="295.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="215.9917" x="262.9946" y="321.8921">Images, content store, snapshotter</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="246.3613" x="262.9946" y="334.9648">pull, unpack layers, prepare the root filesystem</text></g><!--entity task--><g class="entity" data-qualified-name="ctrd.task" data-source-line="9" id="ent0006"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="152.7222" x="309.4946" y="388.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="78.0635" x="323.4946" y="414.8921">Task service</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="124.7222" x="323.4946" y="427.9648">start, stop, exec, events</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" id="lnk13"><polygon fill="#475569" points="385.9946,202.5767,389.9946,193.5767,385.9946,197.5767,381.9946,193.5767,385.9946,202.5767" style="stroke:#475569;stroke-width:1;"/><path d="M385.9946,104.7362 C385.9946,130.3516 385.9946,168.2195 385.9946,196.5767" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="47.3438" x="452.0386" y="139.9541">CRI over</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="167.4316" x="391.9946" y="153.7529">/run/containerd/containerd.sock</text></g><g class="link" data-entity-1="ent0006" data-entity-2="ent0009" data-link-type="dependency" id="lnk14"><polygon fill="#475569" points="385.9946,505.6098,389.9946,496.6098,385.9946,500.6098,381.9946,496.6098,385.9946,505.6098" style="stroke:#475569;stroke-width:1;"/><path d="M385.9946,444.7377 C385.9946,462.4276 385.9946,479.8383 385.9946,499.6098" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="52.0078" x="391.9946" y="479.9541">start shim</text></g><g class="link" data-entity-1="ent0009" data-entity-2="ent0010" data-link-type="dependency" id="lnk15"><polygon fill="#475569" points="385.9946,647.355,389.9946,638.355,385.9946,642.355,381.9946,638.355,385.9946,647.355" style="stroke:#475569;stroke-width:1;"/><path d="M385.9946,586.9421 C385.9946,605.8587 385.9946,622.4256 385.9946,641.355" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="93.3691" x="391.9946" y="621.9541">runc create / start</text></g><g class="link" data-entity-1="ent0010" data-entity-2="ent0011" data-link-type="dependency" id="lnk16"><polygon fill="#475569" points="385.9946,789.5978,389.9946,780.5978,385.9946,784.5978,381.9946,780.5978,385.9946,789.5978" style="stroke:#475569;stroke-width:1;"/><path d="M385.9946,728.8411 C385.9946,748.5785 385.9946,765.9314 385.9946,783.5978" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="25.3477" x="391.9946" y="763.9541">exec</text></g><g class="link" data-entity-1="ent0011" data-entity-2="ent0012" data-link-type="dependency" id="lnk17"><polygon fill="#475569" points="385.9946,882.4145,389.9946,873.4145,385.9946,877.4145,381.9946,873.4145,385.9946,882.4145" style="stroke:#475569;stroke-width:1;"/><path d="M385.9946,846.0012 C385.9946,857.5189 385.9946,864.899 385.9946,876.4145" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="25"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="743.9893" x="5" y="950.8301">Because the shim, not containerd, is the parent, you can restart or upgrade containerd without killing running containers.</text></g><?plantuml-src TLJDRXCn4BxlKmmzjUh-g1oZA0SAI96GgA079E3Ws9DT4w-z-2TjG4Wy1E_2dKVXIHXxTnj7BLAqiMpFDzzyyusVISrL40XrtOm_RunoZP2ijQnt3T-nodVOOps4NXLUUeNmsfeU6Ep21XLwiFWreFFW3MtQeBNKBGpMS7IkA2noptHBOMTJm1aibunpr7wr0kPcd9Eht6ZFf4Oh0Cu5mzxe4ZhPTfN2FQgOniiUBo9MQqqOHYZkAU1x0P11NRzRmw12A_KdlNJo6owkhbOtHe1ZMcpCFReI7jBHMlQiHHY2KcxPnFkhimHjvIdkEjwROgaMSDvOBC5fDhZEU8ysonVXIWXwO7m7YXrIfi7Ym2m22GpM60zRgT0TdCS-popxzZJpBNCxS6ZtacEMmtbcVHbv32NWFNBwxedPIHcUOWcDge7gOoU5GFrPc3jThQOyz7rqae9-_AT1bUjaNr53UBL_dj4ncbH42oHr9CKERZR7OYAKwqCwa8PccyJ8sz4P9Hp52sdAnt6aeB7UKRdIKvZ0Ox5a36F4w8j8CMSVsPAnbBcR_FJsUltWgHDuHiaZfNXX4xIWw7EYjvLj_SKP3PUfSrjtyGGvJk4U7MZMewFEq_8IUBAhIv94vX5y6fOd8EXKmwiFwzltyFVdBw0Y9U6HLHYCKv7tDbQLLtazopWdo82nRclGD1Jt9ToiNy8LI4tmETbCoK4HpYXbXCgJl94wtCCEhKQLuMSr__az5nsN3Zat_P1ssS0sKaalJvBrmUFKjn6sAEQdffeC6UsxW3ZPPX_dhA7IcwCbisNj3DyLqS0FmT4C59tq7vsHTkRZv8t5-3Ts49hnSf7svdjH2BeN1wr8w_bW9atbUKaMMShL2-Gik77IOx8ozV38ienjJKv8Sr32mGIIHzFKZpIDXJ3GaooouH1m9trdWeUTL2e-klFZUvoVUjd8rJy0?></g></svg>