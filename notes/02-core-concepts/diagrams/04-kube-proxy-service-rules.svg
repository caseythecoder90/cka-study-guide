<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="391px" preserveAspectRatio="none" style="width:1311px;height:391px;background:#FFFFFF;" version="1.1" viewBox="0 0 1311 391" width="1311px" zoomAndPan="magnify"><title>kube-proxy writes the rules; the kernel moves the packets (iptables mode)</title><defs/><g><g class="title" data-source-line="3"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="634.1924" x="330.9038" y="30.8838">kube-proxy writes the rules; the kernel moves the packets (iptables mode)</text></g><!--cluster cp--><g class="cluster" data-qualified-name="cp" data-source-line="5" id="ent0002"><rect fill="#F8FAFC" height="109" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="193" x="14" y="98.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="83.7764" x="68.6118" y="116.8921">Control plane</text></g><!--cluster node--><g class="cluster" data-qualified-name="node" data-source-line="9" id="ent0004"><rect fill="#F8FAFC" height="286" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="1035" x="270" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="70.0845" x="752.4578" y="71.8921">Every node</text></g><!--cluster nf--><g class="cluster" data-qualified-name="node.nf" data-source-line="11" id="ent0006"><rect fill="#F8FAFC" height="245" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="632" x="665" y="86.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="157.4663" x="902.2668" y="104.8921">Kernel netfilter (nat table)</text></g><!--entity api--><g class="entity" data-qualified-name="cp.api" data-source-line="6" id="ent0003"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="176.5322" x="22" y="131.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="92.4917" x="36" y="157.8921">kube-apiserver</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="144.3213" x="36" y="170.9648">Service web: 10.96.40.12:80</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="148.5322" x="36" y="183.6138">EndpointSlice: 3 ready Pods</text></g><!--entity kp--><g class="entity" data-qualified-name="node.kp" data-source-line="10" id="ent0005"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="214.7744" x="278" y="131.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="70.0718" x="292" y="157.8921">kube-proxy</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="186.7744" x="292" y="170.9648">watches Services + EndpointSlices,</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="169.9468" x="292" y="183.6138">rewrites rules when they change</text></g><!--entity client--><g class="entity" data-qualified-name="node.client" data-source-line="18" id="ent0012"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="90.1182" x="340.5" y="217.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="62.1182" x="354.5" y="243.8921">client Pod</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="60.5215" x="354.5" y="256.9648">curl web:80</text></g><!--entity svcs--><g class="entity" data-qualified-name="node.nf.svcs" data-source-line="12" id="ent0007"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="157.019" x="673" y="193.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="106.9072" x="687" y="219.8921">KUBE-SERVICES</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="129.019" x="687" y="232.9648">match dst 10.96.40.12:80</text></g><!--entity svc--><g class="entity" data-qualified-name="node.nf.svc" data-source-line="13" id="ent0008"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="178.3423" x="867" y="193.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="97.5063" x="881" y="219.8921">KUBE-SVC-web</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="150.3423" x="881" y="232.9648">pick one endpoint at random</text></g><!--entity sepc--><g class="entity" data-qualified-name="node.nf.sepc" data-source-line="14" id="ent0009"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="192.0044" x="1089.5" y="267.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="164.0044" x="1103.5" y="293.8921">KUBE-SEP-c  the remainder</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="126.5752" x="1103.5" y="306.9648">DNAT &#8594; 10.244.2.9:8080</text></g><!--entity sepb--><g class="entity" data-qualified-name="node.nf.sepb" data-source-line="15" id="ent0010"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="206.8389" x="1082" y="193.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="178.8389" x="1096" y="219.8921">KUBE-SEP-b  p=1/2 of the rest</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="126.5752" x="1096" y="232.9648">DNAT &#8594; 10.244.2.7:8080</text></g><!--entity sepa--><g class="entity" data-qualified-name="node.nf.sepa" data-source-line="16" id="ent0011"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="154.5752" x="1108" y="119.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="117.4189" x="1122" y="145.8921">KUBE-SEP-a  p=1/3</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="126.5752" x="1122" y="158.9648">DNAT &#8594; 10.244.1.5:8080</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="dependency" id="lnk13"><polygon fill="#475569" points="277.8981,165.6982,268.8981,161.6982,272.8981,165.6982,268.8981,169.6982,277.8981,165.6982" style="stroke:#475569;stroke-width:1;"/><path d="M199.0054,165.6982 C224.1149,165.6982 245.7747,165.6982 271.8981,165.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="31.3477" x="223" y="157.9541">watch</text></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0007" data-link-type="dependency" id="lnk14"><polygon fill="#475569" points="672.8937,206.7639,664.7282,201.2571,667.9701,205.8928,663.3344,209.1348,672.8937,206.7639" style="stroke:#475569;stroke-width:1;"/><path d="M493.1615,179.6536 C542.4908,186.4 601.8128,194.9268 655,203.6982 C660.8264,204.6591 660.9365,204.6484 666.9854,205.7186" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="82.7051" x="542" y="175.9541">iptables-restore</text></g><g class="link" data-entity-1="ent0012" data-entity-2="ent0007" data-link-type="dependency" id="lnk15"><polygon fill="#475569" points="672.8457,227.455,663.5855,224.1011,667.8582,227.8084,664.151,232.0811,672.8457,227.455" style="stroke:#475569;stroke-width:1;"/><path d="M430.6947,243.0351 C483.9154,239.7968 576.0141,234.0934 655,228.6982 C660.805,228.3017 660.8228,228.3069 666.8607,227.879" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="132.1055" x="517" y="220.9541">packet to 10.96.40.12:80</text></g><g class="link" data-entity-1="ent0007" data-entity-2="ent0008" data-link-type="dependency" id="lnk16"><polygon fill="#475569" points="866.6868,221.6982,857.6868,217.6982,861.6868,221.6982,857.6868,225.6982,866.6868,221.6982" style="stroke:#475569;stroke-width:1;"/><path d="M830.2127,221.6982 C842.1469,221.6982 848.5431,221.6982 860.6868,221.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0008" data-entity-2="ent0009" data-link-type="dependency" id="lnk17"><polygon fill="#475569" points="1098.2266,267.6357,1090.9052,261.0479,1093.4718,266.0891,1088.4306,268.6556,1098.2266,267.6357" style="stroke:#475569;stroke-width:1;"/><path d="M1043.3324,249.78 C1061.3074,255.6268 1074.5479,259.9336 1092.5208,265.7797" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0008" data-entity-2="ent0010" data-link-type="dependency" id="lnk18"><polygon fill="#475569" points="1081.8773,221.6982,1072.8773,217.6982,1076.8773,221.6982,1072.8773,225.6982,1081.8773,221.6982" style="stroke:#475569;stroke-width:1;"/><path d="M1045.2831,221.6982 C1057.2734,221.6982 1063.6618,221.6982 1075.8773,221.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0008" data-entity-2="ent0011" data-link-type="dependency" id="lnk19"><polygon fill="#475569" points="1107.9217,172.6072,1098.1258,171.5873,1103.1669,174.1538,1100.6004,179.195,1107.9217,172.6072" style="stroke:#475569;stroke-width:1;"/><path d="M1043.3324,193.6165 C1064.5756,186.7066 1081.4696,181.2114 1102.216,174.4632" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="29"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1139.2705" x="78.3647" y="359.8301">Nothing listens on a ClusterIP: it exists only as a match in these rules. kube-proxy is not in the packet path, so if it stops, existing Services keep working but changes stop being applied.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="551.626" x="372.187" y="375.9287">Pod-to-Pod routing to 10.244.x.x after the DNAT is the CNI plugin's job, not kube-proxy's.</text></g><?plantuml-src VLJDRjim3BxxARXUscAnqxJTJpClm9RbK0meYcNhQHTPPXBDYYH8SfDiw7KFi4VSauoItStksW01Ob7Knu_aHpuJYikwHCYoOVFpMaitB0LRMhPsGrwnrAzmZPcfrpAHkF3WDLYnN7aeXKNkXLQ95ruYL7M1gR5wkuED5HuTq5EmjKJt9dvMQ1LAMElRziumNg5tS2ICPmNvqLs9nqaIW9bQ4kZ1L2jljGGZcS83oFEbrRMPJ80vu0P-900TxyY16U7GtgBzgd8dlkDuD9hCoI0umWQBCOnEiekNsVb9DZeTlpx9Xy5fqd6UgT9eeVnSqfCnd544LkxWMfUkTGv46EUeVCE4GYPtFTupYhy3HVay81rCZzAEfUkms33FLrIJbhg3vz0ZvWR_CxVObZwM7JOhLA7IE-0h2eKTzakjouPGPVfaFZPjKkWNGdgqSAGOjJqqwFXXBekOIV_vb_UpT3xxT7CvdSqxrDOX7IYTVxpy1m7FtNBtEDxDDANMTU2Cu1LeXO1jJO18MgPAlNw0-0J1wvH3er1SCw7Adbm-NBtx3Bz__WfSJy_FizFiWgXsoEOv2LAefWm