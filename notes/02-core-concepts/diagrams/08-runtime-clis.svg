<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="321px" preserveAspectRatio="none" style="width:990px;height:321px;background:#FFFFFF;" version="1.1" viewBox="0 0 990 321" width="990px" zoomAndPan="magnify"><title>Three CLIs, two doors into the runtime</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="330.0117" x="326.4941" y="30.8838">Three CLIs, two doors into the runtime</text></g><!--cluster ctrd--><g class="cluster" data-qualified-name="ctrd" data-source-line="9" id="ent0006"><rect fill="#F8FAFC" height="109" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="381" x="360" y="160.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="66.4536" x="517.2732" y="178.8921">containerd</text></g><!--entity ctr--><g class="entity" data-qualified-name="ctr" data-source-line="4" id="ent0002"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="256.5669" x="320.5" y="53.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="16.6182" x="334.5" y="79.8921">ctr</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="228.5669" x="334.5" y="92.9648">ships with containerd &#183; low-level debugging</text></g><!--entity nerdctl--><g class="entity" data-qualified-name="nerdctl" data-source-line="5" id="ent0003"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="295.7222" x="6" y="53.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="43.3418" x="20" y="79.8921">nerdctl</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="267.7222" x="20" y="92.9648">Docker-compatible CLI for containerd &#183; general use</text></g><!--entity crictl--><g class="entity" data-qualified-name="crictl" data-source-line="6" id="ent0004"><rect fill="#326CE5" height="55.5977" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="294.46" x="690" y="53.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="31.0718" x="704" y="79.8921">crictl</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="266.46" x="704" y="92.9648">from Kubernetes (cri-tools) &#183; Pod-aware debugging</text></g><!--entity kubelet--><g class="entity" data-qualified-name="kubelet" data-source-line="7" id="ent0005"><rect fill="#DCFCE7" height="42.9487" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="73.5127" x="598" y="60.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="45.5127" x="612" y="86.3921">kubelet</text></g><!--entity crio--><g class="entity" data-qualified-name="crio" data-source-line="14" id="ent0010"><rect fill="#FFFFFF" height="57.8975" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="137.8145" x="768" y="198.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="109.8145" x="782" y="224.8921">CRI-O or any other</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="69.3481" x="782" y="239.8408">CRI runtime</text></g><!--entity api--><g class="entity" data-qualified-name="ctrd.api" data-source-line="10" id="ent0007"><rect fill="#EFF6FF" height="68.2466" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="156.9922" x="368.5" y="193.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="91.7363" x="382.5" y="219.8921">containerd API</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="128.9922" x="382.5" y="232.9648">containerd namespaces:</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="116.1284" x="382.5" y="245.6138">default &#183; k8s.io &#183; moby</text></g><!--entity cri--><g class="entity" data-qualified-name="ctrd.cri" data-source-line="11" id="ent0008"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="189.4014" x="543.5" y="199.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="64.9873" x="557.5" y="225.8921">CRI plugin</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="161.4014" x="557.5" y="238.9648">works in the k8s.io namespace</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0007" data-link-type="dependency" id="lnk11"><polygon fill="#475569" points="447.4588,193.6674,451.5834,184.7238,447.5282,188.6679,443.5841,184.6127,447.4588,193.6674" style="stroke:#475569;stroke-width:1;"/><path d="M448.6238,109.7835 C448.2934,133.5731 447.895,162.2556 447.5421,187.668" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0007" data-link-type="dependency" id="lnk12"><polygon fill="#475569" points="379.7914,193.6674,373.4785,186.1078,375.304,191.462,369.9498,193.2876,379.7914,193.6674" style="stroke:#475569;stroke-width:1;"/><path d="M209.1111,109.7835 C257.5163,133.5731 322.6994,165.6085 374.4066,191.0209" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0008" data-link-type="dependency" id="lnk13"><polygon fill="#475569" points="675.6003,199.49,685.2365,197.4544,679.651,196.5588,680.5467,190.9733,675.6003,199.49" style="stroke:#475569;stroke-width:1;"/><path d="M799.5696,109.7835 C764.1042,135.447 715.9824,170.2687 680.4612,195.9726" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="20.666" x="778" y="144.9541">CRI</text></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0010" data-link-type="dependency" id="lnk14"><polygon fill="#475569" points="837,198.2565,841,189.2565,837,193.2565,833,189.2565,837,198.2565" style="stroke:#475569;stroke-width:1;"/><path d="M837,109.7835 C837,135.0396 837,166.5722 837,192.2565" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="20.666" x="843" y="144.9541">CRI</text></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0008" data-link-type="dependency" id="lnk15"><polygon fill="#475569" points="637.4326,199.4635,641.2443,190.3821,637.3285,194.4646,633.246,190.5488,637.4326,199.4635" style="stroke:#475569;stroke-width:1;"/><path d="M635.4298,103.3299 C635.9564,128.6046 636.7251,165.502 637.3076,193.4648" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="20.666" x="642" y="144.9541">CRI</text></g><g class="caption" data-source-line="22"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="945.0137" x="18.9932" y="289.8301">Kubernetes' containers live in containerd's k8s.io namespace: plain "ctr containers ls" shows none of them, "ctr -n k8s.io containers ls" shows all of them.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="471.584" x="255.708" y="305.9287">crictl needs no namespace flag because the CRI plugin only works in k8s.io.</text></g><?plantuml-src RPF1ZjGm38RlVGepbmLfssflQ5HLGijb118hn0quP1AtjPh6LP9kDI2UYpjFHfBfphGmKWzjOd-s_zzzHKRgII4KHNb-FBDsfIBHMZ6uKlOYznqEM8pJe3DFNYDywImYF7uyk7lmCuDYjWx8U8OG2tOodWRCCelI2zE6Z9tqzfkf7Ft0_SD3xJeQ7SpaEv1il223Li6Vtw1vpZK-emQ5nwbjoRHL6RFg7GW7WRA6nYpfzGhydcMFDfSyZCBJKQSkeM7xJvqMmvlGC3bSynVWfd5BsnADvG4-J4Uq1ZqwU1qYygJQcqX-OfMBMLYyCK5L2IdH-BfEmoJokbOVg1fz36oPrJbiETogUHacnLgUneNfmtm_Cu2RmV3kwR2QP7LXn81k51BTVkbs5QUm4PFsSRh-hIk8uzl0nzDQEZ7IjkpZvmECUWe2h50pspvkIjgJ1NQflN7QHbo0Glwr8wNGVBVKTZwlqzMlR5if_mJ1Os5Em84SLYrMN_OmIZJgCEX5Tiwo81JaYcSJWB7rnVdDsTcWor7uX3q4y8qBNcuMisxaP5ACdjX0HVLrU-wkU-b0qpD6RQw-tBd_HDf3cYNzKPjajmFNyHoMc0q2Dr7YuVuSbviNpiqCeVLBGb6L5BsdUXdI8Ah8l7O0ZHOj756AyFSa8wzM0njzWelBvwA9-HS0?></g></svg>