<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="387px" preserveAspectRatio="none" style="width:787px;height:387px;background:#FFFFFF;" version="1.1" viewBox="0 0 787 387" width="787px" zoomAndPan="magnify"><title>maxSurge and maxUnavailable set the limits of a rollout (replicas: 10)</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="594.1846" x="88.9077" y="30.8838">maxSurge and maxUnavailable set the limits of a rollout (replicas: 10)</text></g><!--cluster a--><g class="cluster" data-qualified-name="a" data-source-line="4" id="ent0002"><rect fill="#EFF6FF" height="290.5" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="255" x="14" y="53.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="51.2891" x="115.8555" y="71.8921">Defaults</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="231.9497" x="25.5251" y="86.8408">maxSurge 25% &#183; maxUnavailable 25%</text></g><!--cluster b--><g class="cluster" data-qualified-name="b" data-source-line="12" id="ent0008"><rect fill="#F0FDF4" height="291.5" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="254" x="277" y="60.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="110.5381" x="348.731" y="78.3921">Keep full capacity</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="194.3716" x="306.8142" y="93.3408">maxSurge 1 &#183; maxUnavailable 0</text></g><!--cluster c--><g class="cluster" data-qualified-name="c" data-source-line="20" id="ent0014"><rect fill="#EFF6FF" height="291.5" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="242" x="539" y="60.1982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="87.4136" x="616.2932" y="78.3921">No extra Pods</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="194.3716" x="562.8142" y="93.3408">maxSurge 0 &#183; maxUnavailable 1</text></g><!--entity a1--><g class="entity" data-qualified-name="a.a1" data-source-line="5" id="ent0003"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="147.2329" x="102.5" y="101.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="95.3799" x="116.5" y="127.8921">At most 13 Pods</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="119.2329" x="116.5" y="140.9648">2.5 rounds UP to 3 extra</text></g><!--entity a2--><g class="entity" data-qualified-name="a.a2" data-source-line="6" id="ent0004"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="179.6099" x="76" y="193.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="109.1226" x="90" y="219.8921">At least 8 available</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="151.6099" x="90" y="232.9648">2.5 rounds DOWN to 2 missing</text></g><!--entity a3--><g class="entity" data-qualified-name="a.a3" data-source-line="7" id="ent0005"><rect fill="#F1F5F9" height="42.9487" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="197.1143" x="63.5" y="293.1982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="169.1143" x="77.5" y="319.3921">Balances speed and capacity</text></g><!--entity b1--><g class="entity" data-qualified-name="b.b1" data-source-line="13" id="ent0009"><rect fill="#FFFFFF" height="42.9487" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="123.3799" x="342.5" y="108.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="95.3799" x="356.5" y="134.3921">At most 11 Pods</text></g><!--entity b2--><g class="entity" data-qualified-name="b.b2" data-source-line="14" id="ent0010"><rect fill="#DCFCE7" height="42.9487" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="151.5698" x="328" y="200.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="123.5698" x="342" y="226.3921">At least 10 available</text></g><!--entity b3--><g class="entity" data-qualified-name="b.b3" data-source-line="15" id="ent0011"><rect fill="#F1F5F9" height="57.8975" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="238.2661" x="285" y="285.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.2661" x="299" y="311.8921">New Pod first, old Pod removed only</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="168.3843" x="299" y="326.8408">after the new one is available</text></g><!--entity c1--><g class="entity" data-qualified-name="c.c1" data-source-line="21" id="ent0015"><rect fill="#DCFCE7" height="42.9487" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="129.8545" x="595" y="108.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="101.8545" x="609" y="134.3921">At most 10 Pods</text></g><!--entity c2--><g class="entity" data-qualified-name="c.c2" data-source-line="22" id="ent0016"><rect fill="#FFFFFF" height="42.9487" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="137.1226" x="591.5" y="200.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="109.1226" x="605.5" y="226.3921">At least 9 available</text></g><!--entity c3--><g class="entity" data-qualified-name="c.c3" data-source-line="23" id="ent0017"><rect fill="#F1F5F9" height="57.8975" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="224.5107" x="547.5" y="285.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="196.5107" x="561.5" y="311.8921">Old Pod removed first, for clusters</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="128.6226" x="561.5" y="326.8408">with no spare capacity</text></g><g class="caption" data-source-line="31"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="375.8877" x="198.0562" y="371.8301">Both set to 0 is invalid: the rollout could never replace a Pod.</text></g><?plantuml-src TPHDYzim48Rl_XNJGA65viC92sqmXYuBFHIo2sNfeUrXB8qTKLaoafpTjlHtzTvVrh6IviEEmHUDFUyxysWyBvGHkfK4izby_mHhjPzBXPN3si_5Tvo6BTKqQzfQ9q45JL3ZywVMLGHeP7TuDBX3fR7WTvu2S09eLQlWmPQ0uApMjWtmob6ZbK2_XdJnEaaSYO2cugp97PNOwk2_cgFuykOb_FtJr-Ve1D2pwgy4u4pXVO3Q-W3f2XwiPA7Cgv-qJjDyERlX4beZFJm-GB2m0deE3hDvzqK-WInhD2gJvr4u7UXgGXP-2ySghelVtN_UTF9Bg9NtobGZ1ijBWrlKQ0Hvy0sHZ4m5DYXK-D5brcqWUSXSSIQcCFsoLLAI-IRjavdcUqLS3kEhvFS5vOz43PIjraU7Czxf5TgBheAA-si-M7keeXWbdqRolNQBCPxfuWGqsfmSUeGszDGfGwcS3s_0QXcFZcgxOsBMQEu3oq0kZfxXpwqXKFxIu8naqP4iXYIZSp4aMVH9Rkn-XWwpTeIuk08nZGChHh4jZjXE2CGOjNUNFPs15ZrgzprC1tgbTS3_l6TQNFYJ2bimbcSF7OtDdUXeYI6jw2Y6j4IaXQUuKzKsT1YJOXWKISA-GLa3cSflBHSKbuXbc7o5oknGAxcEL_j_amZRSdU6TdpbtL91mSkewtQMpLN-3m00?></g></svg>