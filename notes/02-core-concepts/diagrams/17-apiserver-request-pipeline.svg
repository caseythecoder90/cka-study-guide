<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="228px" preserveAspectRatio="none" style="width:1670px;height:228px;background:#FFFFFF;" version="1.1" viewBox="0 0 1670 228" width="1670px" zoomAndPan="magnify"><title>Every write request takes the same path through the kube-apiserver</title><defs/><g><g class="title" data-source-line="3"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="581.1943" x="535.4028" y="30.8838">Every write request takes the same path through the kube-apiserver</text></g><!--cluster api--><g class="cluster" data-qualified-name="api" data-source-line="7" id="ent0003"><rect fill="#F8FAFC" height="123" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="1278" x="204" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="132.9644" x="776.5178" y="71.8921">kube-apiserver  :6443</text></g><!--entity req--><g class="entity" data-qualified-name="req" data-source-line="5" id="ent0002"><rect fill="#FFFFFF" height="68.2466" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="168.6313" x="6" y="93.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="48.4199" x="20" y="119.8921">Request</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="126.543" x="20" y="132.9648">kubectl, curl, client library,</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="140.6313" x="20" y="145.6138">scheduler, controller, kubelet</text></g><!--entity etcd--><g class="entity" data-qualified-name="etcd" data-source-line="14" id="ent0009"><path d="M1590,105.1982 C1590,9