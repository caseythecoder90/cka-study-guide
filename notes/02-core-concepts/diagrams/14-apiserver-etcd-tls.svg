<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="311px" preserveAspectRatio="none" style="width:821px;height:311px;background:#FFFFFF;" version="1.1" viewBox="0 0 821 311" width="821px" zoomAndPan="magnify"><title>Who presents which certificate on port 2379 (kubeadm paths)</title><defs/><g><g class="title" data-source-line="3"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="526.1045" x="143.4497" y="30.8838">Who presents which certificate on port 2379 (kubeadm paths)</text></g><!--entity api--><g class="entity" data-qualified-name="api" data-source-line="5" id="ent0002"><rect fill="#326CE5" height="93.5444" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="333.9912" x="44.002" y="61.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="92.4917" x="58.002" y="87.8921">kube-apiserver</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="189.8467" x="58.002" y="100.9648">--etcd-servers=https://127.0.0.1:2379</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="225.8921" x="58.002" y="113.6138">--etcd-cafile=/etc/kubernetes/pki/etcd/ca.crt</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="303.5259" x="58.002" y="126.2627">--etcd-certfile=/etc/kubernetes/pki/apiserver-etcd-client.crt</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="305.9912" x="58.002" y="138.9116">--etcd-keyfile=/etc/kubernetes/pki/apiserver-etcd-client.key</text></g><!--entity ctl--><g class="entity" data-qualified-name="ctl" data-source-line="7" id="ent0003"><rect fill="#EFF6FF" height="93.5444" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="242.9243" x="89.502" y="173.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="161.7764" x="103.502" y="199.8921">etcdctl  (you, on the node)</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="176.9668" x="103.502" y="212.9648">--endpoints=https://127.0.0.1:2379</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="203.8975" x="103.502" y="225.6138">--cacert=/etc/kubernetes/pki/etcd/ca.crt</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="212.459" x="103.502" y="238.2627">--cert=/etc/kubernetes/pki/etcd/server.crt</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="214.9243" x="103.502" y="250.9116">--key=/etc/kubernetes/pki/etcd/server.key</text></g><!--entity etcd--><g class="entity" data-qualified-name="etcd" data-source-line="9" id="ent0004"><rect fill="#DCFCE7" height="93.5444" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="288.6914" x="487.002" y="117.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="67.2026" x="501.002" y="143.8921">etcd  :2379</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="260.6914" x="501.002" y="156.9648">--client-cert-auth=true  (client must present a cert)</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="244.2183" x="501.002" y="169.6138">--trusted-ca-file=/etc/kubernetes/pki/etcd/ca.crt</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="232.0151" x="501.002" y="182.2627">--cert-file=/etc/kubernetes/pki/etcd/server.crt</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="234.4805" x="501.002" y="194.9116">--key-file=/etc/kubernetes/pki/etcd/server.key</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" id="lnk5"><polygon fill="#475569" points="486.6776,145.4529,478.2876,140.2946,481.7218,144.7898,477.2266,148.2239,486.6776,145.4529" style="stroke:#475569;stroke-width:1;"/><path d="M378.0053,130.9114 C413.9481,135.7209 445.724,139.9729 480.7306,144.6572" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="61.3594" x="402.002" y="125.9541">mutual TLS</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" id="lnk6"><polygon fill="#475569" points="486.9832,183.9027,477.5322,181.1317,482.0274,184.5658,478.5932,189.061,486.9832,183.9027" style="stroke:#475569;stroke-width:1;"/><path d="M332.7687,204.5383 C380.9356,198.093 430.8228,191.4176 481.0362,184.6984" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="61.3594" x="402.002" y="179.9541">mutual TLS</text></g><g class="caption" data-source-line="14"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="803.0039" x="5" y="279.8301">Both clients trust the etcd CA and present a certificate signed by it. The flag NAMES differ (etcd-cafile vs cacert vs trusted-ca-file);</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="771.1279" x="20.938" y="295.9287">the files are the same. Read them from /etc/kubernetes/manifests/etcd.yaml and kube-apiserver.yaml instead of memorizing.</text></g><?plantuml-src dPJ1Rjim38RlVWgkfmIOhQKx5CiS0zsmsxR3Mc2NNLIPjedOaY7H7TAd7oMtHPEswLhO1ulMJr6VVl4TMTDFDK9HgFbbv_gWQjAjrqDGPgjpxd30Ofo6FkknOM07djgEeIQFXidPZ8bxXD-TWz5ZGCi1_dPaEZ3ecHeocX6SXT5vXjEFPvzWiPskKDS3Z9gxiCooc4hRLjASn5-v7YcWlqR_nvQ1Rd2zMbLvZcpgV8w7JSSyXhLIgzEpueCygtLCNQeulNeiCxgX7ZTA1YekuIqo1ZLkAOPgPNHXF3ylbwqyc-2-sjkvFGc4e-csk7jbDb7SPZk1ijJ6IB2gG0UG-Ni0eyfm3x3OkUbz12zd2DRLkDmlnDQZ8pcjLw0qEe9u2yNZkdd3psbbxozA7_8HA0BW4HI0jA_ziXBTL5sk9-usx2SKT7CSXYdmdQj19qCldwfGL84nkYn_gyrI2SV5BrBwF_s-bLhdwjb8SKwMYPqWpwiqWhKGu4dtSFdz8ekcUlfFPlGOMm6KL7rnB3S_uGkGk2J_9T7NSz2sFW1wro42jHPhkDe1SG6NecbwtSBFyn_VBgJRD0rwM3ouot0jnvpy6ByEJc3vkLGK-L0LLuyXkIaUKor1Iqk3NzA1ud20nhi13gaDsbA3WKDYL-pqqAVYz_lJ72ShQqisry20W_DqGxOjOWN_0000?></g></svg>