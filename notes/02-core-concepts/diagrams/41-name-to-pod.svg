<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="SEQUENCE" height="472px" preserveAspectRatio="none" style="width:821px;height:472px;background:#FFFFFF;" version="1.1" viewBox="0 0 821 472" width="821px" zoomAndPan="magnify"><title>From a Service name to a Pod</title><defs/><g><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="257.0889" x="278.4053" y="35.8838">From a Service name to a Pod</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="689.0352" x="62.4321" y="440.2168">Two separate steps: DNS turns the name into the ClusterIP, then the node's rules turn the ClusterIP into a Pod.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="803.8994" x="5" y="456.3154">That is how to split a failure: if the name does not resolve, look at DNS; if the IP does not connect, look at endpoints and the rules.</text><g class="participant-lifeline" data-entity-uid="part1" data-qualified-name="p" id="part1-lifeline"><g><title>front-end Pod</title><rect fill="#000000" fill-opacity="0.00000" height="261.5918" width="8" x="140.1024" y="107.5957"/><line style="stroke:#94A3B8;stroke-width:0.5;stroke-dasharray:5,5;" x1="143.5001" x2="143.5001" y1="107.5957" y2="369.1875"/></g></g><g class="participant-lifeline" data-entity-uid="part2" data-qualified-name="d" id="part2-lifeline"><g><title>CoreDNS</title><rect fill="#000000" fill-opacity="0.00000" height="261.5918" width="8" x="307.536" y="107.5957"/><line style="stroke:#94A3B8;stroke-width:0.5;stroke-dasharray:5,5;" x1="311.0033" x2="311.0033" y1="107.5957" y2="369.1875"/></g></g><g class="participant-lifeline" data-entity-uid="part3" data-qualified-name="r" id="part3-lifeline"><g><ti