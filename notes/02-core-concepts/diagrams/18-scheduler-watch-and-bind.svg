<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="SEQUENCE" height="760px" preserveAspectRatio="none" style="width:867px;height:760px;background:#FFFFFF;" version="1.1" viewBox="0 0 867 760" width="867px" zoomAndPan="magnify"><title>How the scheduler "monitors" the API server: a watch, not polling and not etcd</title><defs/><g><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="676.1514" x="91.8086" y="35.8838">How the scheduler "monitors" the API server: a watch, not polling and not etcd</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="849.7686" x="5" y="745.0098">Every controller, the kubelet and kube-proxy follow the same list-then-watch pattern against the API server. None of them can reach etcd.</text><g class="participant-lifeline" data-entity-uid="part1" data-qualified-name="s" id="part1-lifeline"><g><title>kube-scheduler</title><rect fill="#000000" fill-opacity="0.00000" height="534.2822" width="8" x="183.8982" y="123.647"/><line style="stroke:#94A3B8;stroke-width:0.5;stroke-dasharray:5,5;" x1="187.856" x2="187.856" y1="123.647" y2="657.9292"/></g></g><g class="participant-lifeline" data-entity-uid="part2" data-qualified-name="a" id="part2-lifeline"><g><title>kube-apiserver</title><rect fill="#000000" fill-opacity="0.00000" height="534.2822" width="8" x="471.8767" y="123.647"/><line style="stroke:#94A3B8;stroke-width:0.5;stroke-dasharray:5,5;" x1="475.6309" x2="475.6309" y1="123.647" y2="657.9292"/></g></g><g class="participant-lifeline" data-entity-uid="part3" data-qualified-name="e" id="part3-lifeline"><g><title>etcd</title><rect fill="#000000" fill-opacity="0.00000" height="534.2822" width="8" x="708.6267" y="123.647"/><line style="stroke:#94A3B8;stroke-width:0.5;stroke-dasharray:5,5;" x