<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="398px" preserveAspectRatio="none" style="width:677px;height:398px;background:#FFFFFF;" version="1.1" viewBox="0 0 677 398" width="677px" zoomAndPan="magnify"><title>What the scheduler does with a pending Pod</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="383.0273" x="143.9863" y="30.8838">What the scheduler does with a pending Pod</text></g><!--entity queue--><g class="entity" data-qualified-name="queue" data-source-line="4" id="ent0002"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="291.4253" x="192.5" y="61.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="111.9536" x="206.5" y="87.8921">Scheduling queue</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="263.4253" x="206.5" y="100.9648">pending Pods sorted by spec.priority, highest first</text></g><!--entity fit--><g class="entity" data-qualified-name="fit" data-source-line="5" id="ent0003"><rect fill="#326CE5" height="42.9487" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="215.0591" x="230.5" y="154.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="187.0591" x="244.5" y="180.8921">Does the Pod fit on any node?</text></g><!--entity bind--><g class="entity" data-qualified-name="bind" data-source-line="7" id="ent0004"><rect fill="#DCFCE7" height="42.9487" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="172.4346" x="6" y="318.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="144.4346" x="20" y="344.3921">Bind it to the best node</text></g><!--entity preempt--><g class="entity" data-qualified-name="preempt" data-source-line="8" id="ent0005"><rect fill="#FEE2E2" height="106.1934" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="283.4868" x="196.5" y="286.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="52.019" x="210.5" y="312.8921">Preempt</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="255.4868" x="210.5" y="325.9648">pick a node where evicting LOWER-priority Pods</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="226.1553" x="210.5" y="338.6138">makes room (lowest first, PDBs best-effort)</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="166.2622" x="210.5" y="351.2627">victims get graceful termination</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="210.5576" x="210.5" y="363.9116">status.nominatedNodeName = that node</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="141.2114" x="210.5" y="376.5605">bind once the space is free</text></g><!--entity never--><g class="entity" data-qualified-name="never" data-source-line="9" id="ent0006"><rect fill="#F1F5F9" height="80.8955" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="173.5298" x="498" y="299.1982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="26" x="512" y="325.3921">Wait</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="145.5298" x="512" y="338.4648">evicts nobody; stays Pending,</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="127.7729" x="512" y="351.1138">still ahead of lower-priority</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="88.6821" x="512" y="363.7627">Pods in the queue</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" id="lnk7"><polygon fill="#475569" points="338,154.4816,342,145.4816,338,149.4816,334,145.4816,338,154.4816" style="stroke:#475569;stroke-width:1;"/><path d="M338,117.8997 C338,129.7683 338,137.4593 338,148.4816" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" id="lnk8"><polygon fill="#475569" points="123.6076,317.9477,133.3263,316.3523,127.7873,315.2037,128.9359,309.6647,123.6076,317.9477" style="stroke:#475569;stroke-width:1;"/><path d="M306.5941,197.8164 C259.4457,228.7694 175.8894,283.6245 128.6233,314.6549" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="15.334" x="285" y="246.9541">fits</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="dependency" id="lnk9"><polygon fill="#475569" points="338,286.432,342,277.432,338,281.432,334,277.432,338,286.432" style="stroke:#475569;stroke-width:1;"/><path d="M338,197.9809 C338,220.2162 338,250.3488 338,280.432" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="68.0332" x="367.6689" y="232.9541">fits nowhere,</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="115.3711" x="344" y="246.7529">PreemptLowerPriority</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="44.0215" x="379.6748" y="260.5518">(default)</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0006" data-link-type="dependency" id="lnk10"><polygon fill="#475569" points="556.7083,299.0574,554.2976,289.5081,553.621,295.1244,548.0048,294.4478,556.7083,299.0574" style="stroke:#475569;stroke-width:1;"/><path d="M430.8423,197.7628 C444.1473,202.6009 457.2807,208.5088 469,215.6982 C504.0277,237.1865 531.7315,267.2383 553.0035,294.3378" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="68.0332" x="535" y="239.9541">fits nowhere,</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="32.0098" x="553.0117" y="253.7529">Never</text></g><?plantuml-src RP91Rvmm48Nl_8hfdX9fOPLhIgaK9RTeYzh3NlPYx06i1PlOGrRqrtTiAAAY4WSqdkTvx_DyqKPseqB8ijFyaRMTFoaj6YTwVv8taLABFMR3s7S9QUeGBgqWu2fusQ8QEtIWB7guQsf1m816QTD0QLMIE9GaJCEgmw-vEnnzZ3ZYrUHU_yRdfwTY8_7WhIDKK4tW1vJPuBHrcgOZjBffqHFKsddAJq5S743u-RhjgDTW9pZa2xcTm1eGPW9Z5Nu_G9uBAT5GKGGrd__ZyqKR1QmX6w-emiWW3Bh6MZMhAkxQgag7s0-q3QNbZN44ATnRT0ZugIM5dEy_Bcy_qx_9OkmbpqRVYnkdSDRsyD3P-vhy2ENhYu--KgnhflMu5yT9lOS62VWf9TPZ1uIkrqQGjcQly2Hez9cniGNLcNsVHO_mZJ686S5U5J0mNOdpGWmy2JGpPHhh2-Lv9HPgmqnf2-uYz9PQPEHvMcNLz1NOrUIXdFVZ-3_Nkkj0j2ZOHWs1arl1xjlZWcaJpSQjsPZiHquzspJuYIv9OWUaQH5t9EnH-8-HdqF9hxKbrr9cz_71ZrUphCLxy5KkjgxcGM4jneuUrmlYnBty7Cf_0000?></g></svg>