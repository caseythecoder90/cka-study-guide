<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="357px" preserveAspectRatio="none" style="width:901px;height:357px;background:#FFFFFF;" version="1.1" viewBox="0 0 901 357" width="901px" zoomAndPan="magnify"><title>How the DaemonSet controller keeps one Pod per node</title><defs/><g><g class="title" data-source-line="3"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="475.084" x="205.458" y="30.8838">How the DaemonSet controller keeps one Pod per node</text></g><!--cluster ev--><g class="cluster" data-qualified-name="ev" data-source-line="5" id="ent0002"><rect fill="#F8FAFC" height="127" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="881" x="14" y="61.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="98.9727" x="405.0137" y="79.8921">Watched events</text></g><!--entity ctrl--><g class="entity" data-qualified-name="ctrl" data-source-line="15" id="ent0010"><rect fill="#326CE5" height="118.8423" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="196.0723" x="168.5" y="197.1982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="135.0845" x="182.5" y="223.3921">DaemonSet controller</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="142.4146" x="182.5" y="236.4648">in kube-controller-manager</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="112.4707" x="182.5" y="249.1138">for EVERY node, ask:</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="168.0723" x="182.5" y="261.7627">should a daemon Pod run here?</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="157.083" x="182.5" y="274.4116">(nodeSelector / affinity match,</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="82.5107" x="182.5" y="287.0605">taints tolerated)</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="143.6553" x="182.5" y="299.7095">does one already run here?</text></g><!--entity create--><g class="entity" data-qualified-name="create" data-source-line="17" id="ent0011"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="226.9883" x="409" y="209.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="142.2764" x="423" y="235.8921">Should run, none there</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="158.9146" x="423" y="248.9648">create a Pod with node affinity</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="198.9883" x="423" y="261.6138">matchFields metadata.name = &lt;node&gt;</text></g><!--entity del--><g class="entity" data-qualified-name="del" data-source-line="18" id="ent0012"><rect fill="#FEE2E2" height="55.5977" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="169.5527" x="437.5" y="295.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="141.5527" x="451.5" y="321.8921">Runs there, should not</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="75.1792" x="451.5" y="334.9648">delete the Pod</text></g><!--entity sched--><g class="entity" data-qualified-name="sched" data-source-line="20" id="ent0013"><rect fill="#EFF6FF" height="68.2466" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="218.6685" x="672" y="209.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="96.0845" x="686" y="235.8921">kube-scheduler</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="174.1738" x="686" y="248.9648">the affinity allows only that node:</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="190.6685" x="686" y="261.6138">binds it, or preempts if it does not fit</text></g><!--entity e1--><g class="entity" data-qualified-name="ev.e1" data-source-line="6" id="ent0003"><rect fill="#EFF6FF" height="42.9487" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="102.3945" x="22" y="95.1982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="74.3945" x="36" y="121.3921">Node added</text></g><!--entity e2--><g class="entity" data-qualified-name="ev.e2" data-source-line="7" id="ent0004"><rect fill="#EFF6FF" height="42.9487" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="212.9263" x="160" y="95.1982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="184.9263" x="174" y="121.3921">Node labels or taints changed</text></g><!--entity e3--><g class="entity" data-qualified-name="ev.e3" data-source-line="8" id="ent0005"><rect fill="#EFF6FF" height="42.9487" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="207.8862" x="418.5" y="95.1982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="179.8862" x="432.5" y="121.3921">DaemonSet created or edited</text></g><!--entity e4--><g class="entity" data-qualified-name="ev.e4" data-source-line="9" id="ent0006"><rect fill="#EFF6FF" height="42.9487" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="210.7554" x="676" y="95.1982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="182.7554" x="690" y="121.3921">Daemon Pod deleted or failed</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0010" data-link-type="dependency" id="lnk14"><polygon fill="#475569" points="168.2554,212.0114,161.7478,204.6189,163.7122,209.9237,158.4073,211.8881,168.2554,212.0114" style="stroke:#475569;stroke-width:1;"/><path d="M117.5398,188.7061 C117.781,188.8169 118.0229,188.9281 118.2653,189.0395 C118.7503,189.2624 119.2378,189.4864 119.7277,189.7115 C120.7076,190.1618 121.6971,190.6165 122.6957,191.0754 C124.693,191.9932 126.7266,192.9277 128.7916,193.8766 C132.9215,195.7744 137.1766,197.7298 141.5168,199.7242 C150.1971,203.7131 153.7655,205.3529 162.8035,209.5061" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0010" data-entity-2="ent0011" data-link-type="dependency" id="lnk15"><polygon fill="#475569" points="408.7218,249.4704,399.5291,245.9356,403.7284,249.7259,399.9381,253.9252,408.7218,249.4704" style="stroke:#475569;stroke-width:1;"/><path d="M364.6137,251.7279 C379.0388,250.9896 388.0171,250.53 402.7297,249.777" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0010" data-entity-2="ent0012" data-link-type="dependency" id="lnk16"><polygon fill="#475569" points="437.2931,301.4862,429.611,295.323,432.4584,300.2109,427.5705,303.0584,437.2931,301.48