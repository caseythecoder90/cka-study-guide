<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="342px" preserveAspectRatio="none" style="width:856px;height:342px;background:#FFFFFF;" version="1.1" viewBox="0 0 856 342" width="856px" zoomAndPan="magnify"><title>A taint keeps Pods out. A toleration lets a Pod in, but does not send it there</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="645.0645" x="97.9678" y="30.8838">A taint keeps Pods out. A toleration lets a Pod in, but does not send it there</text></g><!--cluster pods--><g class="cluster" data-qualified-name="pods" data-source-line="4" id="ent0002"><rect fill="#F8FAFC" height="194" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="210" x="14" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="31.7827" x="103.1086" y="71.8921">Pods</text></g><!--cluster n3--><g class="cluster" data-qualified-name="n3" data-source-line="10" id="ent0006"><rect fill="#F0FDF4" height="97" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="176" x="490" y="150.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="38.2827" x="558.8586" y="168.8921">node2</text></g><!--cluster n2--><g class="cluster" data-qualified-name="n2" data-source-line="14" id="ent0008"><rect fill="#F0FDF4" height="97" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="176" x="674" y="150.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="38.2827" x="742.8586" y="168.8921">node3</text></g><!--cluster n1--><g class="cluster" data-qualified-name="n1" data-source-line="18" id="ent0010"><rect fill="#FEF2F2" height="186" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="250" x="232" y="150.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="38.2827" x="337.8586" y="168.8921">node1</text></g><!--entity abc--><g class="entity" data-qualified-name="pods.abc" data-source-line="5" id="ent0003"><rect fill="#F1F5F9" height="55.5977" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="94.043" x="72" y="86.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="41.1772" x="86" y="112.8921">A, B, C</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="66.043" x="86" y="125.9648">no tolerations</text></g><!--entity d--><g class="entity" data-qualified-name="pods.d" data-source-line="6" id="ent0004"><rect fill="#326CE5" height="55.5977" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="192.7314" x="22.5" y="183.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="9.3882" x="36.5" y="209.8921">D</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="164.7314" x="36.5" y="222.9648">tolerates app=blue:NoSchedule</text></g><!--entity n3a--><g class="entity" data-qualified-name="n3.n3a" data-source-line="11" id="ent0007"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="125.1738" x="532.5" y="183.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="48.3818" x="546.5" y="209.8921">No taint</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="97.1738" x="546.5" y="222.9648">allowed: A, B, C, D</text></g><!--entity n2a--><g class="entity" data-qualified-name="n2.n2a" data-source-line="15" id="ent0009"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="125.1738" x="716.5" y="183.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="48.3818" x="730.5" y="209.8921">No taint</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="97.1738" x="730.5" y="222.9648">allowed: A, B, C, D</text></g><!--entity n1a--><g class="entity" data-qualified-name="n1.n1a" data-source-line="19" id="ent0011"><rect fill="#FEE2E2" height="55.5977" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="199.5454" x="274" y="183.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="171.5454" x="288" y="209.8921">Taint app=blue:NoSchedule</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="80.6738" x="288" y="222.9648">allowed: D only</text></g><!--entity l1--><g class="entity" data-qualified-name="n1.l1" data-source-line="20" id="ent0012"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="196.915" x="260.5" y="300.0161">D can still be placed on node2 or node3.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="199.3643" x="260.5" y="312.665">To send it to node1, add node affinity too</text></g><?plantuml-src hP91Rzim38Nl_XLSpeu39xSWCz0sG6z5WVQsxK1Bh2DK8GsBHj4M---JdSnLKnyB-20yojzxfFZ3iV6z9IYArUbJ4HzMrc7JuJ6ip3CkzK17Ajh-w3DrwWckGD6nmZDH6-1UR03fjHXqyTIXEc7mf05mg8BZ7EfUmGe5O548n55