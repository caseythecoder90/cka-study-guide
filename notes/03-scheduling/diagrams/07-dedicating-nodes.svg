<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="248px" preserveAspectRatio="none" style="width:940px;height:248px;background:#FFFFFF;" version="1.1" viewBox="0 0 940 248" width="940px" zoomAndPan="magnify"><title>Dedicating nodes: each mechanism closes one gap</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="441.1318" x="241.9341" y="30.8838">Dedicating nodes: each mechanism closes one gap</text></g><!--cluster g1--><g class="cluster" data-qualified-name="g1" data-source-line="4" id="ent0002"><rect fill="#FEF2F2" height="189" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="320" x="14" y="53.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="165.4072" x="91.2964" y="71.8921">Taints and tolerations only</text></g><!--cluster g2--><g class="cluster" data-qualified-name="g2" data-source-line="10" id="ent0006"><rect fill="#FEF2F2" height="189" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="284" x="342" y="53.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="109.0591" x="429.4705" y="71.8921">Node affinity only</text></g><!--cluster g3--><g class="cluster" data-qualified-name="g3" data-source-line="16" id="ent0010"><rect fill="#F0FDF4" height="176" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="300" x="634" y="60.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="29.5991" x="769.2004" y="78.3921">Both</text></g><!--entity a1--><g class="entity" data-qualified-name="g1.a1" data-source-line="5" id="ent0003"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="197.3809" x="101.5" y="86.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="169.3809" x="115.5" y="112.8921">node-red: tainted color=red</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="140.7495" x="115.5" y="125.9648">other teams' Pods kept out</text></g><!--entity a2--><g class="entity" data-qualified-name="g1.a2" data-source-line="6" id="ent0004"><rect fill="#FEE2E2" height="55.5977" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="303.6284" x="22" y="178.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="240.0112" x="36" y="204.8921">Red Pod lands on another team's node</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="275.6284" x="36" y="217.9648">the toleration allows node-red but does not require it</text></g><!--entity b1--><g class="entity" data-qualified-name="g2.b1" data-source-line="11" id="ent0007"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="203.1763" x="384.5" y="86.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="175.1763" x="398.5" y="112.8921">node-red: labelled color=red</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="147.9038" x="398.5" y="125.9648">red Pod required to go there</text></g><!--entity b2--><g class="entity" data-qualified-name="g2.b2" data-source-line="12" id="ent0008"><rect fill="#FEE2E2" height="55.5977" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="266.5576" x="350.5" y="178.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="238.5576" x="364.5" y="204.8921">Another team's Pod lands on node-red</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="152.1685" x="364.5" y="217.9648">nothing keeps other Pods off</text></g><!--entity c1--><g class="entity" data-qualified-name="g3.c1" data-source-line="17" id="ent0011"><rect fill="#DCFCE7" height="42.9487" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="250.4663" x="676" y="93.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="222.4663" x="690" y="119.3921">Taint keeps other Pods off node-red</text></g><!--entity c2--><g class="entity" data-qualified-name="g3.c2" data-source-line="18" id="ent0012"><rect fill="#DCFCE7" height="42.9487" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="267.0781" x="658.5" y="185.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="239.0781" x="672.5" y="211.3921">Affinity keeps the red Pod on node-red</text></g><?plantuml-src TP9FRzim3CNl_XHSBpqbWTDRa1bOCM2teIXwMtUW9KOM8ekk9AFeXdttKiwVsKu2w4IHZ-_zf2_MAzThWkLoTJY9sSMLjcW2jd6bzhX83RMqxFhM5SacH_2Tj5MOh3VWMLFS0A5ge2NLeBUn1UKuKWJs10QxeWYa4deZetSlQ7sAW5v3OaT1PDZdLlTn1zkj2TntZwYh2Z22AU5l0J0Qp_iMWVG6KXOY3OeTXwzIUlNRQF_GfYmh5ii14ac2UtXY7M5FNGBkqtQLUwfX5VDn3PRJ9SyYArFWn6Ms9cx_Azx78VHecroDiW0wn--7fkmKwZw1PigL95lUUXi8xDX9VSgBQp629In-DLPhyhyrl_j5bUl_9XH_YZZWRcUzJH-tuArlmtDOatCtw8LZ_AFN_51W6381kigldl7xDiKrGNdoCDgNk_DVsXDrqZEC3e_6kzqrIdMcL5zIgkUK7aNhpEN7sQvvc8CPFkNL_MU_qyHgdlZq50UD_2DE54UPPnevXhgCeOOOPdGHh6cIt9Xr8OzwMNxu1000?></g></svg>