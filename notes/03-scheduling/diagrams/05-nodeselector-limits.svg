<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="340px" preserveAspectRatio="none" style="width:544px;height:340px;background:#FFFFFF;" version="1.1" viewBox="0 0 544 340" width="544px" zoomAndPan="magnify"><title>What nodeSelector can and cannot express</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="373.0957" x="77.9521" y="30.8838">What nodeSelector can and cannot express</text></g><!--cluster g1--><g class="cluster" data-qualified-name="g1" data-source-line="4" id="ent0002"><rect fill="#F0FDF4" height="281" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="244" x="14" y="53.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="147.3545" x="62.3228" y="71.8921">nodeSelector is enough</text></g><!--cluster g2--><g class="cluster" data-qualified-name="g2" data-source-line="12" id="ent0008"><rect fill="#FEF2F2" height="281" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="272" x="266" y="53.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="127.8481" x="338.0759" y="71.8921">Node affinity needed</text></g><!--entity a1--><g class="entity" data-qualified-name="g1.a1" data-source-line="5" id="ent0003"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="170.4307" x="68" y="86.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="74.7881" x="82" y="112.8921">size = Large</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="142.4307" x="82" y="125.9648">nodeSelector: {size: Large}</text></g><!--entity a2--><g class="entity" data-qualified-name="g1.a2" data-source-line="6" id="ent0004"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="228.1353" x="22" y="178.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="200.1353" x="36" y="204.8921">size = Large AND disktype = ssd</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="153.4521" x="36" y="217.9648">every listed label must match</text></g><!--entity a3--><g class="entity" data-qualified-name="g1.a3" data-source-line="7" id="ent0005"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="199.7622" x="36" y="270.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="152.4326" x="50" y="296.8921">A specific node by name</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="171.7622" x="50" y="309.9648">kubernetes.io/hostname: node01</text></g><!--entity b1--><g class="entity" data-qualified-name="g2.b1" data-source-line="13" id="ent0009"><rect fill="#FEE2E2" height="55.5977" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="221.1392" x="308.5" y="86.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="153.8735" x="322.5" y="112.8921">size is Large OR Medium</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="193.1392" x="322.5" y="125.9648">operator: In, values: [Large, Medium]</text></g><!--entity b2--><g class="entity" data-qualified-name="g2.b2" data-source-line="14" id="ent0010"><rect fill="#FEE2E2" height="55.5977" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="191.1899" x="323.5" y="178.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="108.3735" x="337.5" y="204.8921">size is NOT Small</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="163.1899" x="337.5" y="217.9648">operator: NotIn, values: [Small]</text></g><!--entity b3--><g class="entity" data-qualified-name="g2.b3" data-source-line="15" id="ent0011"><rect fill="#FEE2E2" height="55.5977" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="220.1626" x="309" y="270.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="192.1626" x="323" y="296.8921">Prefer Large, but run anywhere</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="152.1846" x="323" y="309.9648">preferredDuringScheduling...</text></g><?plantuml-src TP9HQzim4CVV_IbkVMxiENqBcQ6ZC0PREfR17he-dAoB929BHZgroqg_-sobBSxYWK7MwN_tlzDFxunhRP84PLaTF_RUnaeQL06xMBLxNB2cZie-TRPWmvRWfqO6voLjoLBBFa2B3j39SNMUWNxtWM8iYZ0SerD3piM9taGWvvFI5x1Ug-1J_ybxsJI04LGDJmN093MQFmGVu0i6HR_SUjokwhgPLbp1KmuVHS_hQjmrkVfROQp_NnQkDpSWJTppeH-3CSg94prGE80raKc2HK4MkXGPEkHMptijJxsk8VRKcfrfyyM1E833RZhDFWaAZfXYQNobVUHHiChoz_MyoTLWWZKixhIHajozz8zkqHpDSNaUlogUJvXinbPmjpFEyD0GaIJvHkGZlW9PpW8P61wlxlOxV2LfKZUPnlSKC7Fvx2xX0MsYk8Axd73v8h-V32LUpKGzRxMv_G7R3gsTDTbuFl79oldw_u3v5cX70LuQ4uaXfF4j7nurXIcVFWi3oPiKZ5FRLfDCTlWhotBMQ8GZpk7a1iGv797Xg4b2C4hpSAAMVm40?></g></svg>