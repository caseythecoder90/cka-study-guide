<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="361px" preserveAspectRatio="none" style="width:584px;height:361px;background:#FFFFFF;" version="1.1" viewBox="0 0 584 361" width="584px" zoomAndPan="magnify"><title>Placing a Pod on a node without the scheduler</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="399.041" x="84.9795" y="30.8838">Placing a Pod on a node without the scheduler</text></g><!--cluster g1--><g class="cluster" data-qualified-name="g1" data-source-line="4" id="ent0002"><rect fill="#F8FAFC" height="199.5" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="298" x="14" y="59.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="66.4473" x="129.7764" y="77.8921">A new Pod</text></g><!--cluster g2--><g class="cluster" data-qualified-name="g2" data-source-line="10" id="ent0006"><rect fill="#F8FAFC" height="302" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="258" x="320" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="209.498" x="344.251" y="71.8921">A Pending Pod that already exists</text></g><!--entity a1--><g class="entity" data-qualified-name="g1.a1" data-source-line="5" id="ent0003"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="246.8926" x="56.5" y="92.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="218.8926" x="70.5" y="118.8921">Set spec.nodeName in the manifest</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="132.0215" x="70.5" y="131.9648">kubectl apply -f pod.yaml</text></g><!--entity l1--><g class="entity" data-qualified-name="g1.l1" data-source-line="6" id="ent0004"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="192.0005" x="84" y="222.5161">Easiest. The scheduler ignores the Pod</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="192.0166" x="84" y="235.165">and NoSchedule taints are not checked</text></g><!--entity b1--><g class="entity" data-qualified-name="g2.b1" data-source-line="11" id="ent0007"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="207.0991" x="362.5" y="86.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="61.4136" x="376.5" y="112.8921">Replace it</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="146.0615" x="376.5" y="125.9648">add nodeName to the YAML</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="179.0991" x="376.5" y="138.6138">kubectl replace --force -f pod.yaml</text></g><!--entity b2--><g class="entity" data-qualified-name="g2.b2" data-source-line="12" id="ent0008"><rect fill="#EFF6FF" height="68.2466" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="156.3638" x="385" y="190.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="117.0063" x="399" y="216.8921">Or POST a Binding</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="127.1177" x="399" y="229.9648">to pods/&lt;name&gt;/binding</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="128.3638" x="399" y="242.6138">what the scheduler does</text></g><!--entity l2--><g class="entity" data-qualified-name="g2.l2" data-source-line="13" id="ent0009"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="190.7974" x="364.5" y="319.0161">kubectl edit cannot change nodeName:</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="114.936" x="364.5" y="331.665">it is immutable once set</text></g><?plantuml-src XL9VQwD047_FfvZBkue-5X5wS6ztRRZqfRJtCBeJNRBkokv8cZlwtJjhqc1YuK1GrfdVt_scRMD6HP2csUbXvqp8bCRMOn-oPey9TzHJEeozMR5cGx0ns6ZR0iB6AN1MFgmJa8FcpeqCiW2XwKYDXlngvQbXjAqihk_1qY5khQ4iM-_6eQe00xGv_5i1p2Qtn106QjA8_80zWROJS8zMxoZmgos3_ajtULxjnreM3U0mc2CaEnYSIe_OcpAB8zL4vfmwSM4kJ0PhCh2-GFp0e0KqXQUvTj2jTPx2H2ogptWpQhGA7jpsl02Csh9GU9946EIusPEwo11s4zanX-IbqqgH_QFSmIPLF7-_YMf3LiMOOyZS8GCQJwYEG6ywSBYDiBYDy3SDKfG4DyyAbO9BfEmcPy_tltukhNscwiymIR9pFhx_as-TNyjuzB1vt3x99Vck9qCp3X4WM24hhSYfileqiDHoYFQlhXKeHs4UR5ryKUkd1r9Qsa1xAaM4qIM4koMRpEe0kkz7nbeiE2ks0_5LZv6kNlOuoQYBPRz5xBUTBNZTTYn_sk83?></g></svg>