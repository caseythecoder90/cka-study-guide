<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="148px" preserveAspectRatio="none" style="width:1085px;height:148px;background:#FFFFFF;" version="1.1" viewBox="0 0 1085 148" width="1085px" zoomAndPan="magnify"><title>Where each resource setting takes effect</title><defs/><g><g class="title" data-source-line="3"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="350.1387" x="363.9307" y="30.8838">Where each resource setting takes effect</text></g><!--entity create--><g class="entity" data-qualified-name="create" data-source-line="5" id="ent0002"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="98.1035" x="6" y="74.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="70.1035" x="20" y="100.3921">Pod created</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="64.2061" x="20" y="113.4648">kubectl apply</text></g><!--entity lr--><g class="entity" data-qualified-name="lr" data-source-line="6" id="ent0003"><rect fill="#326CE5" height="80.8955" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="196.083" x="140" y="61.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="70.7827" x="154" y="87.8921">LimitRange</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="130.2007" x="154" y="100.9648">admission, per container</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="168.083" x="154" y="113.6138">fill in default requests and limits</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="135.0938" x="154" y="126.2627">reject if outside min / max</text></g><!--entity rq--><g class="entity" data-qualified-name="rq" data-source-line="7" id="ent0004"><rect fill="#326CE5" height="80.8955" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="175.9414" x="372" y="61.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="96.8018" x="386" y="87.8921">ResourceQuota</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="140.6152" x="386" y="100.9648">admission, per namespace</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="147.9414" x="386" y="113.6138">reject if the namespace total</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="99.0269" x="386" y="126.2627">would exceed hard</text></g><!--entity sched--><g class="entity" data-qualified-name="sched" data-source-line="8" id="ent0005"><rect fill="#EFF6FF" height="80.8955" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="241.646" x="584" y="61.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="62.8545" x="598" y="87.8921">Scheduler</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="99.6499" x="598" y="100.9648">uses requests only</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="213.646" x="598" y="113.6138">node free = allocatable - sum of requests</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="183.3315" x="598" y="126.2627">none fits: Pending, Insufficient cpu</text></g><!--entity node--><g class="entity" data-qualified-name="node" data-source-line="9" id="ent0006"><rect fill="#EFF6FF" height="80.8955" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="217.4761" x="862" y="61.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="154.5908" x="876" y="87.8921">Node: kernel and kubelet</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="126.5054" x="876" y="100.9648">CPU over limit: throttled</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="157.7007" x="876" y="113.6138">memory over limit: OOMKilled</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="189.4761" x="876" y="126.2627">node short of memory: evict by QoS</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" id="lnk7"><polygon fill="#475569" points="139.7095,102.1982,130.7095,98.1982,134.7095,102.1982,130.7095,106.1982,139.7095,102.1982" style="stroke:#475569;stroke-width:1;"/><path d="M104.0295,102.1982 C115.1309,102.1982 121.3351,102.1982 133.7095,102.1982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" id="lnk8"><polygon fill="#475569" points="371.749,102.1982,362.749,98.1982,366.749,102.1982,362.749,106.1982,371.749,102.1982" style="stroke:#475569;stroke-width:1;"/><path d="M336.1356,102.1982 C347.9917,102.1982 354.0498,102.1982 365.749,102.1982" fil