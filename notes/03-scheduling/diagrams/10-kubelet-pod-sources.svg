<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="340px" preserveAspectRatio="none" style="width:808px;height:340px;background:#FFFFFF;" version="1.1" viewBox="0 0 808 340" width="808px" zoomAndPan="magnify"><title>Where the kubelet gets Pods from</title><defs/><g><g class="title" data-source-line="3"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="291.0498" x="250.9751" y="30.8838">Where the kubelet gets Pods from</text></g><!--cluster src--><g class="cluster" data-qualified-name="src" data-source-line="5" id="ent0002"><rect fill="#F8FAFC" height="281" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="215" x="14" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="78.0254" x="82.4873" y="71.8921">Pod sources</text></g><!--entity kubelet--><g class="entity" data-qualified-name="kubelet" data-source-line="13" id="ent0008"><rect fill="#326CE5" height="55.5977" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="196.0938" x="305" y="178.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="45.5127" x="319" y="204.8921">kubelet</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="168.0938" x="319" y="217.9648">runs Pods from all three at once</text></g><!--entity cri--><g class="entity" data-qualified-name="cri" data-source-line="15" id="ent0009"><rect fill="#EFF6FF" height="68.2466" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="183.2676" x="603.5" y="125.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="101.1118" x="617.5" y="151.8921">containerd (CRI)</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="155.2676" x="617.5" y="164.9648">pulls images, runs containers</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="137.5322" x="617.5" y="177.6138">crictl ps shows all of them</text></g><!--entity mirror--><g class="entity" data-qualified-name="mirror" data-source-line="17" id="ent0010"><rect fill="#F1F5F9" height="80.8955" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="214.4683" x="588" y="212.1982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="160.3862" x="602" y="238.3921">Mirror Pod in the API server</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="92.9307" x="602" y="251.4648">for static Pods only</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="177.9551" x="602" y="264.1138">name: &lt;pod&gt;-&lt;node&gt; &#183; owner: Node</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="186.4683" x="602" y="276.7627">kubectl delete removes only the mirror</text></g><!--entity dir--><g class="entity" data-qualified-name="src.dir" data-source-line="6" id="ent0003"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="198.5752" x="22" y="258.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="145.9263" x="36" y="284.8921">staticPodPath directory</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="170.5752" x="36" y="297.9648">/etc/kubernetes/manifests/*.yaml</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="90.4492" x="36" y="310.6138">files on this node</text></g><!--entity url--><g class="entity" data-qualified-name="src.url" data-source-line="7" id="ent0004"><rect fill="#F1F5F9" height="68.2466" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="160.0645" x="41.5" y="172.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="79.479" x="55.5" y="198.8921">staticPodURL</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="132.0645" x="55.5" y="211.9648">a manifest on a web server</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="54.4146" x="55.5" y="224.6138">rarely used</text></g><!--entity api--><g class="entity" data-qualified-name="src.api" data-source-line="8" id="ent0005"><rect fill="#EFF6FF" height="68.2466" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="198.8384" x="22" y="86.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="92.4917" x="36" y="112.8921">kube-apiserver</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="152.2007" x="36" y="125.9648">the kubelet watches for Pods</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="170.8384" x="36" y="138.6138">with spec.nodeName = this node</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0008" data-link-type="dependency" id="lnk11"><polygon fill="#475569" points="310.8891,234.7324,301.1108,233.556,306.1102,236.2028,303.4635,241.2022,310.8891,234.7324" style="stroke:#475569;stroke-width:1;"/><path d="M221.0412,262.3779 C250.2744,253.383 276.4149,245.3398 305.1545,236.4969" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="28.0078" x="249" y="235.9541">static</text></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0008" data-link-type="dependency" id="lnk12"><polygon fill="#475569" points="304.8053,206.6982,295.8053,202.6982,299.8053,206.6982,295.8053,210.6982,304.8053,206.6982" style="stroke:#475569;stroke-width:1;"/><path d="M201.8459,206.6982 C233.8821,206.6982 265.1624,206.6982 298.8053,206.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="28.0078" x="249" y="198.9541">static</text></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0008" data-link-type="dependency" id="lnk13"><polygon fill="#475569" points="310.8891,178.6641,303.4635,172.1942,306.1102,177.1937,301.1108,179.8405,310.8891,178.6641" style="stroke:#475569;stroke-width:1;"/><path d="M221.0412,151.0186 C250.2744,160.0134 276.4149,168.0567 305.1545,176.8996" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="36.6797" x="245" y="150.9541">normal</text></g><g class="link" data-entity-1="ent0008" data-entity-2="ent0009" data-link-type="dependency" id="lnk14"><polygon fill="#475569" points="603.2489,174.4062,593.7249,171.8975,598.3133,175.2061,595.0048,179.7945,603.2489,174.4062" style="stroke:#475569;stroke-width:1;"/><path d="M501.3725,190.9172 C534.2819,185.5836 564.9508,180.6131 597.3262,175.3661" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0008" data-entity-2="ent001