<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="270px" preserveAspectRatio="none" style="width:989px;height:270px;background:#FFFFFF;" version="1.1" viewBox="0 0 989 270" width="989px" zoomAndPan="magnify"><title>nodeSelectorTerms are ORed. Expressions inside one term are ANDed</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="605.2061" x="184.647" y="30.8838">nodeSelectorTerms are ORed. Expressions inside one term are ANDed</text></g><!--cluster terms--><g class="cluster" data-qualified-name="terms" data-source-line="4" id="ent0002"><rect fill="#F8FAFC" height="210.5" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="574" x="14" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="121.3735" x="240.3132" y="71.8921">nodeSelectorTerms</text></g><!--cluster t2--><g class="cluster" data-qualified-name="terms.t2" data-source-line="5" id="ent0003"><rect fill="#F0FDF4" height="84" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="300" x="280" y="86.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="176.249" x="341.8755" y="104.8921">Term 2: this alone is enough</text></g><!--cluster t1--><g class="cluster" data-qualified-name="terms.t1" data-source-line="8" id="ent0005"><rect fill="#F0FDF4" height="169.5" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="222" x="22" y="86.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="160.3481" x="52.8259" y="104.8921">Term 1: both must be true</text></g><!--entity result--><g class="entity" data-qualified-name="result" data-source-line="16" id="ent0010"><rect fill="#326CE5" height="55.5977" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="386.8105" x="596.5" y="198.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="283.9116" x="610.5" y="224.8921">A node qualifies if Term 1 OR Term 2 matches</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="358.8105" x="610.5" y="237.9648">(size is Large or Medium AND it has a disktype label) OR it is node09</text></g><!--entity e3--><g class="entity" data-qualified-name="terms.t2.e3" data-source-line="6" id="ent0004"><rect fill="#DCFCE7" height="42.9487" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="250.4854" x="322" y="119.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="222.4854" x="336" y="145.8921">kubernetes.io/hostname In [node09]</text></g><!--entity e1--><g class="entity" data-qualified-name="terms.t1.e1" data-source-line="9" id="ent0006"><rect fill="#DCFCE7" height="42.9487" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="171.7427" x="64" y="119.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="143.7427" x="78" y="145.8921">size In [Large, Medium]</text></g><!--entity e2--><g class="entity" data-qualified-name="terms.t1.e2" data-source-line="10" id="ent0007"><rect fill="#DCFCE7" height="42.9487" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="122.6563" x="88.5" y="205.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="94.6563" x="102.5" y="231.3921">disktype Exists</text></g><g class="link" data-en