<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="403px" preserveAspectRatio="none" style="width:458px;height:403px;background:#FFFFFF;" version="1.1" viewBox="0 0 458 403" width="458px" zoomAndPan="magnify"><title>Finding the static Pod directory on a node</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="360.0264" x="41.4868" y="30.8838">Finding the static Pod directory on a node</text></g><!--cluster opts--><g class="cluster" data-qualified-name="opts" data-source-line="7" id="ent0004"><rect fill="#F8FAFC" height="109" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="438" x="14" y="204.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="148.8271" x="158.5864" y="222.8921">Two places it can be set</text></g><!--entity s1--><g class="entity" data-qualified-name="s1" data-source-line="4" id="ent0002"><rect fill="#EFF6FF" height="42.9487" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="254.0527" x="117" y="61.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="226.0527" x="131" y="87.8921">ssh to the node the Pod must run on</text></g><!--entity s2--><g class="entity" data-qualified-name="s2" data-source-line="5" id="ent0003"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="161.6689" x="163" y="140.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="133.6689" x="177" y="166.8921">ps -aux | grep kubelet</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="121.8218" x="177" y="179.9648">read the kubelet's flags</text></g><!--entity done--><g class="entity" data-qualified-name="done" data-source-line="13" id="ent0008"><rect fill="#326CE5" height="55.5977" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="230.9727" x="128.5" y="341.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="202.9727" x="142.5" y="367.8921">Put the manifest in that directory</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="154.6392" x="142.5" y="380.9648">or remove it to delete the Pod</text></g><!--entity flag--><g class="entity" data-qualified-name="opts.flag" data-source-line="8" id="ent0005"><rect fill="#F1F5F9" height="68.2466" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="178.6616" x="264.5" y="237.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="150.6616" x="278.5" y="263.8921">--pod-manifest-path=&lt;dir&gt;</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="75.8345" x="278.5" y="276.9648">deprecated flag</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="124.1099" x="278.5" y="289.6138">the directory is right there</text></g><!--entity cfg--><g class="entity" data-qualified-name="opts.cfg" data-source-line="9" id="ent0006"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="224.2168" x="22" y="237.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="89.21" x="36" y="263.8921">--config=&lt;file&gt;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="196.2168" x="36" y="276.9648">kubeadm: /var/lib/kubelet/config.yaml</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="132.0376" x="36" y="289.6138">grep staticPodPath &lt;file&gt;</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" id="lnk9"><polygon fill="#475569" points="244,140.6747,248,131.6747,244,135.6747,240,131.6747,244,140.6747" style="stroke:#475569;stroke-width:1;"/><path d="M244,104.8387 C244,115.6566 244,123.0406 244,134.6747" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0006" data-link-type="dependency" id="lnk10"><polygon fill="#475569" points="170.2396,237.4237,179.5743,234.2832,173.9225,234.0421,174.1636,228.3904,170.2396,237.4237" style="stroke:#475569;stroke-width:1;"/><path d="M214.522,196.7644 C200.9032,209.2689 189.0214,220.1786 174.6591,233.3658" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="dependency" id="lnk11"><polygon fill="#475569" points="317.7604,237.4237,313.8364,228.3904,314.0775,234.0421,308.4257,234.2832,317.7604,237.4237" style="stroke:#475569;stroke-width:1;"/><path d="M273.478,196.7644 C287.0968,209.2689 298.9786,220.1786 313.3409,233.3658" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0006" data-entity-2="ent0008" data-link-type="dependency" id="lnk12"><polygon fill="#475569" points="213.002,341.6454,208.8513,332.7139,209.2349,338.3578,203.591,338.7413,213.002,341.6454" style="stroke:#475569;stroke-width:1;"/><path d="M171.8558,305.736 C185.2794,317.4512 195.6965,326.5424 208.4815,337.7002" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0005